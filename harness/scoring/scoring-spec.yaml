# Scoring spec — how each coreset file's records are valued (Phase 6 spec,
# decisions 5–15; reworked on the rebuilt dataset in sub-task 9.14, decisions
# 5–6; vocabulary: docs/harness/metrics.md §6, §8, §9).
#
# One term: entity (a task id from the compiled workload, or lane/schedule),
# metric (the primitive), cause (ready_wait filter), channel (the kind of the
# WAIT a wake completed — since 2026-10-09 every interaction-latency term names
# one: `input` where the task has a keystroke stream, so operations' and
# timers' wakes do not read as keystrokes; `timer` on the fourteen terms of the
# video editor (kdenlive) and the image editor (GIMP), whose measured driven
# phases are mouse-driven operations carried as the applications' own timer
# components (9.5) — no keystroke stream exists for them, so their foreground
# term reads the wait of their own wakes, the application's responsiveness
# rather than a keystroke's echo, as it did before the channel was named; the
# T_interaction threshold line (metrics doc §10) reads the input channel alone),
# window (a filter on t; absent = the whole file; present, it is a ground-truth
# segment of the file, which the lint checks), aggregate, direction (fixed by
# the aggregate), weight. A file's score = the weighted sum of its terms'
# normalised shares (fixed − condition)/(fixed − oracle), sign by direction,
# per aggregate. Every other aggregate of metrics doc §8 is reported beside
# the score, unweighted.
#
# This file carries terms only. Which files judge, report, are read as deltas,
# or are excluded from aggregation is the RQ0 gate spec's (Phase 8, 9.14).
# c1-idle and c7-idle have no entry: no performance metric. A derived file
# declares `base` and repeats the base's terms verbatim (the lint checks both
# against dataset/timelines/coreset). Unwanted work carries no term (Phase 7
# spec decision 10): a counterpart whose label flips the base's
# background_wanted to false repeats the base's terms minus the batch terms
# (turnaround, progress). A term reads a task that moves under some row: a
# job that finishes under every row scores its turnaround, one that cannot
# finish inside its file scores its delivered CPU (9.14 decision 6).
#
# Expected "no headroom" (metrics doc §9 floors), stated here so it is not
# discovered later, on the rebuilt files and the ratified executor (9.14):
# - the six files holding idle-class work — c1-indexing, c7-indexing, c2-p1b
#   (the Tracker indexer), c1-backup, c7-backup, c2-p3b (the Déjà Dup backup):
#   the executor runs an idle task only when no other-class task is runnable
#   and the cap is work-conserving, so no row reaches the background task; its
#   turnaround or progress is identical under every row and the editor's wait
#   is untouched by it. A consequence of the rule, not of the depicted
#   desktop, where the indexer's slice would take about 23 % (9.11 D16). All
#   six are reporting-only (RQ0 gate spec).
# - c1-media, the C5 ladder and c1-meeting: the periodic tasks alone or beside
#   light company; the measured players' and call's jobs miss only their own
#   overruns (the call in about 5 % of its cycles) under any row.
# - c7-media: the video job's worst cycle is 16.0 ms of run against a 33.3 ms
#   period and the longest wait the boot MLFQ imposes on it is one 20 ms Q1
#   slice after a rare demotion, 32 ms in all; the music job's 2.4 ms against
#   49.6 ms never comes near. A 1.3 ms margin, a knife edge stated.
# - c2-p2a's download: batch class now (the measured SteamCMD runs back to back),
#   but the chain takes 0.95 of the lane under EDF so the residual is below any
#   cap, and the boot MLFQ hands it more through its boost slices — the oracle's
#   improvement is negative and reads as no headroom.
# - c3-creation's transcode: uncontended after 240 s but for the editor's idle
#   wakes, so the cap barely bites.
# - c7-mail: its cut holds no keystroke, so its term reads the mailer's own
#   wakes and the file is reporting-only; the mail mode's attribute pair is
#   unmeasured (9.14 decision 2 as amended).
# - c3-evening's chain term stays scored on a reporting-only file: its 1.45
#   lane share is design (9.10 D31), a chain that cannot meet its frames alone,
#   so under the TIMER skip rule the term reads the policies' ordering above a
#   floor of about 0.31 missed under every policy.
# c7-meeting is not on this list any more: the measured call's cycle run
# consumes the boot slice in about a fifth of its cycles and is demoted, so
# the tie with fixed that held on the old 2.5 ms and 6.67 ms bursts is gone.
# The audio : video weighting 1.0 : 0.5 on the media files is a stated
# assumption (an audio dropout is heard at once; a dropped frame at 60 Hz
# often is not).

files:

  # ---- C1 — single-situation calibration
  c1-office:
    terms:
      - {entity: writer, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c1-browsing:
    terms:
      - {entity: browser, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c1-compile:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: build, metric: turnaround, aggregate: turnaround, direction: lower, weight: 1.0}
  c1-gaming:
    # the chain alone since 9.9 retired the compositor task; game.chain.1 is the head of the 17-member chain
    terms:
      - {entity: game.chain.1, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
  c1-media:
    terms:
      - {entity: music, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: video, metric: job, aggregate: miss_rate, direction: lower, weight: 0.5}

  # ---- C1, Phase 7 bases (spec decision 9): the pattern by mode class with the
  # weight the mode's existing instance carries. Interactive-only modes score the
  # foreground's P99; periodic modes the consumer's miss rate (audio 1.0, video
  # 0.5 as c1-media; the measured call is one task, `voice`, one job per 10 ms
  # audio frame); batch-beside-editor modes the editor's P99 plus the job's
  # turnaround at the mode's weight (ml-train/render/transcode 0.5 from the C2
  # and C3 progress terms, backup 0.25 from c2-p3b). c1-indexing's turnaround at
  # 1.0 is a stated assumption — a user waiting on a reindex as c1-compile's
  # user waits on a build — and makes the indexing/true cap derived, not assumed.
  c1-dev:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c1-video-edit:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c1-photo:
    terms:
      - {entity: photo-editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c1-mail:
    terms:
      - {entity: mailer, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c1-meeting:
    terms:
      - {entity: voice, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
  c1-ml-train:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: hog, metric: turnaround, aggregate: turnaround, direction: lower, weight: 0.5}
  c1-render:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: bulk, metric: turnaround, aggregate: turnaround, direction: lower, weight: 0.5}
  c1-transcode:
    terms:
      - {entity: video-editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: batch, metric: turnaround, aggregate: turnaround, direction: lower, weight: 0.5}
  c1-indexing:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: hog, metric: turnaround, aggregate: turnaround, direction: lower, weight: 1.0}
  c1-backup:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: bulk, metric: turnaround, aggregate: turnaround, direction: lower, weight: 0.25}

  # ---- C2 — intent pairs. Latency and frame terms over the second segment,
  # 60 s to the file's end — each window is that ground-truth segment, which the
  # lint checks (9.14 decision 5); the files end where 9.10 bound their jobs:
  # 99.435 s (P1), 86.385 s (P2), 326 s (P3). Progress terms unwindowed (the batch
  # task arrives at 60 s and does not finish inside the file); the P3 render
  # finishes under every row and scores its turnaround (9.14 decision 6).
  c2-p1a:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, window: {start_us: 60000000, end_us: 99435000}, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: hog, metric: cpu_delivered, aggregate: progress, direction: higher, weight: 0.5}
  c2-p1b:
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, window: {start_us: 60000000, end_us: 99435000}, aggregate: p99, direction: lower, weight: 1.0}
  c2-p2a:
    # The download is batch class (the measured SteamCMD, 9.7, runs back to back); under EDF the
    # deadline-class chain takes 0.95 of the lane, so the residual it gets is below any cap and the
    # progress term is expected "no headroom" (the header; 9.14 decision 6).
    terms:
      - {entity: game.chain.1, metric: job, window: {start_us: 60000000, end_us: 86385000}, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: download, metric: cpu_delivered, aggregate: progress, direction: higher, weight: 0.5}
  c2-p2a-idle:
    # the bounding check's idle half (9.11 D21; 9.13 D4): c2-p2a with the download in the idle
    # class and nothing else changed; outside the judging set, scored like its base
    base: c2-p2a
    terms:
      - {entity: game.chain.1, metric: job, window: {start_us: 60000000, end_us: 86385000}, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: download, metric: cpu_delivered, aggregate: progress, direction: higher, weight: 0.5}
  c2-p2b:
    terms:
      - {entity: game.chain.1, metric: job, window: {start_us: 60000000, end_us: 86385000}, aggregate: miss_rate, direction: lower, weight: 1.0}
  c2-p3a:
    # Kdenlive's measured export, 16.5 s of CPU in a 266 s segment, finishes under every row, so its
    # delivered CPU cannot move; its turnaround can (9.14 decision 6), at the render mode's weight.
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, window: {start_us: 60000000, end_us: 326000000}, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: bulk, metric: turnaround, aggregate: turnaround, direction: lower, weight: 0.5}
  c2-p3b:
    # the idle-class backup gets the editor's idle lane only, about 162 s of its 165.7 s, and does
    # not finish: progress, expected "no headroom" (the header)
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, window: {start_us: 60000000, end_us: 326000000}, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: bulk, metric: cpu_delivered, aggregate: progress, direction: higher, weight: 0.25}

  # ---- C3 — transition arcs. Per-task terms; focus and task lifetimes window them.
  c3-workday:
    terms:
      - {entity: browser, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: writer, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: mailer, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: build, metric: cpu_delivered, aggregate: progress, direction: higher, weight: 0.5}
  c3-evening:
    terms:
      - {entity: browser, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: game.chain.1, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: music, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: video, metric: job, aggregate: miss_rate, direction: lower, weight: 0.5}
  c3-creation:
    terms:
      - {entity: photo-editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: video-editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: batch, metric: cpu_delivered, aggregate: progress, direction: higher, weight: 0.5}

  # ---- C4 — distractor injection: the C1 base's terms verbatim
  c4-office:
    base: c1-office
    terms:
      - {entity: writer, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c4-compile:
    base: c1-compile
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
      - {entity: build, metric: turnaround, aggregate: turnaround, direction: lower, weight: 1.0}
  c4-gaming:
    base: c1-gaming
    terms:
      - {entity: game.chain.1, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}

  # ---- C5 — familiarity ladder: c1-media's terms verbatim (a differing number is a bug signal)
  c5-t3:
    base: c1-media
    terms:
      - {entity: music, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: video, metric: job, aggregate: miss_rate, direction: lower, weight: 0.5}
  c5-t4:
    base: c1-media
    terms:
      - {entity: music, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: video, metric: job, aggregate: miss_rate, direction: lower, weight: 0.5}
  c5-t5:
    base: c1-media
    terms:
      - {entity: music, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: video, metric: job, aggregate: miss_rate, direction: lower, weight: 0.5}

  # ---- C6 — resolution limits
  c6-spoof:
    base: c1-browsing
    terms:
      - {entity: browser, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c6-fold:
    base: c1-browsing
    terms:
      - {entity: browser, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c6-dual:
    terms:
      - {entity: game.chain.1, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}

  # ---- C7 — attribute counterparts (Phase 7 spec decision 10): the C1 base's
  # terms, minus the batch term where the label flips it to unwanted. The
  # injected unattended upgrade (9.10 D3) and the renamed or flipped batch job
  # carry no term, so the false row's floor cap is free to act.
  c7-browsing:
    base: c1-browsing
    terms:
      - {entity: browser, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c7-office:
    base: c1-office
    terms:
      - {entity: writer, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c7-mail:
    # the counterpart is the base's first 26.385 s and holds no keystroke — c1-mail's 35 fall between
    # 45.9 s and 53.1 s — so its term reads the mailer's own wakes, not its base's input term, and the
    # file is reporting-only (9.14 decision 2 as amended 2026-10-09); no `base`, the terms differ
    terms:
      - {entity: mailer, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c7-dev:
    base: c1-dev
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c7-photo:
    base: c1-photo
    terms:
      - {entity: photo-editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c7-meeting:
    base: c1-meeting
    terms:
      - {entity: voice, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
  c7-gaming:
    base: c1-gaming
    terms:
      - {entity: game.chain.1, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
  c7-media:
    base: c1-media
    terms:
      - {entity: music, metric: job, aggregate: miss_rate, direction: lower, weight: 1.0}
      - {entity: video, metric: job, aggregate: miss_rate, direction: lower, weight: 0.5}
  c7-video-edit:
    base: c1-video-edit
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c7-compile:
    base: c1-compile
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c7-ml-train:
    base: c1-ml-train
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c7-render:
    base: c1-render
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c7-transcode:
    base: c1-transcode
    terms:
      - {entity: video-editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
  c7-indexing:
    base: c1-indexing
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: input, aggregate: p99, direction: lower, weight: 1.0}
  c7-backup:
    base: c1-backup
    terms:
      - {entity: editor, metric: ready_wait, cause: wake, channel: timer, aggregate: p99, direction: lower, weight: 1.0}
