# Decision 7: a file at finding 1 or finding 2 points to workload redesign, a file at finding 3 to the table rewrite;
# the route is one — the table is rewritten if any of the ten files is at finding 3, otherwise workload redesign.
# For a file at finding 2 the report states how many of the prior table's 8 distinct configurations have a quantity
# at least the row's.
route:
  table_rewrite: "the table is rewritten"
  workload_redesign: "workload redesign"

statements:
  - id: findings
    text: >
      Over a file's read points. Finding 1 — no spread: no two points differ on a scored term by the term's floor
      or more; the floor is the value below which a difference between two configurations is not read (metrics
      doc §10). Finding 3 — spread the prior table missed: the row's quantity is at most (1 − g) of the quantity
      of the best point, g = 0.5, and the best point is better than the row on a scored term by the floor or more.
      The row is the configuration the oracle applies; the best point is the read point with the highest
      quantity. Read on the table, the row captures at most half of the improvement the best point reaches over
      fixed. Finding 2 — spread the prior table's row holds: neither of the two.
  - id: route-known
    text: >
      The route rule is fixed after the RQ0 run's data were seen. On the runs on disk the four files of decision
      2's first kind are at finding 3 before any search run — the boot default is a point of the grid and their
      row is worse than it by the floor or more — so the route is known before the search: the table is
      rewritten. On c7-gaming the row reaches a frame miss rate of 0 against fixed's 1, so no point can beat it;
      on c7-transcode the row's quantity is 0.865; on c1-transcode the row's quantity is 0.005, and 62 of the
      file's 100 random runs exceed it by more than 0.01, the best at 0.153. The search runs as the statement
      failure-procedure requires, and its per-file findings are what Phase 12 is designed from.
  - id: boot-default-limit
    text: >
      The search runs at the primary alone: the blessed files, fixed at the primary boot default. Each of the
      gate's ten alternative boot defaults is a point of the grid, so each file's finding is recomputed with that
      point in place of fixed; a finding that changes is reported as a range over the boot default. No variant
      file was searched.
  - id: read-only
    text: >
      The search is read-only: nothing it finds is written into a table (_dev/docs/rq0-preparation-notes.md
      §4.3: ignore labels, sweep the configuration space, observe the spread).

# SHA-256 of the files the search reads, at its commit (decision 13): the dataset manifest is the second bless
# (harness/CHANGELOG.md, 2026-11-21); the prior table, the scoring spec and the guard spec the RQ0 gate spec's pins.
# The two program versions are the fixed simulator (stage AF, 11.2) and the daemon the RQ0 run used; the runner
# refuses a machine configuration naming others.
pins:
  dataset:      {path: dataset/build.manifest.json, sha256: 9f30ea8f3a991caeccb85a2c9640ddae40a9d84ccab46d17f81afff2d85807f3}
  driver_table: {path: daemon/driver-table/prior.yaml, sha256: f693bfbee5b261782ca27f0fcd8f4f4f7302e835b6a27246d2cb906542f22e9d}
  scoring_spec: {path: harness/scoring/scoring-spec.yaml, sha256: 4f3e34c180b26f932b1583ba16e3e928e31dd56806f3032fb1cbb214d159bb68}
  guard_spec:   {path: harness/guards/guard-spec.yaml, version: "1.4", sha256: 7d79201d5f6c61e5eb05f8d7d9155afb3be4660f6924f24b4775a4f274382372}
  simulator:    {version: simulator@841dc81131cb}
  daemon:       {version: daemon@62c71f0d2de0}
