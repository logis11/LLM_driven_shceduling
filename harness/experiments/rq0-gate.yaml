# RQ0 gate spec — the pre-registered description of the RQ0 run (research-proposal
# §5.3; Phase 8 spec, decisions 1–8, 12, 16, 17, 20, 21; sub-task 8.8, decided in
# the 2026-09-12 grill; reworked on the rebuilt workload dataset in sub-task 9.14,
# decided in the 2026-10-09 grill, _dev/docs/spec/jioh/task-9.14-consumer-rework.md).
# Executable data: the runner reads the generic part as its run matrix, the RQ0
# gate evaluator reads the whole file and writes the report. Every number here has
# its reason beside it — in `reasons`, in `statements`, or in the comment on its
# line. Nothing changes after execution begins except by an entry in
# harness/CHANGELOG.md made before any run.
#
# Committed 2026-09-12 by 인지오 on the freeze of the scoring spec and the guard
# spec (harness/CHANGELOG.md); re-pinned 2026-10-09 on the rebuilt dataset and the
# reworked consumers (the 9.14 entry there). Team ratification follows in a team
# meeting.

experiment: rq0-gate

conditions: [fixed, random, oracle]

# The telemetry shape shown to the recognizer (data-contracts §5, rule 6; 9.17): the
# name → count multiset with the focus holder. The gate's three conditions read no
# telemetry, so one shape is run.
telemetry: [focus]

# N — statement `n-grounding`
seed_count: 100

# The primary is the values OSTEP chapter 8's worked examples use — three queues and
# a 10 ms top slice (Example 1), doubling per level (Figure 8.6), a 100 ms boost
# (Figure 8.4) (recognition-vocabulary §2, 2026-09-11; 9.11 D8). A task is demoted
# when its CPU at a level since its last boost or demotion reaches the slice (OSTEP
# §8.4's Rule 4; the simulator guide §5 rule 4), so a periodic task's demotion edge
# is its CPU per 100 ms boost interval: at the primary the measured call is demoted
# in 0.98 of its boost intervals and the video player in 0.89, no chain task of the
# gaming base (the reference simulator, 2026-10-31;
# _dev/research/jioh/2026-10-31-demotion-edges/). Each alternative is the same
# configuration with only the top slice changed; the reason for each point is on
# the sensitivity line below (statement `boot-default-sweep`).
boot_defaults:
  primary: ostep
  alternatives: [ostep-slice-500us, ostep-slice-700us, ostep-slice-1200us, ostep-slice-2000us,
                 ostep-slice-5000us, ostep-slice-7000us, ostep-slice-12000us, ostep-slice-20000us,
                 ostep-slice-30000us, ostep-slice-100000us]

# Judging (19): a file judges when it is one side of a label-varying pair and its
# scored term registers the rows' difference by design (7.7, 2026-09-10; RQ0
# preparation notes §8), applied to the rebuilt files on 2026-10-09 (statement
# `judging-set`): the C2 pairs' normal-class halves, the four batch C1 bases whose
# job the row's share reaches, and the C7 counterparts with a term the row choice
# can move. Reporting (32): every other coreset file — the interactive and periodic
# C1 bases, c1-gaming on its own line, the idle pair, the six files holding
# idle-class work (statement `idle-class-files`), c7-mail (its cut holds no
# keystroke), c7-media (no headroom on the measured tables), C3, C4, C5 and C6,
# which run and report but are excluded from Layer-2 aggregation, and the bounding
# variant c2-p2a-idle (statement `bounding-check`). Variants (statement
# `sensitivity-lines`): rebuilt judging files the lines read, run under the
# primary boot default alone, never judged.
files:
  judging: [c2-p1a, c2-p2a, c2-p2b, c2-p3a,
            c1-compile, c1-ml-train, c1-render, c1-transcode,
            c7-browsing, c7-office, c7-dev, c7-photo, c7-meeting, c7-gaming, c7-video-edit,
            c7-compile, c7-ml-train, c7-render, c7-transcode]
  reporting: [c1-browsing, c1-office, c1-mail, c1-dev, c1-photo, c1-meeting, c1-media, c1-video-edit,
              c1-gaming, c1-idle, c7-idle,
              c1-indexing, c7-indexing, c2-p1b, c1-backup, c7-backup, c2-p3b,
              c7-mail, c7-media,
              c3-creation, c3-evening, c3-workday, c4-compile, c4-gaming, c4-office,
              c5-t4, c5-t5, c6-alias, c6-dual, c6-fold, c6-spoof,
              c2-p2a-idle]
  variants: [c2-p1a@venue-x0.8, c2-p2a@venue-x0.8, c2-p2b@venue-x0.8, c2-p3a@venue-x0.8,
             c1-compile@venue-x0.8, c1-ml-train@venue-x0.8, c1-render@venue-x0.8, c1-transcode@venue-x0.8,
             c7-browsing@venue-x0.8, c7-office@venue-x0.8, c7-dev@venue-x0.8, c7-photo@venue-x0.8,
             c7-meeting@venue-x0.8, c7-gaming@venue-x0.8, c7-video-edit@venue-x0.8, c7-compile@venue-x0.8,
             c7-ml-train@venue-x0.8, c7-render@venue-x0.8, c7-transcode@venue-x0.8,
             c2-p1a@venue-x1.25, c2-p2a@venue-x1.25, c2-p2b@venue-x1.25, c2-p3a@venue-x1.25,
             c1-compile@venue-x1.25, c1-ml-train@venue-x1.25, c1-render@venue-x1.25, c1-transcode@venue-x1.25,
             c7-browsing@venue-x1.25, c7-office@venue-x1.25, c7-dev@venue-x1.25, c7-photo@venue-x1.25,
             c7-meeting@venue-x1.25, c7-gaming@venue-x1.25, c7-video-edit@venue-x1.25, c7-compile@venue-x1.25,
             c7-ml-train@venue-x1.25, c7-render@venue-x1.25, c7-transcode@venue-x1.25,
             c2-p2a@chain-x1.2, c2-p2b@chain-x1.2, c7-gaming@chain-x1.2,
             c2-p2a@chain-x1.4, c2-p2b@chain-x1.4, c7-gaming@chain-x1.4,
             c2-p1a@seg1-30s, c2-p2a@seg1-30s, c2-p2b@seg1-30s, c2-p3a@seg1-30s,
             c2-p1a@seg1-120s, c2-p2a@seg1-120s, c2-p2b@seg1-120s, c2-p3a@seg1-120s,
             c1-compile@corner-low, c1-ml-train@corner-low, c2-p1a@corner-low, c2-p2a@corner-low, c2-p2b@corner-low,
             c7-browsing@corner-low, c7-office@corner-low, c7-dev@corner-low, c7-gaming@corner-low,
             c7-compile@corner-low, c7-ml-train@corner-low,
             c1-compile@corner-high, c1-ml-train@corner-high, c2-p1a@corner-high, c2-p2a@corner-high, c2-p2b@corner-high,
             c7-browsing@corner-high, c7-office@corner-high, c7-dev@corner-high, c7-gaming@corner-high,
             c7-compile@corner-high, c7-ml-train@corner-high,
             c7-dev@replay, c7-browsing@replay, c7-meeting@replay, c2-p1a@replay]

# derived from the `pre_committed_miss` annotation in the compiled files; the lint
# checks it (Phase 8 spec, decision 13). The grader drops from recognition
# accuracy the points inside these files' pre-committed-miss segments
# (harness/tools/harness/grader.py): the whole file for six, c6-fold from the call's
# arrival and c6-spoof from the spoof's (9.23 D1, D2), their earlier points
# staying in. Three of them judge (the gate needs labels, not recognizability) and
# five — c1-indexing and c7-backup, idle-class files, and the C6 limits: c6-alias,
# the name-collision alias (9.20 decision 8), c6-fold and c6-spoof — report.
layer1_exclusions: [c1-indexing, c6-alias, c6-fold, c6-spoof, c7-backup, c7-ml-train, c7-render, c7-transcode]

guard_exemptions:
  - guard: provenance_share
    workload: c6-dual
    conditions: [oracle]
    reason: >
      c6-dual's ground truth is `mode: ambiguous` with no `background_wanted`; the
      vocabulary admits no legal oracle answer inside that segment, so the oracle
      condition runs it on fallback by construction and the fallback share is 1
      (task 3.2; the 8.6 smoke run). The file is reporting-only and excluded from
      Layer-2 aggregation; the exemption keeps the report's guard table honest.

reporting_lines:
  # decision 12 as amended 2026-09-12: the fixed run re-run under each alternative,
  # the gaps recomputed against each, the verdict count printed per boot default.
  # The ten points (9.14 decision 9; the threshold points re-picked 2026-10-31): five
  # backbone points the dataset does not inform and five threshold points placed
  # either side of the demotion edges the rebuilt files' periodic tasks have, each
  # task's CPU per 100 ms boost interval — the music player's, the chain tasks', the
  # video player's, the call's (statement `boot-default-sweep`).
  - type: sensitivity
    boot_defaults: [ostep-slice-500us, ostep-slice-700us, ostep-slice-1200us, ostep-slice-2000us,
                    ostep-slice-5000us, ostep-slice-7000us, ostep-slice-12000us, ostep-slice-20000us,
                    ostep-slice-30000us, ostep-slice-100000us]
    reasons:
      ostep: "the primary: the values OSTEP chapter 8's worked examples use, a 10 ms top slice (recognition-vocabulary §2); above every gaming-base chain task's demotion edge (8.6 ms the most), below the video player's (12.1 ms): the call demoted in 0.98 of its boost intervals, the video player in 0.89, three c2-p2a chain tasks in at least half of theirs"
      ostep-slice-500us: "backbone: the config schema's lower bound on the top slice; the call and the video player demoted in every boost interval, every chain task in at least half of its, the music player in 0.86"
      ostep-slice-700us: "backbone: Linux's base slice at one CPU, 0.70 ms since v6.15 (linux-sched-fair) — design, the one-CPU value for the simulator's one lane, the runner running 2.1 ms at its 4 CPUs (9.11 D25); on the music player's demotion edge (0.71 ms; demoted in 0.49 of its boost intervals); also below the C2 gaming pair's 834 µs chain slack per frame (its chain 15 833 µs of 16 667, the Steam client taking about 250 µs of the slack on average), so a boosted intruder's slice fits inside a frame"
      ostep-slice-1200us: "threshold: above the music player's demotion edge (demoted in 0.01 of its boost intervals), below every chain task's (1.6 ms the least): every chain task of both gaming files demoted in at least half of its boost intervals, the call and the video player in all"
      ostep-slice-2000us: "backbone: illumos TS's top-level quantum (illumos-ts); inside the chain tasks' range: 16 of the gaming base's 17 chain tasks and 13 of c2-p2a's demoted in at least half of their boost intervals"
      ostep-slice-5000us: "threshold: mid the chain tasks' range: 10 of the gaming base's 17 chain tasks and 9 of c2-p2a's demoted in at least half of their boost intervals"
      ostep-slice-7000us: "threshold: near the top of the gaming base's range (8.6 ms): 3 of its chain tasks and 4 of c2-p2a's demoted in at least half of their boost intervals (added 2026-10-31)"
      ostep-slice-12000us: "threshold: on the video player's demotion edge (12.1 ms; demoted in 0.50 of its boost intervals), above every gaming-base chain task's: 2 of c2-p2a's chain tasks demoted in at least half of their boost intervals, the call in 0.93 (added 2026-10-31)"
      ostep-slice-20000us: "backbone: sched_ext's default slice, 20 ms (linux-sched-ext); between the video player's demotion edge and the call's: the call demoted in 0.62 of its boost intervals, the video player and every gaming-base chain task never, two c2-p2a chain tasks in fewer than half of theirs"
      ostep-slice-30000us: "threshold: above the call's demotion edge (23.9 ms; demoted in 0.24 of its boost intervals), the one periodic task still demoted (added 2026-10-31)"
      ostep-slice-100000us: "backbone: the config schema's upper bound on the top slice; no periodic task demoted"
  # 8.1 decision 4: the verdict count recomputed under a band of latency floors at scoring time
  - {type: floor_band, latency_floors_us: [500, 1000, 2000, 5000]}
  # 8.8 decision 4: the verdict count recomputed under a band of g at scoring time
  - {type: g_band, gaps: [0.25, 0.33, 0.5, 0.67]}
  # 8.8 decision 6: the precision N buys, per judging file, checked against the data
  - {type: seed_standard_error}
  - {type: exclusion_accuracy}
  - {type: layer1_headline}
  - {type: random_beats_oracle}
  # 9.14 decision 10 — the sensitivity lines (statement `sensitivity-lines`): each a
  # rebuilt set of judging files run under the primary; a verdict count that moves
  # makes the verdict a range over that axis.
  - type: variant_set
    name: venue-x0.8
    axis: venue_factor
    value: "0.8"
    reason: "every measured RUN value scaled by 1/1.25 (9.6 D32): the lower edge of a design bracket containing the two measured venue effects — the ×1.144 huge-page ratio of the training run under the desktop kernel's mode (×1.102 to ×1.185, 9.10 D88) and the tracing overhead's ×1.02 to ×1.16 (the untraced controls, 9.5); the chain excluded, it has its own line"
    files: {c2-p1a: c2-p1a@venue-x0.8, c2-p2a: c2-p2a@venue-x0.8, c2-p2b: c2-p2b@venue-x0.8, c2-p3a: c2-p3a@venue-x0.8,
            c1-compile: c1-compile@venue-x0.8, c1-ml-train: c1-ml-train@venue-x0.8, c1-render: c1-render@venue-x0.8,
            c1-transcode: c1-transcode@venue-x0.8, c7-browsing: c7-browsing@venue-x0.8, c7-office: c7-office@venue-x0.8,
            c7-dev: c7-dev@venue-x0.8, c7-photo: c7-photo@venue-x0.8, c7-meeting: c7-meeting@venue-x0.8,
            c7-gaming: c7-gaming@venue-x0.8, c7-video-edit: c7-video-edit@venue-x0.8, c7-compile: c7-compile@venue-x0.8,
            c7-ml-train: c7-ml-train@venue-x0.8, c7-render: c7-render@venue-x0.8, c7-transcode: c7-transcode@venue-x0.8}
  - type: variant_set
    name: venue-x1.25
    axis: venue_factor
    value: "1.25"
    reason: "every measured RUN value scaled by 1.25: the upper edge of the same bracket"
    files: {c2-p1a: c2-p1a@venue-x1.25, c2-p2a: c2-p2a@venue-x1.25, c2-p2b: c2-p2b@venue-x1.25, c2-p3a: c2-p3a@venue-x1.25,
            c1-compile: c1-compile@venue-x1.25, c1-ml-train: c1-ml-train@venue-x1.25, c1-render: c1-render@venue-x1.25,
            c1-transcode: c1-transcode@venue-x1.25, c7-browsing: c7-browsing@venue-x1.25, c7-office: c7-office@venue-x1.25,
            c7-dev: c7-dev@venue-x1.25, c7-photo: c7-photo@venue-x1.25, c7-meeting: c7-meeting@venue-x1.25,
            c7-gaming: c7-gaming@venue-x1.25, c7-video-edit: c7-video-edit@venue-x1.25, c7-compile: c7-compile@venue-x1.25,
            c7-ml-train: c7-ml-train@venue-x1.25, c7-render: c7-render@venue-x1.25, c7-transcode: c7-transcode@venue-x1.25}
  - type: variant_set
    name: chain-x1.2
    axis: chain_scale
    value: "1.2"
    reason: "the frame chain's RUN values scaled by 1.2 (9.4 D9; 9.5's scale check of the one archetype still grounded in literature at another machine's scale): the deck's per-schedule runtime understates a wake's demand by the schedules a wake is cut into, about 1.4 on average (arithmetic on lavd-ossna24 s14's preemption share, 9.4 D9)"
    files: {c2-p2a: c2-p2a@chain-x1.2, c2-p2b: c2-p2b@chain-x1.2, c7-gaming: c7-gaming@chain-x1.2}
  - type: variant_set
    name: chain-x1.4
    axis: chain_scale
    value: "1.4"
    reason: "the chain's RUN values scaled by 1.4, the deck's bound; at this factor the chain exceeds the lane in all three files (1.33 and 1.26 lanes), so the expected reading is that the gaming verdicts depend on the literature-grounded archetype's scale — its stated limitation, not a result"
    files: {c2-p2a: c2-p2a@chain-x1.4, c2-p2b: c2-p2b@chain-x1.4, c7-gaming: c7-gaming@chain-x1.4}
  - type: variant_set
    name: seg1-30s
    axis: segment_length
    value: "30s"
    reason: "the C2 pairs' first segment, the one authored length a judging file has (60 s, design, 9.10 D31), at 30 s; every other judging length follows from a job's measured CPU total (9.10 D169's sweep), with the editor's beside it on the batch C1 bases and c2-p3a; c1-render's 60 s is design"
    files: {c2-p1a: c2-p1a@seg1-30s, c2-p2a: c2-p2a@seg1-30s, c2-p2b: c2-p2b@seg1-30s, c2-p3a: c2-p3a@seg1-30s}
  - type: variant_set
    name: seg1-120s
    axis: segment_length
    value: "120s"
    reason: "the same first segment at 120 s; expected unchanged, the terms reading the second segment"
    files: {c2-p1a: c2-p1a@seg1-120s, c2-p2a: c2-p2a@seg1-120s, c2-p2b: c2-p2b@seg1-120s, c2-p3a: c2-p3a@seg1-120s}
  - type: variant_set
    name: corner-low
    axis: carried_half_widths
    value: "low"
    reason: "every value the library carries under the stability rule's exceptions (9.5 D57, 9.6 D29, 9.8 D27, 9.9 D29) set to the lower bound of its stated interval, on the judging files holding those entries (statement `sensitivity-lines`, the list in dataset/variants.yaml); a changed count triggers the re-measurement contingency (statement `re-measurement-contingency`)"
    files: {c1-compile: c1-compile@corner-low, c1-ml-train: c1-ml-train@corner-low, c2-p1a: c2-p1a@corner-low,
            c2-p2a: c2-p2a@corner-low, c2-p2b: c2-p2b@corner-low, c7-browsing: c7-browsing@corner-low,
            c7-office: c7-office@corner-low, c7-dev: c7-dev@corner-low, c7-gaming: c7-gaming@corner-low,
            c7-compile: c7-compile@corner-low, c7-ml-train: c7-ml-train@corner-low}
  - type: variant_set
    name: corner-high
    axis: carried_half_widths
    value: "high"
    reason: "the same values at the upper bound of their intervals"
    files: {c1-compile: c1-compile@corner-high, c1-ml-train: c1-ml-train@corner-high, c2-p1a: c2-p1a@corner-high,
            c2-p2a: c2-p2a@corner-high, c2-p2b: c2-p2b@corner-high, c7-browsing: c7-browsing@corner-high,
            c7-office: c7-office@corner-high, c7-dev: c7-dev@corner-high, c7-gaming: c7-gaming@corner-high,
            c7-compile: c7-compile@corner-high, c7-ml-train: c7-ml-train@corner-high}
  - type: trace_replay
    tolerance: 0.17
    reason: "four judging files, one per term shape, rebuilt on one pooled repeat's measured wake sequence in place of the compiled stream (the launch-phase replay of 9.10 D136 extended to the carried phases): a measured or periodic task takes a window of its entry's carried phase at an offset the file's seed draws, the operations and the keystroke replay as compiled; a batch job its repeat's runs from the start, the repeat the nearest whose CPU covers the file's bind (dataset/replay/, each file stating its landing); agreement when each file's gap falls on the same side of g under both builds and differs by less than the g band's step; a disagreement is stated beside the verdict as the compiled streams' ordering threat (the 2026-09-26 burstiness finding: the streams reproduce each component's rates and distributions, not the order of its gaps nor its components waking together)"
    files: {c7-dev: c7-dev@replay, c7-browsing: c7-browsing@replay, c7-meeting: c7-meeting@replay, c2-p1a: c2-p1a@replay}
  - type: input_wake_count
  - type: longest_wait
    threshold_us: 30000000
    reopen_us: 15000000
  - type: bounding_pair
    a: c2-p2a
    b: c2-p2a-idle
    reason: "the download bounding check (9.11 D6, D20, D21; 9.13 D4): the two files are byte-identical but for the download task's declared class — carried at full standing as measured (a), or in the idle class (b); a stock desktop gives SteamCMD's content-update threads, 75 % of its CPU, nice 10, about a tenth of the CPU against a busy nice-0 thread, which lies between the two. The verdict on each is reported and the difference stated as the reach of carrying the nice-10 work at full standing"
  - type: note
    workload: c7-gaming
    text: >
      Judging note (9.14 decision 2; pair review finding 5): the chain is deadline
      class and the file's two gaming rows tie on the chain term by design — the
      cap axis is inert — so the gap reads EDF against the drawn algorithm. The
      chain takes 0.9 of the lane (9.4), 1 668 µs of slack per frame, and the boot
      MLFQ's 100 ms boost hands the upgrade a 10 ms slice inside a frame; the
      2026-09 note's "frames miss under every row" read the old chain at 1.46 lanes.
  - type: note
    workload: c1-gaming
    text: >
      Separate line, added 2026-09-06 before execution: a single-situation file
      whose chain takes 0.9 of the lane (9.4; 1.46 before), beside the Steam
      client; lets gap size be read against the chain's load separately from
      family type. Not judging: no pair, so no attribute variation, and the file
      was chosen on its demand after reading demand numbers.
  - type: note
    workload: c7-meeting
    text: >
      Judging since 2026-10-09 (9.14 decision 2): the measured call is one task
      with a job per 10 ms audio frame and 23.9 ms of CPU per 100 ms boost
      interval (on its base, c1-meeting), past the boot slice, so under fixed the
      reference simulator demotes it in 0.97 of its boost intervals and it misses
      0.20 of its jobs (2026-10-31; _dev/research/jioh/2026-10-31-demotion-edges/),
      while under either EDF row it is deadline class and misses only its own
      overruns, about 5 % (about one cycle in twenty runs past its period: 4.9 %
      from the measured table, 5.5 % in the compiled file; 9.16 D1). The tie
      with fixed that made it reporting-only in 8.8 held on the old 2.5 ms and
      6.67 ms bursts and is gone; the cap axis is inert and the gap reads EDF
      against the drawn algorithm, as on c7-gaming. The call's own overruns set a floor under its
      miss rate under every row.
  - type: note
    workload: c7-media
    text: >
      Reporting-only (9.14 decision 2): the video player's 12.1 ms of CPU per
      100 ms boost interval (on its base, c1-media) passes the boot slice, so under
      fixed the reference simulator demotes it in 0.88 of its boost intervals, and
      neither player misses a job (2026-10-31;
      _dev/research/jioh/2026-10-31-demotion-edges/): the compiled file's worst
      video cycle is 7.28 ms of run against a 33.3 ms period, and the longest wait
      the boot MLFQ can impose on it after a demotion is one 20 ms Q1 slice. The
      measured table's worst cycle, 16.0 ms, would pass the period by that wait
      (36 ms in all); the music player's 2.4 ms against 49.6 ms never comes near.
      No headroom against fixed and none between the two EDF rows on the compiled
      file.
  - type: note
    workload: c7-mail
    text: >
      Reporting-only (9.14 decision 2 as amended 2026-10-09): the counterpart's
      keystroke window is a slice of c1-mail's, drawn at the base's stimulus offset
      (9.18), and the base's 35 keystrokes fall between 45.9 s and 53.1 s, the
      SWELL Outlook stream's one typing burst, past the 26.385 s cut — so the slice
      holds none, its term reads the mailer's own wakes and cannot read keystroke
      latency; the mail mode's attribute pair is unmeasured.

statements:
  - id: judging-set
    text: >
      A file judges when it is one side of a label-varying pair and its scored term
      registers the rows' difference by design (7.7, 2026-09-10), read on the
      rebuilt files and the ratified executor rules on 2026-10-09 (9.14 decision 2).
      That admits the C2 pairs' normal-class halves (c2-p1a, c2-p2a, c2-p2b,
      c2-p3a), the four batch C1 bases whose job the row's share reaches
      (c1-compile, c1-ml-train, c1-render, c1-transcode), and eleven C7
      counterparts (browsing, office, dev, photo, meeting, gaming, video-edit,
      compile, ml-train, render, transcode): nineteen files. Reporting-only by the
      same rule: the six files holding idle-class work (statement
      `idle-class-files`); c7-mail, whose cut holds no keystroke; c7-media, no
      headroom against fixed or between its rows on the measured tables; the
      interactive and periodic C1 bases, C3, C4, C5, C6 and the idle pair as
      before. On the EDF files that judge — c2-p2a, c2-p2b, c7-gaming, c7-meeting
      — the two rows tie on the scored term by design, since EDF serves the
      deadline-class chain or call before any residual task whatever the cap; the
      gap there reads EDF against the drawn algorithm, mode recognition, with the
      attribute's row difference unmeasured, as 7.7 first read c7-gaming. A
      judging file whose every term shows no headroom at scoring time stays in the
      set and counts as not meeting g (Phase 8 spec, decision 4); it is also a
      trigger for the table check in the failure procedure. No file leaves or
      enters the set after any gap is seen.
  - id: idle-class-files
    text: >
      c1-indexing, c7-indexing and c2-p1b hold Tracker's indexer and c1-backup,
      c7-backup and c2-p3b Déjà Dup's backup, programs that declare SCHED_IDLE on
      themselves (9.11 D4). The dataset carries the class and the executor runs
      an idle task only when no other-class task is runnable, under every
      algorithm (9.11 D5; 9.13), and the cap is work-conserving, so no row's
      share or cap reaches the background task: its turnaround or progress is
      identical under every row and the editor's wait is untouched by it
      (statement `simulator-conformance`, item (e), the strict idle class). The
      six files are reporting-only by the judging rule's own reason for the
      interactive C1 bases — nothing the row choice can move runs behind the
      foreground — with the prediction stated here before any run: no headroom
      on the background term, and on the editor term only what the algorithm
      does to the editor's own threads. The depicted desktop differs for the
      indexer, which runs in background.slice at about 23 % of the CPU against
      the editor's slice (9.11 D16), so the simulated indexer interferes less
      than the real one and these files understate a desktop's headroom; the
      backup shares the editor's task group and the simulation matches. The
      files re-enter the judging set only if the executor's idle rule changes
      before any run, by a harness changelog entry.
  - id: executor-assumptions
    text: >
      Stated on 인경민's simulator status memo of 2026-10-01 (§6) and the 9.11
      decisions, as committed assumptions (9.11 D26; 9.14): (1) under EDF a
      waking deadline-class task preempts a running residual task at once, as the
      simulator behaves today; (2) same-microsecond events apply config entries
      first, then events in insertion order — the simulator's rule D1 — not a
      wake before a slice boundary, as the 2026-09-11 memo proposed; (3) the
      executor has no starvation window; the harness's starvation_floor guard
      reads 30 s, the bound sched_ext's watchdog enforces at most and by default,
      borrowed by design as the deployment path's validity bound (9.11 D7, D19).
      인경민 confirmed (1) and (2) to 인지오 verbally, the reply the declared-class
      memo of 2026-10-08 asked (recorded 2026-10-31).
  - id: simulator-conformance
    text: >
      Every consumer this spec pins is written against the ratified contract, not
      the simulator as it stands (9.14 decision 1). Before the RQ0 run the
      simulator must show, on the hand fixtures replayed through it with their
      traces compared line by line: (a) a ready line at every completion of a
      blocking primitive, at zero wait when it did not block, inside the
      occupancy after the run_start (metrics doc §11 item 1), save a dropped
      timer wake's WAIT and RUN, which pass with no line (j); (b) the TIMER skip
      rule — a TIMER reached after ticks passed consumes the latest and skips the
      rest, each skipped tick a deadline line with met false and no work (9.11
      D3, D17; the 2026-10-07 memo); (c) a switch into MLFQ as a cold start into
      the top queue, and a same-algorithm entry letting the granted slice finish
      (metrics doc §6.9, §11 item 9); (d) batch_bandwidth_cap read and applied
      as a work-conserving ceiling on the behavioural batch class (the 2026-09-09
      batch-class memo); (e) the strict idle class, an idle task running only
      when no other-class task is runnable and preempted at once when one wakes,
      under every algorithm (the 2026-10-08 declared-class memo); (f) the frame
      chain's woken stages in EDF's deadline class with the frame's deadline
      (recognition-vocabulary §2, 2026-10-06); (g) an orchestrator's WAIT
      children:<id> completes when every child it spawned has ended, and
      without blocking when none is live at the WAIT (the interpretation contract's
      WAIT(channel) row and FORK semantics; data contracts §4 Example B and
      §14, 2026-10-16: proposed there, in force since 인경민 agreed to it
      verbally, recorded 2026-10-31; this spec requires it of the run); (h) the simulator run through
      the invocation contract as the runner invokes it — the workload and the
      config schedule as --workload and --schedule and the trace's path as
      --out-trace, with no positional argument, the trace written to that file
      with standard output ignored, exit 0 only when it is written, a
      byte-identical trace from the same argument line, and the trace header's
      sim the version string the runner's machine configuration names (data
      contracts §11, contract 10); (i) a WAKE naming a spawn-table entry reaching
      that child, a wake sent before the child's birth held and taken at its
      birth (the interpretation contract's WAKE(target) row; data contracts
      §14, 2026-10-21; the 2026-10-10 dataset audit's blocker 1); (j) a program's
      own wakes held by their channel's kind — on event:<id>, as on input:<id>,
      with depth, each held wake completing one later WAIT in arrival order; on
      timer:<id> one held wake, the first, a timer wake that comes while one is
      held dropped, a wake_drop line written at its time, and the WAIT and RUN
      compiled for it passing at once with no block, work or line when the
      program reaches them (the interpretation contract's WAIT(channel) row;
      data contracts §9 and §14, 2026-10-31; metrics doc §11 item 2). (a) save a
      FORK taking a free slot, (b), (c), (d), (e), (f) and (i) the simulator does
      today; the others its owner holds as owed. The run does not start until
      each is shown.
  - id: g-grounding
    text: >
      g = 0.5 reads: recognition accounts for at least half of the achievable
      improvement — the compared condition captures at most half of the oracle's
      headroom over fixed. It is a stated minimum effect of interest fixed before
      execution; no source grounds a value. The g band line prints the verdict
      count under 0.25, 0.33, 0.5, and 0.67 beside the primary; if the count moves
      inside the band, the verdict is reported as a range over g, not as a point.
  - id: prior-table-structure
    text: >
      A known property of the prior driver table, stated before execution: its 32
      rows carry 8 distinct configurations, since params are boot values in every
      row and rows differ by algorithm and cap only. Thirteen rows share MLFQ with
      cap 0.05 (every unwanted row of a non-periodic mode), so on the nine judging
      files whose scored segment maps to that row — the C7 counterparts of
      browsing, office, dev, photo, video-edit, compile, ml-train, render and
      transcode — a uniform draw is the oracle's configuration 41 % of the time,
      and their gap has a structural ceiling. The other ten judging files map to
      rows shared by at most three (9 % or less). The duplicate structure makes the
      gate conservative; a fail concentrated in the nine-file class routes to the
      failure procedure's table check first.
  - id: k-grounding
    text: >
      K = 10 reads: a majority of the 19 judging files (13 of 25 by the same
      reading until 2026-10-09; 9.14 decision 2). The report prints the count
      whatever K is; K draws the pass line.
  - id: n-grounding
    text: >
      N = 100, by two arguments. Precision: the gap uses the mean of the compared
      condition's file score over seeds; with per-seed shares spread at most about
      0.5, the worst-case sampling error of that mean at N = 100 is 0.05, one tenth
      of g. Coverage: each draw is uniform over the 32 rows, and the chance a
      single-row configuration is never drawn in N seeds is (31/32)^N, below 5% at
      N = 95. The seed standard-error line prints the measured error per judging
      file beside the mean. The sensitivity lines run their variant files at the
      same N, about two and a half times the main judging run in all (9.14). If
      the real simulator's measured cost makes N = 100 unaffordable, N changes by
      a harness changelog entry before any run (Phase 8 spec, decision 20).
  - id: random-reading
    text: >
      The random condition draws, at every telemetry set change, one uniform draw
      over the 32 driver-table rows, independent of previous draws and of the
      telemetry, from a PRNG seeded per run, logged with its draw and seed, at zero
      latency (daemon guide's definition; Phase 8 spec, decision 15). Proposed to
      박이안 with N on 2026-09-12 (memo 2026-09-12-rq0-pre-registration) and pending
      confirmation; enumerating the draw space instead of sampling it is a named
      future option, not adopted.
  - id: boot-default-sweep
    text: >
      Only the fixed run varies across the sweep: it is re-run under each alternative
      boot default, and every judging file's gaps are recomputed against that fixed
      run. The oracle and random runs stay on the primary and on the pinned driver
      table. The sweep is a backbone the dataset does not inform — the config
      schema's two bounds and three shipped defaults — plus threshold points placed
      either side of the demotion edges the rebuilt files' periodic tasks have (9.14
      decision 9; re-picked 2026-10-31). A task is demoted from the top queue in a
      boost interval when its CPU there since the boost reaches the slice (OSTEP
      §8.4's Rule 4, the allotment kept across bursts; the simulator guide §5 rule
      4), so a periodic task's demotion edge is its CPU per 100 ms boost interval:
      the music player's 0.71 ms, the frame chain's 17 tasks (16 members and the
      wineserver) 1.7 to 8.6 ms in the gaming base and 1.6 to 12.7 ms in the C2
      pair, the video player's 12.1 ms, the call's 23.9 ms (the reference
      simulator's traces at a 100 ms slice; the share of boost intervals holding a
      demotion at 17 top slices from 0.5 to 100 ms,
      _dev/research/jioh/2026-10-31-demotion-edges/). A slice below a task's edge
      demotes it in most of its boost intervals; a slice shorter than the chain's
      slack per frame (834 µs in the C2 pair, 1 668 µs in the gaming base) lets a
      boosted intruder's slice fit inside a frame. Every point's reason is on the
      sensitivity line. If the verdict count changes across the sweep, the
      verdict is reported as a range over the boot default.
  - id: sensitivity-lines
    text: >
      Every check that asks whether something moves a scheduling outcome is a
      reporting line run with the RQ0 run, its sweep values and reading rule
      fixed here (9.14 decision 3), on variant files the dataset's variant builder
      produces from the pinned library and the blessed set and this spec pins by
      manifest (decision 12; dataset/variants.yaml names each set's transform,
      files and the carried values it moves). The venue factor scales every
      measured RUN value by 1/1.25 and 1.25, a design bracket containing the two
      measured venue effects; the chain scale multiplies the chain's RUN values
      by 1.2 and 1.4; the segment length sets the C2 pairs' first segment to 30 s
      and 120 s; the carried half-widths set every exception-carried value to the
      bounds of its stated interval, all low and all high, and 9.6 D29's rule
      holds with it — no reported result may rest on a difference smaller than a
      carried value's half-width; the trace replay rebuilds four files on measured
      wake sequences — one pooled repeat per entry over its carried phase, a
      seeded window of it per measured or periodic task, a batch job's runs from
      its start on the nearest repeat whose CPU covers the bind (the six streams
      under dataset/replay/, each stating its landing). A verdict count that moves under any line makes the verdict
      a range over that axis. The input-wake-count line prints, per judging file
      and latency term, the number of observations its P99 rests on — an
      input_latency term's keystrokes, an app_latency term's timer and event wakes: a
      26 s counterpart holds 49 to 101 keystrokes and c3-workday's browser seven,
      so a P99 there is the top one or two latencies. The comparison across conditions
      is on one file's wakes; across the pair, a counterpart's keystroke window is
      a slice of its base's at the base's stimulus offset (9.18), so its input
      wakes are those of the base's input window up to 24.385 s less the ones
      inside its own operations. The longest-wait line prints each run's longest
      ready_wait against the 30 s floor; any run past 15 s reopens the executor-net question
      with 인경민 before the verdict is read (9.11 D19).
  - id: re-measurement-contingency
    text: >
      The values the library carries under the stability rule's exceptions — the
      editor's utility/libuv-worker wake rate and gap mean (9.5 D57, D99: ±39 %
      across repeats, ±10.6 % within one), the training run's runs between
      blocks and block per run (9.6 D29; 9.10 D87: ±27 % and ±11 %), the hidden
      renderer's (renderer-hidden) sparse residual (9.8 D27; 9.10 D156: ±20.2 %
      its wake rate and gap mean, ±61.3 % its run mean), its two run means that
      follow the machine (9.8 D17: HangWatcher ±18.1 %, chrome ±11.4 %) and its
      three quiet threads whose rate varies between sessions (9.5 D57, 9.8 D26;
      9.10 D156: Chrome_ChildIOT, Compositor and PerfettoTrace, ±6.5 % to
      ±17.6 %), the Steam client's (game-client) four run means (9.8 D17, D18:
      ±5.3 % to ±10.1 %), the DKMS tail's block per run (9.10 D58: ±8.35 %), pid 1's
      run mean and the system bus's three values (9.9 D48: ±7.8 % and ±11 %) —
      are carried with their half-widths, not re-measured (9.5 D88's reading of
      the stated precision). If the carried-half-width lines move any judging
      file across g, the verdict is reported as a range over that axis and the
      entry whose value moved it is re-measured at a count fixed now — the count
      the stability rule projects at the carried spread (9.9 D48: 55 repeats for
      pid 1, 102 to 108 for the bus; 9.5 D88's stopping method for the others) —
      before the result is reported, as a harness changelog entry and a second
      bless.
  - id: layer1-interval
    text: >
      The Layer-1 headline's interval is a seeded cluster bootstrap over files
      (10 000 repetitions, seed 20260911, pinned in the grader). Field and Welsh's
      consistency result holds for balanced one-way arrays and their simulations
      ran 5 and 15 clusters of equal size, where the cluster bootstrap
      underestimated the variance; the coreset's files are more than 15 and of
      unequal size, outside both, so the interval's coverage is untested and may
      be narrower than nominal (9.11 D9, D27). No correction is pre-registered:
      none is sourced. The interval is printed with this caveat.
  - id: failure-procedure
    text: >
      On a fail, in order: (1) a configuration search on three failing judging
      files chosen by rule — the failing file with the largest oracle improvement
      over fixed in the nine-file duplicate-heavy class, the same in the
      low-duplicate class, and the failing file whose gap fell furthest below g
      anywhere; ties by workload id order; files with no headroom are skipped for
      the first two picks, since they already trigger the table check — before any
      workload change; (2) no spread found by the search means workload redesign;
      (3) spread the prior table missed means the table is rewritten; (4) a judging
      file with no headroom on every term is an additional trigger for the table
      check. The search tool is built only if the gate fails.
  - id: held-out-rows
    text: >
      Pre-registration for the held-out-rows arm (research-proposal §4.6 item 3):
      its row set is every row of the calibrated table unless a stated reason
      excludes one; the files per blanked row are fixed by rule — the row's C1 base
      for a true row, its C7 counterpart for a false row, plus any C2 or C3 segment
      labelled with that row.

# SHA-256 of the frozen files at the re-pin (harness/CHANGELOG.md, 2026-10-31, the wakes-by-origin, demotion-edge and driver-table entries; 2026-10-30, the timer_latency, input_latency and guard spec 1.3 entries; 2026-10-17, the 9.16 entries; 2026-10-17 and 2026-10-16, the 9.15 entries;
# 2026-10-15 and 2026-10-14, the 9.23 entries; 2026-10-12, the 9.20 entry; 2026-10-11, the 9.18 and 9.22 entries); the variant manifests pin the rebuilt files the sensitivity lines read.
pins:
