# Guard spec — the checks that must pass before any run's numbers are read
# (Phase 8 spec, decisions 6–7; sub-task 8.3 spec). Research-wide: every
# experiment runs the same eight guards; which runs are exempt is per-experiment
# data in that experiment's spec (the RQ0 gate spec for RQ0), never here.
#
# Each guard is a named function in tools/harness/guards.py; this file supplies
# its parameters. `threshold` is null where the guard is structural (a
# comparison the code makes without a number). `direction` says how the
# measured value meets the threshold. `applies_to` lists the conditions the
# guard judges; every other condition gets `not_applicable`. `reads` names the
# input the guard measures from. `grounding` is the argument behind the
# threshold, required for every entry: an arithmetic identity, a structural
# rule, or a design value, each written as such
# (docs/harness/metrics.md §10 uses the same status for its floors). The lint (tools/harness/guards.py,
# `lint_spec`) checks the ids against the code's registry, every grounding
# non-empty, and `pairs` against the label-changing C2 variants of
# dataset/timelines/coreset/c2-pairs.variant.yaml.
#
# Output: one row per (run, guard) in the `guards` file (schema/guards.schema.json)
# — result pass / fail / not_applicable, the measured value, the threshold in
# force, the partner run for the two pair guards, and a reason on fail.
#
# Groundings, in one place:
#
# provenance_share — 0.5, design. The guard exists for the case the
#   research proposal §6.3 names: "a condition that scores well while 70% of its
#   configurations were fallbacks did not demonstrate anything about recognition";
#   its appendix B.3 says "most of its configurations were fallbacks". The
#   proposal counts configurations (§6.3's provenance breakdown, a "fraction of
#   applied configurations"); this guard, by design, weighs them by time, since a
#   run's score accrues over its time under each configuration, and counts `held`
#   with `fallback`. The time-weighted share of `fallback` + `held` intervals
#   (metrics doc §8, fallback share) must stay below one half. Under `fixed` the
#   whole run is the boot default by definition, so the guard does not apply.
#   `c6-dual`, whose ground truth is `ambiguous` and where 100% fallback is the
#   correct outcome, is an exemption in the RQ0 gate spec.
#
# config_age — structural, no number. The failure it catches is attribution
#   breaking: a config computed from one situation's telemetry taking effect
#   after that situation has ended governs a segment it was never computed for,
#   so the recognition log's grade (against the segment covering `t_set_change`)
#   and the trace's outcome (in the next segment) decouple. For every non-boot
#   schedule entry, the entry's stamped time must lie before the end of the
#   ground-truth segment containing its query's `t_set_change`; an entry whose
#   query has no covering segment (the terminal snapshot, data-contracts §8) is
#   skipped. The row's value is the largest observation age (stamped time minus
#   `t_set_change`) over the checked entries. The `config_age_*` aggregates of
#   metrics doc §8 measure time in force, a different quantity, and are reported
#   beside the score, not guarded.
#
# starvation_floor — 30 000 000 µs, design: the bound sched_ext's watchdog
#   enforces at most and by default, borrowed as the validity bound of the
#   project's deployment path (docs/research-proposal.md §2.1). The kernel ejects a
#   BPF scheduler when a runnable task waits longer than its `timeout_ms`, which
#   "may not exceed the default timeout of 30 seconds" and defaults to it
#   (`kernel/sched/ext.c` at v6.17, `linux-sched-ext`); the shipped scx schedulers
#   set 30 s (lavd), 10 s (rusty) and 5 s (bpfland) at release v1.1.3 (`scx`). A
#   run in which a task waits longer describes a configuration such a deployment
#   could not keep running. The executor has no starvation net of its own
#   (simulator memo 2026-10-01 §6). Read
#   as each task's maximum `ready_wait` over any cause on the whole file (metrics
#   doc §6.1, starvation), idle-class tasks included, as the watchdog covers every
#   task it schedules. Applies under every condition, `fixed` included.
#
# determinism — structural. Same run file + same config schedule ⇒ byte-identical
#   trace (docs/simulator/simulator-guide.md, non-negotiable 4; data-contracts §9).
#   The guard compares the run's trace hash (records `source_sha256`) with the
#   hash of a second execution's trace; when and how the rerun happens is the
#   runner's (8.6). A run without a rerun trace fails: it has not been shown
#   deterministic.
#
# utilisation_sanity — 1.0, and strictly above 0 where the scoring spec carries
#   terms for the file; arithmetic. Delivered CPU cannot exceed the lane's
#   elapsed time (`busy ≤ T_end`, metrics doc §8), and a workload with scored
#   terms that delivered no CPU at all is an empty trace that parsed.
#
# tick_count — structural. The primitives' own consistency checks (metrics doc
#   §6.2 guard: a chain tail's iteration count equals its head's tick count; the
#   `deadline` cross-check; the stimulus count against the run file's wake
#   events; config_applied lines against the schedule): their messages, returned
#   by the records build, are this guard's input. Any message is a fail. A run
#   whose messages were not recorded fails: the check was not run.
#
# validation_matches_provenance — structural. One query produces one schedule
#   entry, so the log's `validation` sequence equals the schedule's `provenance`
#   sequence minus the boot entry (data-contracts §8). Compared positionally;
#   a length mismatch or a differing value fails, naming the first index.
#
# c2_pair — structural. The two files of a C2 pair differ in one segment: its
#   label and the background task it holds (c2-pairs.variant.yaml); under a
#   recognition-driven condition the configurations the daemon chose over that
#   segment must differ — identical sequences mean the recognizer's answer never
#   changed between wanted and unwanted and a zero gap is a table or recognizer
#   defect, not a recognition result (_dev/docs/rq0-preparation-notes.md, stage
#   4.2; data-contracts §10 lints the table for the same case). The guard reads
#   the two runs' config schedules (data-contracts §7) and compares, entry by
#   entry, the configuration in force at the differing segment's start and every
#   entry stamped inside it, as (algorithm, params, cap). Under `oracle` the
#   sequences differ by construction, so the guard is a plumbing check there;
#   under the LLM and name-table conditions it is the real one. Traces are not
#   compared (the reading until 2026-10-09): since 9.10 every pair's background
#   task is a different measured job — P1 Tracker's indexer in the training
#   run's place, P2 the unattended upgrade in the game download's, P3 Déjà Dup's
#   scheduled backup in the video render's — so the traces differ whatever the
#   configuration and a body-hash check passed vacuously (9.11 D15; 9.14
#   decision 7). Under `fixed` both files run the boot default and no identity
#   is expected; under `random` the draws ignore telemetry; neither applies.
#   Partner: the other file of the pair under the same condition, seed, and
#   boot default. The differing segment is read off the two files' ground truth
#   (the first segment whose mode or attributes differ).

# 1.0 was the freeze of 2026-09-12 (Phase 8 spec, decision 19; harness/CHANGELOG.md), pinned by
# the RQ0 gate spec. 1.1 (2026-10-09, sub-task 9.14) carries 9.11's starvation floor (30 s),
# provenance-share grounding and P1 flag, the grounding-kind labels, the pair guard's reading of
# configuration sequences, the retired `fixed_identical` flag, and the two name-table conditions
# in place of `whitelist` (9.12 D6). Pinned anew by the RQ0 gate spec; a change after it is a new
# version and a changelog entry.
version: "1.1"

guards:
  - id: provenance_share
    reads: aggregates
    threshold: 0.5
    unit: fraction
    direction: below
    applies_to: [oracle, random, shipped_catalogue, strongest_name_table, llm_vocab, llm_algo, llm_full]
    grounding: >
      Design: "most of its configurations were fallbacks" (research proposal
      appendix B.3, restating §6.3) read as a majority of the run's time,
      by design; time-weighted fallback + held share below one half.

  - id: config_age
    reads: schedule+log+workload
    threshold: null
    unit: us
    direction: structural
    applies_to: [oracle, random, shipped_catalogue, strongest_name_table, llm_vocab, llm_algo, llm_full]
    grounding: >
      Structural: every non-boot entry takes effect before the ground-truth segment
      containing its query's t_set_change ends, or the recognition grade and the
      scheduling outcome belong to different segments. Value: the largest observation age.

  - id: starvation_floor
    reads: aggregates
    threshold: 30000000
    unit: us
    direction: at_or_below
    applies_to: all
    grounding: >
      Design: sched_ext's watchdog bound, borrowed for the deployment path — a
      runnable task left longer than timeout_ms, at most and by default 30 s, ejects
      the BPF scheduler (kernel/sched/ext.c:749-757, 3645-3662, 5649-5654 at v6.17);
      the shipped scx schedulers set 5-30 s; per task, max ready_wait over any cause
      on the whole file (metrics doc §6.1).

  - id: determinism
    reads: records+rerun_trace
    threshold: null
    unit: sha256
    direction: structural
    applies_to: all
    grounding: >
      Structural: same inputs ⇒ byte-identical trace (simulator-guide non-negotiable 4,
      data-contracts §9); the run's trace hash equals its rerun's.

  - id: utilisation_sanity
    reads: aggregates
    threshold: 1.0
    unit: fraction
    direction: at_or_below
    min_exclusive: 0.0
    applies_to: all
    grounding: >
      Arithmetic: busy ≤ T_end (metrics doc §8); strictly above 0 where the scoring
      spec carries terms for the file, so an empty trace that parsed is caught.

  - id: tick_count
    reads: records-build
    threshold: null
    unit: messages
    direction: structural
    applies_to: all
    grounding: >
      Structural: the primitives' consistency messages (metrics doc §6.2 guard, the
      stimulus count, the deadline cross-check, config_applied against the schedule)
      returned by the records build; any message fails the run.

  - id: validation_matches_provenance
    reads: schedule+log
    threshold: null
    unit: index
    direction: structural
    applies_to: [oracle, random, shipped_catalogue, strongest_name_table, llm_vocab, llm_algo, llm_full]
    grounding: >
      Structural: the log's validation sequence equals the schedule's provenance
      sequence minus the boot entry (data-contracts §8), compared positionally.

  - id: c2_pair
    reads: schedule+workload
    threshold: null
    unit: entries
    direction: structural
    applies_to: [oracle, shipped_catalogue, strongest_name_table, llm_vocab, llm_algo, llm_full]
    grounding: >
      Structural: under a recognition-driven condition the two files of a C2 pair
      must receive different configuration sequences over the segment whose label
      differs (rq0-preparation-notes stage 4.2) — the configuration in force at the
      segment's start and every entry stamped inside it, compared as (algorithm,
      params, cap); identical sequences fail. Traces are not compared: every pair's
      background task differs, so traces differ whatever the configuration (9.11 D15;
      9.14 decision 7). Value: the entries compared.

# The C2 pairs (dataset/timelines/coreset/c2-pairs.variant.yaml): `a` is the base,
# `b` the variant that changes one segment's label. The lint requires the list to
# equal the recipe's label-changing `c2-` variants; `c2-p2a-idle`, which changes a
# task's entry and no label (the bounding check's idle download), is not a pair.
pairs:
  - {a: c2-p1a, b: c2-p1b}
  - {a: c2-p2a, b: c2-p2b}
  - {a: c2-p3a, b: c2-p3b}
