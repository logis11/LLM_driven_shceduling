# The runner's machine configuration (8.6 spec, decision 1): how *this machine*
# runs an experiment — never anything experiment-shaped, which lives in the
# per-experiment spec under harness/experiments/. Copy to a file of your own
# (harness/runner.yaml is git-ignored) and edit; relative paths resolve against
# the repository root. This example drives the two mocks.
#
# The real programs (10.2): build the simulator (`make -C simulator/src`) and name each
# program with the version its source prints — the integration gate
# (`make -C harness gate`) refuses a version its source does not have, and the
# runner refuses one the experiment spec does not pin:
#   daemon:    {command: [python3, daemon/daemon.py], version: <make -C daemon version>}
#   simulator: {command: [simulator/src/sim],         version: <make -C simulator/src version>}

daemon:
  command: [python3, harness/tools/tests/mocks/mock_daemon.py]   # the prefix contract 10 flags are appended to
  version: mock-daemon@0                                          # hashed into every cache key
simulator:
  command: [python3, harness/tools/tests/mocks/mock_simulator.py]
  version: mock-simulator@3                                       # cross-checked against the trace header's `sim`

build_dir: dataset/build/coreset-single      # the compiled workloads
boot_defaults_dir: harness/boot-defaults     # <stem>.json per boot default the spec names
runs_dir: runs                               # <runs_dir>/<experiment>/<workload>/<run>/
cache_dir: runs/.cache                       # one entry per invocation key, both executions kept; results/ per run
# workers: 6         # runs at once on files under heavy_mb (default 1: one after another, in the runner's process)
# heavy_workers: 1   # runs at once on files of heavy_mb or more, each in a fresh process
# heavy_mb: 50       # a workload file this large is heavy (c6-dual's records hold gigabytes)
