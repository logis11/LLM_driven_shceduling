          cat /tmp/run.out; cp /tmp/run.out /tmp/meas/ 2>/dev/null || true
      - name: own the output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/meas && sudo chmod -R a+rX /tmp/meas
