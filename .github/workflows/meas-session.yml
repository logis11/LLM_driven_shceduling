          name: meas-session-${{ matrix.app }}-r${{ matrix.repeat }}-${{ needs.plan.outputs.mode }}-at-t300
          path: /tmp/part
          if-no-files-found: warn
      - name: stage install
        run: |
          while [ ! -e /tmp/meas/diag.install/done ] && kill -0 "$(cat /tmp/run.pid)" 2>/dev/null; do sleep 5; done
          rm -rf /tmp/part && mkdir -p /tmp/part && sudo cp -r /tmp/meas /tmp/part/ 2>/dev/null; cp /tmp/run.out /tmp/part/ 2>/dev/null
          sudo rm -f /tmp/part/meas/perf.*.data; sudo chown -R "$(id -u):$(id -g)" /tmp/part; echo "reached: $(ls -d /tmp/meas/diag.* 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: meas-session-${{ matrix.app }}-r${{ matrix.repeat }}-${{ needs.plan.outputs.mode }}-at-install
          path: /tmp/part
          if-no-files-found: warn
      - name: u+20s
