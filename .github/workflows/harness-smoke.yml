name: harness-smoke

# The full pipeline on the mocks over every scored coreset file (8.6 spec, decision 7,
# amended 2026-09-11): 4 h 50 min on the home machine over the rebuilt set (9.14 D14),
# so on demand only (9.23 B5); every push runs the smoke path over a few files in
# harness.yml's `make test` (test_runner.py).
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r harness/tools/requirements.txt -r dataset/tools/requirements.txt
      - run: make -C dataset dataset
      - run: make -C dataset variants    # the RQ0 gate spec lists the variant files (9.14)
      - run: make -C dataset generated   # the generated layer's sets; `check` reads every manifest (9.19)
      - run: make -C dataset check       # the build the harness reads is the blessed one (9.18)
      - run: make -C harness smoke
