name: daemon

on:
  push:
    branches: [main]
    paths-ignore: [.github/campaign.json]   # a campaign trigger push starts the measurement only
  pull_request:

jobs:
  driver-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r daemon/tools/requirements.txt
      - run: make -C daemon lint
      - run: make -C daemon test
