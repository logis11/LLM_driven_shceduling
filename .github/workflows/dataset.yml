name: dataset

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dataset/tools/requirements.txt
      - run: make lint
      - run: make test
      - run: make check
