  # ------------------------------------------------------------ idle
  - mode: idle
    background_wanted: true
    batch_bandwidth_cap: 0.5
    default: MLFQ
    justification: "Nobody present, maintenance only (c1-idle's four session daemons — the compositor shell, the audio server, the service manager and the message bus, observed in an idle Ubuntu session): there is no foreground to protect and nothing unwanted running, so the MLFQ default with equal shares."
    sources: [ostep]
    entries:
      MLFQ:
        params: {num_queues: 3, timeslice_us: 10000, timeslice_growth: 2, boost_interval_us: 100000}
        basis: theory
        justification: "MLFQ is the right answer for mixed, unknown work (OSTEP ch. 8; research-proposal §4.5 names idle under it); boot params."
        sources: [ostep]
  - mode: idle
    background_wanted: false
    batch_bandwidth_cap: 0.05
    default: MLFQ
    justification: "Nobody present but work nobody asked for is running (c7-idle's unattended upgrade): hold it to the floor so a returning user or a wanted job finds the lane free."
    sources: [ostep]
