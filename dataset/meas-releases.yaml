# dataset/meas-releases.yaml — where the raw records behind each measured value
# are kept: for every `meas-ci:<workflow>:<campaign>` tag the library
# (archetypes.yaml), the timelines, their variant recipes or the grid definition
# (grids.yaml) carry, the GitHub release or releases that hold the campaign's raw
# records, and each asset's sha256 as GitHub's API reports it
# (`gh release view <tag> --json assets`, field `digest`; read 2026-10-16).
#
# Companion to sources.yaml's `meas-ci` entry, which a tag resolves through to
# its docs/references.md entry. An input of no manifest.
#
# Rules (enforced by the dataset linter, `make lint`):
#   - every campaign tag the data carries has an entry here; a tag without one
#     fails — a workflow's artifacts are deleted after 90 days, so a campaign's
#     release is made before then
#   - an entry lists each release holding the campaign's records, with its tag,
#     its release page and each asset's name and sha256 (64 hex digits)
#   - a release that holds several campaigns appears under each, with the
#     assets its description names for that campaign: `meas-ci-2026-09-18`
#     holds `meas-ci:interactive:2026-09-18`, the first 43 repeats of
#     `meas-ci:interactive:2026-09-19` and `meas-ci:playback:2026-09-18`;
#     `meas-ci-2026-09-28` the other 34 repeats of `meas-ci:interactive:2026-09-19`;
#     `meas-ci-2026-09-20` `meas-ci:interactive:2026-09-20` and
#     `meas-ci:playback:2026-09-20`

