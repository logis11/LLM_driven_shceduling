      Per-application archetype (D2): one task carries the whole process tree merged (D14). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Input wakes: a contiguous slice of swell-outlook-c23 equal to each focus window, at a seed-drawn offset (D18); the slice preserves the recording's burst-and-pause structure. Operation `send` (spec decisions 8–10): the timeline names it and a start time; the compiler draws its length from the measured duration table (trigger to completion) and swaps in the operation's components for that span, emitting no input wake; it runs to completion past the focus window.

