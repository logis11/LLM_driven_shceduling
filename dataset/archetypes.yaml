# dataset/archetypes.yaml — the archetype library (v0.2)
#
# One entry per process behavior kind: the rule-plus-parameters bundle that
# emits a task's event stream. Normative writing plan: docs/workload/
# archetype-plan.md; execution semantics: docs/simulator/interpretation-
# contract.md; layer rules: docs/workload/building-plan.md §1–§2.
#
# Encoding rules (this file's schema is our invention — source tags justify
# values and described structure, never field names):
#   - top-level key = archetype id
#   - `category_source`: the Tier-1 ground of the entry's existence — `meas`
#     (a behavior class observed in our measurement of a named program), or
#     the published characterization the entry rests on (`lavd-ossna24` for
#     `game-task-chain`; archetype-plan §2)
#   - `declared_class`: the scheduling class the program declares for itself
#     (9.11 D4–D6, D16; 9.13): `normal`, or `idle` where the program sets
#     SCHED_IDLE on itself (`file-indexer`, `incremental-backup`); batch and
#     real-time values are added only when an entry carries work in that
#     class. Required on every entry, no default. The compiler copies it onto
#     every task that binds the entry and onto every spawned child from the
#     child entry; a task's class is its entry's, never read from its name
#   - `pattern.program`: program over the six grammar primitives
#     (RUN/SLEEP/TIMER/WAIT/WAKE/FORK+EXIT), referencing `params` by name
#   - `params`: every numeric is a distribution object
#     `{dist, <parameters>, sampling, source}`; times are integer
#     microseconds (`_us`); `dist: constant` for point values; measured
#     distributions are carried as quantile tables (9.5 changelog D17), a
#     lognormal only where a source gives a span (archetype-plan OQ-5)
#   - `sampling`: per-instance | per-task | per-iteration (bounded only) —
#     interpretation-contract §5
#   - `lifetime`: segment-bound | finite | spawned (canonical classes,
#     interpretation-contract §5)
#   - `binding_params`: names only — knobs the timeline/scenario binding must
#     supply (counts, caps, total work). Counts never carry values here
#     (archetype-plan §3); binding-time defaults live in modeling_notes prose.
#   - `scalable`: fields the lane-scaling compile pass may transform, with
#     the rule; empty list = intrinsic demand, never scaled
#   - `validation_stats`: what the meas-ci re-enactment must match, or the
#     stated reason no referee exists
#   - `modeling_notes`: what our encoding invented on top of the sources
#   - `meas-pending`: the tag a value awaiting a measurement campaign carries;
#     `make lint`'s freeze rejects it (archetype-plan §5, the linter rules for
#     the library)
#   - lognormal params are `{median_us, sigma_log}`; the compiler samples
#     median * exp(sigma_log * z)
#   - `quantiles` params are `{p: [p1, p5, p10, p25, p50, p75, p90, p95, p99,
#     p99.9]}` in integer microseconds, sampled by interpolation — measured
#     distributions carried as observed (9.5 changelog D17)
#   - measured per-application archetypes (category_source `meas`, 9.5, 9.8,
#     9.9) carry `components` (timer wakes per thread comm, D16) and, where
#     their observation holds them, `focus_components` (the driven cadence
#     inside focus windows), `stimulus` (a replayed input stream under
#     dataset/stimulus/, D18), `operations` and `heavy_events` (a rare run
#     carried as its own event, 9.5 D64, 9.8 D33); the compiler merges them into
#     one explicit event stream per task (D9), each timer wake a WAIT on the
#     task's timer channel with no deadline (D74). The playback and call
#     entries carry instead one periodic job per medium cycle — a constant
#     `period` and a measured per-cycle `cycle_run` (D75); TIMER, with its
#     period-implicit deadline, is theirs and the game chain's alone. The measured session and system
#     processes (9.9) carry `components` alone, one per process instance and
#     thread comm (`<instance>/<comm>`) where one task holds several processes
#     of a program
#   - `launch` (9.10 D21, D136–D138): the observed launch phase of an entry a
#     timeline starts mid-file, a stream file under dataset/launch/ — per pooled
#     repeat, the phase's length and its wakes, each its time from the phase's
#     start, its run and its thread. A task arriving after 0 s replays one repeat
#     from its arrival, then its steady stream begins; inputs, focus cadence and
#     operations land over the replay (D137); the periodic entries bin it onto
#     their cycle grid (D138)
#   - all source ids resolve against dataset/sources.yaml; locators validate
#     against each entry's locator_pattern

archetypes:

  # ---- measured per-application archetypes — 9.5 same-machine campaigns (meas-ci:interactive:2026-09-18 and
  # meas-ci:playback:2026-09-18 for the six; meas-ci:interactive:2026-09-19 for mail-client's send re-observation, its
  # idle phase since D79; meas-ci:interactive:2026-09-20 and meas-ci:playback:2026-09-20 for chrome and webrtc;
  # meas-ci:interactive:2026-09-25 for code, keys only, D72; meas-ci:interactive:2026-09-27 for mail-client's phases
  # with or after the input, keys only, D79) ----

