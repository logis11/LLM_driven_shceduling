      stats: ["steady wakes/s per renderer 0.1479\u20130.1825", "steady cpu-share 0.00008\u20130.00011"]
      scope: >-
        One observation (phase decision 2; D10): Google Chrome 152.0.7977.82 (14 repeats), Google Chrome 153.0.8010.52 (5: 12, 13, 14, 15, 16), launched as web-browser was (--no-sandbox --disable-gpu, plus --disable-features=SpareRendererForSitePerProcess), one window holding a foreground control tab and 12 background tabs at 12 loopback origins of one local page whose setInterval callback only increments a counter; observed past Chromium's intensive-wake-up-throttling grace (launch-settle 20 s, grace-settle 630 s: 330 s of the documented five-minute default and 300 s read from the probe, D15), a 600 s steady phase, under Xvfb with no window manager; on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure), the subject pinned to one CPU and the harness, page server and homeserver pinned away from it, perf sched record on that CPU; 19 same-machine repeats, every landing pooled (D24). Values describe one renderer, the 12 page renderers a job measures pooled as its samples (D14), of 16 --type=renderer processes observed — the control tab, Chrome's own extension and WebUI renderers and any renderer present for part of the phase dropped. The entry is majority `HangWatcher`, Chromium's hang-detection thread, 0.100 of 0.169 wakes/s per renderer; the page's own thread is 0.039 (D16). Values are floors: a page that does nothing but stay alive, on a runner without a GPU or display vsync (method §7); a renderer showing live content does more. Not covered: a tab just switched away from, before the grace (D3). Stability rule (9.5 D78): every value on the list — a table read by the mean it carries, over every repeat's samples — holds within 5 % or 1 µs except these, carried over the repeats obtained with their half-widths and ranges. Components whose rate varies between sessions, their values carried together (9.5 D57; D21, D24, D26): `Chrome_ChildIOT` wake rate 0.007 wakes/s ±18.5 % (0.001944–0.01056 wakes/s), gap mean 142.4 s ±18.5 % (94.7–514.3 s