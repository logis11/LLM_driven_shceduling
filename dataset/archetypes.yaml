        One observation (phase decision 2; D3, D10, D26): mpv 0.37.0 Copyright © 2000-2023 mpv/MPlayer/mplayer2 projec (31 repeats), --no-video --ao=null, the same file's AAC audio, looped, on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763 64-Core Processor, kernel 6.17.0-1022-azure), the application's process tree pinned to one of its CPUs, which the runner's own agent processes share (D21; method §4), under Xvfb 1280×800 — no display refresh, no GPU, no sound device; perf sched record on CLOCK_MONOTONIC over whole phases. No stimulus. One periodic job per audio cycle (D74, D75): a cycle starts at the first wake of the audio output thread `ao` after 5 ms of silence; the period is the mean interval between starts, 49.635 ms over 187,336 cycles; each job's run is the process tree's whole CPU from one start to the next, drawn per cycle from its measured table, and its deadline is the next cycle's start (period-implicit, liu-jacm73 (A2)). The deadline is the cycle's, not the output device's: an audio server buffers ahead of the device (PulseAudio up to 2 s by default, 9.5 search record S2), so a late cycle is not by itself an audible gap or a dropped frame. Stability rule (D26, D30, D78): every value on the list — a table read by the mean it carries, over every repeat's samples — holds within 5 % or 1 µs over the 31 repeats obtained. The repeat count is the rule's first pass (D88): simulated at the spread of the widest value, the play phase's CPU share at ±4.68 % over 31 repeats, the rule's stated 95 % interval covers the true mean in about 92 % of campaigns and the stopped mean leans by at most 0.2 %. Values are this software on this machine, not desktop truth (D10).
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. The threads' own wakes are not carried one by one: the tree's CPU is summed per medium cycle into one run per job (D75), so the compiled task wakes once per cycle; the per-thread tables stay in the pooled record. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase but the launch phase (9.10 D133, after the 2026-09-27 control) twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 1 interval read, about 0.1 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — play phase: the tree's CPU share 0.860 (0.834–0.886).

