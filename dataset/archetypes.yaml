      stats: ["run between voluntary blocks mean 1.876 ms (+-1.12 %), block per run mean 227.0 us (+-3.58 %), the initial sleep left out (9.10 D71)",
              "CPU total 39.435 s (+-0.28 %), 39.10-40.07 s over the repeats: the job's measured whole (9.10 D17, D70)",
              "the extractor 37.47-38.35 s, the miner 1.53-1.62 s, the GStreamer registry scan 93-106 ms; five processes in every repeat",
              "saturation 0.655-0.676 over the job, 0.891-0.919 from the miner's Initializing; the dominant thread 0.556-0.559 of the CPU",
              "share of CPU past the 10 ms boot slice 0.844-0.849; runs up to 4.98-5.48 s; share of runs followed by a block 0.648-0.669, 4.24-5.62 s of blocks a job",
              "the initial sleep 14.40-15.23 s, carried as the task's arrival (9.10 D71); the job 58.3-60.3 s from the miner's first schedule-in",
              "in every repeat the extractor's 5 s per-file deadline ended two PDFs, each followed by the miner's 1 s grace and a new extractor (9.10 D72); 875 files indexed, ten failures recorded"]
      scope: >-
        One observation (phase decision 2; 9.10 D5, D60-D68): Tracker Miners 3.7.1's first index of a home from an
        empty database, the file system miner (`tracker-miner-fs-3`, its user unit's command) and every process it
        starts — the metadata extractor, restarted after each deadline exit, and GStreamer's registry scanner — from
        the miner's first schedule-in to the extractor's last status change to Idle after extracting (D62, D63, D65,
        D69). The home holds HippoCamp's Bei profile (`hippocamp`, revision ff212ff7, `Bei/Fullset/Bei`: 875 files,
        40,662,407,070 B, 83 directories), HippoCamp's anonymized archetypal personal-computing environment rather
        than one person's files, placed whole as `~/Documents`, the other folders empty (design, D66-D68); no
        source grounds its 875 files as a home's file count (D66). Its settings as shipped, the 15 s initial sleep included (D61, D63); the database, the GStreamer registry and
        the page cache empty at the start, the cache dropped and its fraction verified (D73, D75). The state is a
        chroot of the default layer of an English 24.04.5.1 desktop install, 1,445 packages, built from Ubuntu's
        snapshot service as the archive stood at 2026-09-22T17:00Z (D61, D64), the miner started under a session bus
        of its own: no GNOME session and no system bus, so the miner reaches neither UPower nor UDisks2, and the
        extractor's sandbox cannot read /proc/self/mountinfo. Pinned to one CPU of a GitHub-hosted ubuntu-24.04
        runner (4 vCPU AMD EPYC 7763, 16 GB, kernel 6.17.0-1022-azure), the rest of the machine idealised; the
        runner's agent processes share the measured CPU outside the process tree, the session bus runs on the
        others. `perf sched record -a` from the harness CPUs and a taskstats listener on the measured CPU. 18
        same-machine repeats under the machine gate; the stability rule holds on all three values. The extractor's
        per-file deadline is wall-clock: a faster or busier core ends more or fewer files (D72). Values are this
        software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      The class is what the measurement shows (9.10 D70): the miner crawls the home in under 0.4 s after its
      initial sleep, then starts the extractor, whose work — PDF and office text, image metadata, GStreamer's
      discovery of audio and video — is 96 % of the job's CPU; the extractor's stock 5 s per-file deadline ends two
      scanned books' extraction, and the miner restarts it after a 1 s grace each time (D72). The task is
      `cpu-batch`'s batch loop — a run drawn from the tree's runs between voluntary blocks, pooled over every
      process, then the block that followed such a run, the tree's own off-CPU time, zero when another of its
      processes runs on — until `total_work` of CPU is spent; `total_work` binds the measured whole, the CPU total
      above (9.10 D17). The shipped 15 s initial sleep is not a block of the table: it precedes the work, so a
      file's arrival time reads as the end of that sleep (D71). The stages' order is not carried: the loop draws
      runs independently, so the deadline-ended runs of about 5 s fall anywhere in the job. The task shows
      `tracker-miner-f` (9.10 D74), the `comm` of the miner the user unit runs; most of the CPU under that name is
      the extractor's, and the name stands for the tree. One measured state serves both labels: a first login's
      index and the same work after the user's `tracker3 reset --filesystem` (D5); the registry scan, 93-106 ms, is
      first-login work a reset may not repeat (D73). Every thread of the miner and the extractor declares itself
      background work, SCHED_IDLE at nice 19 (9.6 D17), so the entry carries the declared class `idle` (9.11 D5,
      D6; 9.13): the task runs only when no task of another class is runnable and is preempted at once when one
      wakes, under every algorithm. Nice is not carried. A limitation of the strict class, stated (9.11 D16): on the
      depicted Ubuntu 24.04 desktop the miner's unit runs in `background.slice`, a separate CPU group from the
      editor's `app.slice`, where the slice weights give it about 23 % of the CPU against the editor's while both are
      runnable; the idle policy acts only among siblings of one group. The simulated indexer therefore interferes
      with the editor less than the depicted desktop's does, and the headroom the indexer files can show is
      understated. Its idle I/O class is not carried: the simulator schedules one CPU lane (9.11 D33).

