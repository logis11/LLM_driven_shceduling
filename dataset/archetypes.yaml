        # 5 comms cover 95.5 % of 0.211 timer-caused wakes/s per renderer (9.5 D16, target 95 %); the rest pooled as `residual`
    lifetime: segment-bound
    binding_params: []
    scalable: []
    validation_stats:
      referee: meas-ci
      run: "desktop:2026-10-05b, repeats [1, 2, 3, 4, 5], runs 37281764593, 37281847886, 37282164033"
      stats: ["steady wakes/s per renderer 0.2082\u20130.2152", "steady cpu-share of the 12 renderers 0.00009\u20130.00011"]
      scope: >-
        One observation (phase decision 2; D10): Google Chrome 154.0.8037.57 (5 repeats), launched as web-browser was (--no-sandbox --disable-gpu, plus --disable-features=SpareRendererForSitePerProcess), one window holding a foreground control tab and 12 background tabs at 12 loopback origins of one local page whose setInterval callback only increments a counter; observed past Chromium's intensive-wake-up-throttling grace (launch-settle 20 s, grace-settle 1,030 s: 330 s of the documented grace (five minutes while loading, 60 s once loaded), 300 s read from the probe (D15) and 400 s past the page thread's settling read from 9.10's 3,600 s probe (9.10 D152)), a 600 s steady phase, under Xvfb with no window manager; on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure), the subject pinned to one CPU and the harness, page server and homeserver pinned away from it, perf sched record -a from the harness CPUs; 5 same-machine repeats, every landing pooled (D24). Values describe one renderer, the 12 page renderers a job measures pooled as its samples (D14), of 16 --type=renderer processes observed — the control tab, Chrome's own extension and WebUI renderers and any renderer present for part of the phase dropped. The entry is majority `HangWatcher`, Chromium's hang-detection thread, 0.100 of 0.211 wakes/s per renderer; the page's own thread is 0.067 (D16). Values are floors: a page that does nothing but stay alive, on a runner without a GPU or display vsync (method §7); a renderer showing live content does more. Not covered: a tab just switched away from, before the grace (D3). Stability rule (9.5 D78): every value on the list — a table read by the mean it carries, over every repeat's samples — holds within 5 % or 1 µs except these, carried over the repeats obtained with their half-widths and ranges. Run means whose spread is the runner's speed, every thread of a repeat moving together while wake rates hold (D17): `HangWatcher` run mean 0.0262 ms ±18.1 % (0.021–0.031 ms); `chrome` run mean 0.0624 ms ±11.4 % (0.056–0.07 ms). Their runs hold 32.4 % and 51.8 % of the phase's CPU, 84.2 % together (D37). Components whose rate varies between sessions, their values carried together (9.5 D57; D21, D24, D26; 9.10 D156): `Chrome_ChildIOT` wake rate 0.0176 wakes/s ±6.5 % (0.01681–0.01861 wakes/s), gap mean 56.8 s ±6.5 % (53.7–59.5 s), run mean 0.0324 ms ±7.5 % (0.029–0.034 ms); within one run ±8.1 % (9.10 D156), its wake rate across the repeats ±5.1 %; `Compositor` wake rate 0.0083 wakes/s ±17.6 % (0.006667–0.01 wakes/s), gap mean 120.0 s ±17.6 % (100.0–150.0 s), run mean 0.0226 ms ±12.3 % (0.02–0.025 ms); within one run ±30.6 % (9.10 D156), its wake rate across the repeats ±20.0 %; `PerfettoTrace` wake rate 0.0083 wakes/s ±17.6 % (0.006667–0.01 wakes/s), gap mean 120.0 s ±17.6 % (100.0–150.0 s), run mean 0.0209 ms ±9.3 % (0.018–0.022 ms); within one run ±30.6 % (9.10 D156), its wake rate across the repeats ±20.0 %. These threads wake 5.0–10.6 times per renderer per 600 s phase. Sparse components, waking a few times per renderer per phase, their values carried together with their half-widths and their count, a spread that is the count's own and which the within-run test cannot place (D27): `residual` (`ThreadPoolServi`, `MemoryInfra`) wake rate 0.0096 wakes/s ±20.2 % (0.008333–0.01208 wakes/s), gap mean 104.3 s ±20.2 % (82.8–120.0 s), run mean 0.0346 ms ±61.3 % (0.0196–0.0578 ms), 5.0–7.2 wakes per renderer per 600 s phase; a 600 s window of 9.10's probe catches 1–4 of its wakes per renderer (±64.0 % within one run, 9.10 D156). Read in 100 s windows over the 5 repeats (9.10 D156): the page's own thread `chrome` runs 0.068 ms in the first 100 s and 0.057–0.072 ms after, its settling past; `MemoryInfra`, one of the residual's two comms, wakes at 3.6 times its phase rate in the first 100 s and 2.4 times 400–500 s in; the phase's windows hold 5.2 % of its CPU above its median window. The carried values are the phase's means. Read over 3,600 s in one long-phase probe past the 630 s grace-settle (9.10 D149, D152): the page's own thread runs 0.106, 0.083, 0.077 and 0.080 ms a wake in its first four minutes and 0.055–0.060 ms from the seventh, the settling the 1,030 s settle now covers; past it a 600 s window holds the wakes within 3.7 % of the probe's level at every placement and the CPU within −7.8 % and +10.4 %, an episode recurring some 1,800 s apart — the page thread at 0.072–0.075 ms, `Chrome_ChildIOT` waking 0.243–0.247/s against 0.200–0.210. The probe ran Google Chrome 154.0.8037.57, the build these repeats ran. That build is not the 152 and 153 9.8's campaign and `web-browser` ran, Google's repository serving only its current build (9.5 D69; 9.10 D156): against 9.8's 19 repeats the page's own thread wakes 1.72 times as often and `Chrome_ChildIOT` 2.51 times, the renderer 0.211 against 0.169 wakes/s, while the page thread's runs, its settling past, are 35 % shorter and the 12 renderers' CPU share 9.6 against 9.2 × 10⁻⁵; `web-browser` stays 152 and 153's, the two halves of one browser on two builds. Values are this software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      Per-application archetype (9.5 D2): one task carries the one renderer process, the renderers of a browsing session bound as separate tasks (D2) — under Chromium's site-per-process model one renderer is one site, not one tab (S2-01); web-browser carries the rest of the browser's tree, the renderer of the page in use included (9.5 D84). Timer components are per thread comm (9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9); the pooled residual stands for the comms below the coverage cut. No focus_components and no stimulus: the state is unattended by construction (D10). Sporadic wakes, not carried as components (9.5 D43): `HangWatcher` (event) in 2 of 5 repeats, 0.0001 wakes/s; `chrome` (event) in 1 of 5 repeats, 0.0 wakes/s. Untraced control (the 9.5 untraced-control spec): six jobs each ran twice the steady phase `meas-ci:desktop:2026-09-20` measured, on Google Chrome 153 past a 630 s grace-settle (the phase the entry carries, on Google Chrome 154 past a 1,030 s grace-settle, 9.10 D152 and D156, and its launch phase, 9.10 D133, came after the 2026-09-27 control), traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 14 intervals read, about 0.7 differences by chance alone. Perf's effect read on that phase, the carried values staying the traced ones — steady phase: `HangWatcher` run mean 0.974 (0.950–0.998) and wake rate 1.003 (1.002–1.003).

