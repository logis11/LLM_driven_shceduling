        the five. Pinned to one CPU of a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel
        6.17.0-1022-azure), the rest of the machine idealised; no desktop session; `perf sched record` and a taskstats
        listener on the measured CPU. 26 same-machine landings under the machine gate (repeats 7, 10 and 11 landed
        twice, every landing pooled: D58); the stability rule holds on 59 of the 60 values, the tail's block per run
        carried with its half-width (D58). Values are this software on this machine, not desktop truth (9.5 D10).
