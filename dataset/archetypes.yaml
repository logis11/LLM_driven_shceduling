nd 44, a window of the phase every 60 s) they move by ±23.4–28.4 %, ±25.3–47.0 % and ±13.6–16.7 % of their mean, against ±43.8 %, ±42.6 % and ±41.7 % across the repeats (half the range over the mean): the spread lies in part within a run. It wakes 16–38 times a phase and is the entry's whole activity once the wakes owed to outside causes are out (D27). Wakes traced to a cause outside the observed desktop — a package Ubuntu 24.04's desktop manifest does not hold, a desktop package's unit that a stock install leaves disabled and the runner image enabled, or the harness — left the components and are stated (D27, D37): php8.3-fpm.service (php8.3-fpm) 185–225 a phase; job phpsessionclean (php-common) 3–7 a phase; job podman (podman) 0–32 a phase; systemd-networkd.service (systemd) 0–6 a phase. Desktop jobs bound to a clock time are events of the phase, stated and not carried (D27, D47, in D23's form): job sysstat-summary (sysstat) 22 over the 24 repeats; anacron.service (anacron) 13 over the 24 repeats; job anacron (anacron) 11 over the 24 repeats; job motd-news (base-files) 10 over the 24 repeats; job fstrim (util-linux) 7 over the 24 repeats; job man-db (man-db) 7 over the 24 repeats. Kept, their cause not resolved by the trace: job launched by pid 1: (install) 9 install systemd 4 over the 24 repeats. A cron job's session is stated, not carried (D23, D26): the session of the sphinxsearch indexer's cron job at 00:00 UTC — a package of the runner image, not of the desktop install — met the phase in 4 of 24 repeats (47, 48, 49, 51), 318–364 s into it; the 245 rows it held inside two seconds of each cron wakeup (56, 65, 55, 69 per repeat) left the components, which are read without them. Foreign user-space work on the measured CPU 0.00097–0.0022 % of the phase per repeat, under the 2 × 10⁻⁴ bound (D20, D22); per-CPU kernel threads 11,608–15,472 schedule-ins on it per repeat, reported, not gated (D14). Values are this software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      Per-program archetype (D2, D5), bound by identity to the timelines' `dbus-daemon` task, which stands for both buses (D6): one task carries the program's processes, each instance's threads its own components (D4, D6, D7; 9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9). No focus_components and no stimulus: nobody is present (D9). `session-bus` woke only in repeats 47, 48, 49, 51 (111 wakes), every one of them taken out of the component by the cron session's window (D23) or by its cause (D27); the entry carries none. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 2 intervals read, about 0.1 differences by chance alone, none found.
