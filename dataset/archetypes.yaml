    modeling_notes: >-
      Per-application archetype (9.5 D2): one task carries the one renderer process, the renderers of a browsing session bound as separate tasks (D2) — under Chromium's site-per-process model one renderer is one site, not one tab (S2-01); web-browser carries the rest of the browser's tree, the renderer of the page in use included (9.5 D84). Timer components are per thread comm (9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9); the pooled residual stands for the comms below the coverage cut. No focus_components and no stimulus: the state is unattended by construction (D10). Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 14 intervals read, about 0.7 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — steady phase: `HangWatcher` run mean 0.974 (0.950–0.998) and wake rate 1.003 (1.002–1.003).

