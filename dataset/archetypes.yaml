      The class is what the measurement shows (9.10 D52): a parallel make, about eight jobs live at cap 8, then a
      serial tail. The orchestrator runs the build's jobs in the order landing 23 ran them (`job_order`, run-length
      coded: o object, p kbuild probe, c and C conftest tests without and with as; the 26 landings' orders differ only
      by adjacent swaps, at most one job of a kind apart at any point), one dispatch run before each job's FORKs (9.6
      D19). `fork_cap` is `parallelism_cap` x 6, 9.6 D19's rule (D57): the simulator counts live tasks, and a conftest
      test has 8 or 10 members, so while conftest tests are in flight (about 27 % of the build) fewer than eight jobs
      run at once; live members over the build average 49.0 against 48. With its children done, the orchestrator runs
      the tail - strip and zstd compressing the five modules, then depmod - as cpu-batch's batch loop until
      `tail_work`, the tail's pooled CPU, is spent (D54). Unmodelled, about 1.8 % of the job: 841 helper and 13 link
      jobs, the dkms script before the make, and the kernel image's second hook run (D54). The premise, stated (D46):
      the user installed `nvidia-driver-595-open` by apt, which pulls in the DKMS package; Ubuntu's `ubuntu-drivers`
      installs prebuilt modules instead (S2-36), and its kernels ship ZFS and v4l2loopback prebuilt (S2-35). The task
      shows `dkms`, the program that runs the make and the tail (D55); its spawned children carry their observed
      comms. Spawn-table entries sample per-instance (interpretation-contract §5).

