    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Each timer wake is a WAIT on the task's timer channel, woken at its sampled absolute time, with no deadline (D74). Inside focus windows the driven-phase components replace the idle ones; no input wake is emitted (the stimulus was scripted). Operation `unsharp-mask` (spec decisions 8–10): the timeline names it and a start time; the compiler draws its length from the measured duration table (trigger to completion) and swaps in the operation's components for that span, emitting no input wake; it runs to completion past the focus window. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 7 intervals read, about 0.4 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — operation phase, over the whole phase: `gimp` run mean 0.981 (0.970–0.992) and wake rate 1.021 (1.007–1.034), `script-fu` wake rate 0.972 (0.964–0.979). The driven runs start from the control's prelude (the image reverted, the pointer over the canvas), in which the main thread wakes about 18 % less often with about 19 % longer runs than in the carried pool at the same CPU share; the driven ratios are perf's effect in that state.

