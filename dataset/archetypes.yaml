        One observation (phase decision 2; D8): dbus-daemon 1.14.10-4ubuntu4.1 — the system bus and the session bus in one task (D6), in an Ubuntu 24.04 desktop session — ubuntu-desktop-minimal from the runner's own archive, a dedicated user logged in by GDM's automatic login after a 300 s priming login and a logout (D16) — in its terminal idle state: nobody present past idle-delay, the shield up and locked, the monitor blanked by the power daemon, each checked at the steady edge 420 s after the measured login (D9, D13, D18); a 1800 s steady phase (D22); on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure), the four entries' processes confined to one CPU and every other process of the session, the system and the harness kept on the others, the placement read from the processes after the pin and at the steady edge (D10, D21), perf sched record on every CPU; 24 same-machine repeats, every landing pooled. Not covered: the bus traffic of a session in use, nor the session's start-up (D9). Limits of the observation (method §7): GNOME Shell started with --headless --virtual-monitor 1920x1080@60 by a unit drop-in, on a seat with no display device and no vblank; no sound device, WirePlumber's null sink; the cpuset controller delegated to the user manager by a drop-in on user@.service (D14); the four entries' units in a slice of their own and the other slices defaulted to the other CPUs (D17), the system bus restarted into that slice before any login (D21); the pinned units' other processes moved into a scope of their own (D15); per-CPU kernel threads sharing the measured CPU; a server VM with its own agents, off the measured CPU. `system-bus/dbus-daemon` is carried as a sparse component, its three values together with their half-widths and its count (9.8 D27; D33): wake rate 0.0057 wakes/s ±43.8 % (0.0000–0.0200 wakes/s); gap mean 238.6 s ±45.7 % (50.0–900.0 s) over the 18 repeats it woke in; run mean 0.188 ms ±25.0 % (0.126–0.472 ms) over the 18 repeats it woke in. It wakes 0–36 times a phase, none at all in 6 of the 24 repeats — its gap table is over the 24 repeats laid end to end and wrapped round, the silent ones adding their time (9.5 D71), so the entry compiles at the rate it carries, and is the entry's whole activity once the wakes owed to outside causes are out (D27, D32); its spread is the count's own, which the within-run test cannot place (D28's figures were read with the collector's wakes present). Wakes traced to a cause outside the observed desktop — a package Ubuntu 24.04's desktop manifest does not hold, a desktop package's unit that a stock install leaves disabled and the runner image enabled, or the harness — left the components and are stated (D27, D32): php8.3-fpm.service (php8.3-fpm) 185–225 a phase; job sysstat-collect (sysstat) 6–21 a phase; job phpsessionclean (php-common) 3–7 a phase; job podman (podman) 0–32 a phase; job sysstat-summary (sysstat) 0–7 a phase. Desktop jobs bound to a clock time are events of the phase, stated and not carried (D27, in D23's form): anacron.service (anacron) 13 over the 24 repeats; job anacron (anacron) 11 over the 24 repeats; job motd-news (base-files) 10 over the 24 repeats; job fstrim (util-linux) 7 over the 24 repeats; job man-db (man-db) 7 over the 24 repeats. Kept, their cause not resolved by the trace: job launched by pid 1: (install) 9 install systemd 4 over the 24 repeats. The wakes systemd-networkd causes are kept by the package rule; whether a stock desktop, which runs NetworkManager, also runs networkd is unverified (D27). A cron job's session is stated, not carried (D23, D26): the session of the sphinxsearch indexer's cron job at 00:00 UTC — a package of the runner image, not of the desktop install — met the phase in 4 of 24 repeats (47, 48, 49, 51), 318–364 s into it; the 245 rows it held inside two seconds of each cron wakeup (56, 65, 55, 69 per repeat) left the components, which are read without them. Foreign user-space work on the measured CPU 0.00097–0.0022 % of the phase per repeat, under the 2 × 10⁻⁴ bound (D20, D22); per-CPU kernel threads 11,608–15,472 schedule-ins on it per repeat, reported, not gated (D14). Values are this software on this machine, not desktop truth (9.5 D10).
