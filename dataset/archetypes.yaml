      scope: >-
        One observation (phase decision 2; 9.10 D4, D46-D51): DKMS's autoinstall of `nvidia-dkms-595-open` 595.91.07,
        the open kernel module of NVIDIA's 595 branch (`XB-Support: PB` in Ubuntu's control file; D47), for the security kernel `7.0.0-34-generic`, run by
