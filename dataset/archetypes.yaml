              "the job 162.5-174.9 s: duplicity's dry run 59.9-64.1 s, the incremental 96.9-106.4 s, the verify 4.1-4.3 s"]
      scope: >-
        One observation (phase decision 2; 9.10 D8, D112-D121): Déjà Dup 45.2 and duplicity 2.1.4 as Ubuntu 24.04
        packages them (`deja-dup` 45.2-1build2, `duplicity` 2.1.4-3ubuntu2), at Déjà Dup's defaults with its password
        remembered (D117) — encrypted by gpg, 200 MB volumes — making its scheduled weekly incremental, started by
        its own monitor through `chrt --idle 0 ionice -c3` (D112), of a home holding Matt Mahoney's 10 GB set (79,431
        files; 9.7 D7) after seven days of Cumulus's personal-machine change rates — 9,729 changed files of 883.1 MB
        and 304.2 MB of new files, the changed part an upper bound (D115) — following a first backup made by Déjà
        Dup's own assistant, to an ext4 filesystem on a loop device standing in for an external drive (D114). The job
        is the tree of the `deja-dup` the monitor starts, from its first schedule-in to its exit: duplicity's
        collection-status, its dry-run sizing pass, which every backup runs (D119), the incremental with one gpg per
        volume, and the verify's restore; the set and Déjà Dup's cache in the page cache (D116). The state is a chroot
        of the default layer of an English 24.04.5.1 desktop install, 1,445 packages, built from Ubuntu's snapshot
        service as the archive stood at 2026-09-22T17:00Z, with `apt-get install deja-dup` adding 9 (D113). Pinned to
        one CPU of a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, 16 GB, kernel 6.17.0-1022-azure), the
        rest of the machine idealised; the session — the monitor, its bus, the keyring — and the runner's agent
        processes share the measured CPU outside the tree; no system bus. `perf sched record -a` from the harness CPUs
        and a taskstats listener on the measured CPU. 30 same-machine repeats under the machine gate, 28 pooled
        (repeats 12 and 25 fetched no set); the stability rule holds on all three values. The disks' I/O scheduler is
        `none`, so the idle I/O class has no effect. Values are this software on this machine, not desktop truth (9.5
        D10).
    modeling_notes: >-
      The class is what the measurement shows (9.10 D119): the tree is runnable for its whole job but spread over
      several threads — duplicity's incremental and its dry run, and deja-dup's main thread, which runs beside each
      duplicity — with no dominant thread, so it is not `cpu-batch` by 9.6 D7's criterion. The task is `cpu-batch`'s
      batch loop — a run drawn from the tree's runs between voluntary blocks, pooled over every process, then the
      block that followed such a run, the tree's own off-CPU time, zero when another of its processes runs on --
      until `total_work` of CPU is spent; `total_work` binds the measured whole, the CPU total above (9.10 D17). The
      stages' order is not carried: the loop draws runs independently. The task shows `deja-dup` (9.10 D120), the
      `comm` of the process the monitor starts; most of the CPU under that name is duplicity's and gpg's. The run
      between voluntary blocks pools two ways deja-dup reads duplicity's log in the dry run, after nearly every write
      or in batches, the interleaving of a pipe's writer and reader on one CPU (9.10 D122). Every process of the tree
      runs in SCHED_IDLE and the idle I/O class, as the monitor starts it (9.10 D112), so the entry carries the
      declared class `idle` (9.11 D5, D6; 9.13): the task runs only when no task of another class is runnable and is
      preempted at once when one wakes, under every algorithm. Nice is not carried. The backup runs in the editor's
      own CPU group — the monitor's autostart scope under `app.slice` — so the strict class matches the depicted
      desktop's treatment, an idle weight of 3 against 1 024 and preemption at once (9.11 D16). Its idle I/O class
      is not carried: the simulator schedules one CPU lane (9.11 D33). The two-monthly restore test, with a fresh cache and the password asked, about one
      weekly run in nine, is not depicted (9.10 D118). `file-backup`, borg's first backup into a new repository, left
      the library when the backup files bound this entry (9.10 D119).

  # ---- the frame chain — grounded in lavd-ossna24 -------------------------

  game-task-chain:
    category_source: lavd-ossna24
    declared_class: normal
    pattern:
      constructor: chain           # expanded at load time, interpretation-contract §6
      program:                     # per constructed chain member; the
        - loop:                    # wineserver member runs wineserver_run
            - WAIT: upstream
            - RUN: per_schedule_run
            - WAKE: downstream
    params:
      wineserver_run:
        {dist: constant, value_us: 260, sampling: per-instance,
         source: "lavd-ossna24:s13"}
      per_schedule_run:
        {dist: lognormal, anchor_min_us: 260, anchor_max_us: 1650,
         sampling: per-task, source: "lavd-ossna24:s13"}
      frame_period:
        {dist: constant, value_us: 16667, sampling: per-instance,
         source: "steamos-refresh"}
      chain_length:
        {dist: constant, value: 16, sampling: per-instance,
         source: "lavd-ossna24:s12"}
    lifetime: segment-bound
    binding_params: [lane_share, member_names]   # 9.10 D26: the members' names, after the head and wineserver
    scalable:
      - fields: [chain aggregate demand]
        rule: scale the chain's aggregate demand per frame to lane_share of
          the lane (building-plan §5a).
    validation_stats:
      referee: none
      reason: validation against LAVD would be circular — LAVD is also the
        parameter source (stated as such, building-plan §7) — and a CI
        runner cannot observe a Proton game's Wine, DXVK or audio structure
        (no GPU; Proton is documented only as a tool for use with the Steam
        client), so no own measurement referees it.
    modeling_notes: >-
      Source: lavd-ossna24 slides 12-17 taken as one observation of an
      unnamed game on an unnamed machine; the deck names no trace tool
      (perf sched record is what Min's later analysis tool, VaporMark, reads,
      as edge-lwn26 reports his LPC 2025 session); the deck's figures draw on at least three process trees and the text
      does not say which feeds slides 12-14 (recorded decision). frame_period
      is not in the deck: the game is modelled as display-paced at the Steam
      Deck LCD default refresh with the 1:1 frame limit (steamos-refresh:
      60 Hz; 16667 us is 1/60 s arithmetic) — design, ours.
      The only entry whose topology is a parameter: the compiler's chain
      constructor expands it into chain_length members plus the wineserver
      member, chain_length + 1 ordinary tasks, with WAIT/WAKE channels wired
      from the head to the last member, standing in for the
      source's "from a user input to display update" (s17); no intermediate
      stage is named by the source. The linearization of the s16-s17
      waker-waiter graph into one chain, and every field name, are ours:
      the source's graphs are a fan-in (four task workers -> dxvk-cs), a
      two-step chain (dxvk-cs -> dxvk-submit), 2-cycles among the audio
      threads and a hub around wineserver (s11, s16), and s17 says the
      majority of game tasks are individually periodic, whereas here only
      the head is timer-driven. per_schedule_run: the anchors are the source's two named
      per-schedule runtimes, a coordination task (wineserver, 260 us) and a
      work task (a task worker, 1.65 ms), spanning its stated "a few 100s
      usec on average to a few msec maximum" (s13); the statistic behind the
      two examples is not labelled on the slide, and the slide's plot of
      per-task runtime averages (one game, ~128 tasks, median ~0.04 ms) is a
      different population from the chain's most-scheduled tasks and is not
      used. Reading the anchors as a p05/p95 span, the lognormal family
      (OQ-5 convention; the compiler derives median/sigma from the span) and
      the one draw per member are ours; the per-member draw rests on the
      source's "Task execution time is very stable and is predictable using
      its average" (s13). The source's per-schedule runtime is taken as the
      per-wake RUN: a schedule that ends by preemption is one wake cut in
      pieces, so the RUN under-states one wake's demand; the deck's own
      s14 bounds the size (preemption 25-30 % of scheduling events,
      sched_preempt 28.78 % on the pie), about 1.4 schedules per wake on
      average, larger for the long-running work tasks whose runs approach
      the scheduler's slice (s13: 1.65 ms worker; scx_lavd's source comment
      divides a 15 ms targeted latency among 10 runnable tasks, 1.5 ms each,
      scx) and near 1 for short coordination tasks. Direction downward,
      no value changed; 9.14 sweeps chain-member RUNs over that factor.
      Sampled scheduler logs of four other games under
      scx_lavd show game threads at tens of us per schedule (different
      accounting; not a source here). chain_length 16 is a point chosen inside the
      source's "15-20 game-specific tasks" (s12) — design within a source
      range; the wineserver member is outside that count (the source files
      wine among the system tasks). The entry models the chain only: the source
      counts ~300 tasks scheduled system-wide while a game runs (s12,
      including system tasks) and says nothing about what the tasks outside
      its top 30-40 do, so no tail population is constructed here. The game's
      threads beyond the chain and wineserver are omitted, here and in every
      timeline that binds the entry: the source puts 95% of scheduling in its
      top 30-40 tasks (s12) and describes none outside them (9.10 D19). Two
      source facts the encoding does not model: "Around 90% are long-living
      tasks; only 10% of tasks are terminated" (s12, window
      unstated) — every member here lives for the whole segment; "70-75% of
      scheduling is initiated by waiting system calls" against 25-30%
      preemption (s14) — the wake mix here is fixed by the wiring (one
      TIMER head, WAIT members), not sampled. Lane-scaling: the concentration statistics (top 30-40
      tasks = 95% of scheduling; 15-20 game-specific tasks take 60-70%, s12)
      are scheduling-frequency shares; scaling the chain's RUN values so its
      per-frame demand equals lane_share is our calibration, not the
      source's. Wineserver is a member of the constructed chain, named
      `wineserver`, placed right after the head with RUN = wineserver_run:
      the source names it as a coordination task at 260 us per schedule
      (s13), draws it as the hub of the game's dispatcher threads (s11), and
      gives its edges to and from the game process the largest counts in the
      s16 graph (epoll from wineserver to the game, pipe_read from the game
      to wineserver). Those edges are a request/reply round trip (each Wine
      call is a request write and a blocking reply read); a linear relay
      cannot return to a node, so the relay passes the wake on to the next
      member instead — the same linearization applied to the whole graph,
      ours. Its RUN scales with the chain in -single mode (design). The
      timelines' member_names are slide 16's thread names, but six members
      carry the process name Troy.exe: slide 16 shows one Troy.exe node, and
      a Wine thread that sets no name of its own keeps its process's comm
      (9.10 D26), a rule that is ours. declared_class normal is design: the
      9.13 rebuild's default for an entry with no measured class
      (lavd-ossna24 records none, and the 9.11 class census holds no
      measurement of this entry).

