      scope: >-
        One observation (phase decision 2; D10): the Steam desktop client, build 1788652215 (steam-installer), logged out — no account is used, and none may be (D6) — its window shown; launch-settle 900 s (D15), a 600 s shown phase, under Xvfb with openbox so the window can be minimised; on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure), the subject pinned to one CPU and the harness, page server and homeserver pinned away from it, perf sched record on that CPU; 12 same-machine repeats, every landing pooled (D24). Not covered: a client that is logged in, holds a library, downloads, or runs behind a game — the state the gaming timelines depict (D6). Stability rule: every value on the list holds within 5 % or 1 µs except these, carried over the repeats obtained with their half-widths and ranges. Run means whose spread is the runner's speed, every thread of a repeat moving together while wake rates hold (D17, D18): `steam` run mean 0.0555 ms ±10.2 % (0.044–0.068 ms); `IPC:CSteamEngin` run mean 0.0573 ms ±8.8 % (0.047–0.068 ms); `CJobMgr::m_Work` run mean 0.0176 ms ±6.2 % (0.015–0.02 ms); `VizCompositorTh` run mean 0.0819 ms ±5.5 % (0.066–0.089 ms); `CHTTPClientThre` run mean 0.0312 ms ±46.0 % (0.014–0.064 ms). Components whose rate varies between sessions, their values carried together (9.5 D57; D23): `steamwebhelper` run mean 0.0696 ms ±5.3 % (0.063–0.082 ms); within one run gap mean ±0.1 % (D22), its wake rate across the repeats ±0.4 %. `steamwebhelper` carries 23.6 % of the client's wakes and its gap table is identical through its 99th percentile in every repeat, the mean moved by a handful of gaps past it (D22). Measured beside it, shown against minimised (D5): wake rate 299.325 against 244.398 (1.225×), the comparison D5 rests on; the CPU share ratio, 1.259×, is reported with its spread and no effect rests on it (D18). Values are this software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      Per-application archetype (9.5 D2): one task carries the whole process tree merged (9.5 D14). Timer components are per thread comm (9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9); the pooled residual stands for the comms below the coverage cut. No focus_components and no stimulus: the state is unattended by construction (D10).

