        the open kernel module of NVIDIA's production branch (D47), for the security kernel `7.0.0-34-generic`, run by
        the stock Ubuntu 24.04 unattended upgrade's install stage of 2026-09-23 (D48). The state is a chroot of the
        default layer of an English 24.04.5.1 desktop install, 1,445 packages, with the HWE kernel the installer adds
        (`7.0.0-31`) and `nvidia-driver-595-open` installed by apt (D46, D49), built from Ubuntu's snapshot service as
        the archive stood at 2026-09-22T17:00Z, its download stage run against the archive at 2026-09-24T00:00Z (D51).
        The job is every process under the two DKMS kernel hooks of that stage (D50): the headers' hook built the module
        in every landing; the image's hook ran after it, 0.13-0.145 s. The build runs at -j8 through
        `OMP_NUM_THREADS=8`, `nproc` being what NVIDIA's `dkms.conf` and dkms read (D4's eight-thread desktop, design;
        D50). No boot loader or `shim-signed` in the chroot, so no module is signed, where a Secure Boot desktop signs
        the five. Pinned to one CPU of a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel
        6.17.0-1022-azure), the rest of the machine idealised; no desktop session; `perf sched record` and a taskstats
        listener on the measured CPU. 26 same-machine landings under the machine gate (repeats 7, 10 and 11 landed
        twice, every landing pooled: D58); the stability rule holds on 59 of the 60 values, the tail's block per run
        carried with its half-width (D58). Values are this software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      One make job is the chain of processes it runs, one task per member of its kind's tree (`trees`; 9.10 D53, 9.6
      D19): object jobs the kernel build's six-process chain, kbuild's compiler probes `sh` -> `mkdir`, `gcc` ->
      `cc1`, `as`, `rm`, and NVIDIA's conftest tests `sh` -> `sh` (`conftest.sh`) -> `dirname`, `gcc` -> `cc1` (->
      `as`), `rm`, `sh`, `sh`. A member's CPU per structural step is its CPU between its own children's exits (9.6
      D20); the compiler builds each member's program from the tree as `compiler-child`'s: the root runs first, a
      member runs a step, wakes its next child and waits, and wakes its parent when done, waiting without CPU until
      the root ends the job. A job is fitted to its tree by role, children in fork order; a further process of a role
      the tree has there adds its CPU to that member, any other process its subtree's CPU to its parent member's step
      in which it was forked (D53): a test that compiled twice is drawn as one, `objtool`'s CPU in its six object jobs
      folds into `sh`. The compiler driver shows its comm, `x86_64-linux-gn` (D55); `cc1` takes the orchestrator's
      `child_name`.

