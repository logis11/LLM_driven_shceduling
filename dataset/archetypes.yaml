      Per-application archetype (9.5 D2): one task carries the whole process tree merged (9.5 D14). Timer components are per thread comm (9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9); the pooled residual stands for the comms below the coverage cut. No focus_components and no stimulus: the state is unattended by construction (D10). Bound by stated approximation (D7): discord, whose Linux client cannot be observed without an account and has no self-hosted server. Discord keeps its connection with a gateway heartbeat at a server-assigned interval (documented example 45 s) where Matrix clients hold a 30 s /sync long poll; no Linux observation of Discord's wake cadence or CPU per wake exists, so the direction of the error is not known. The injected-overlay role is withdrawn: Discord's overlay is Windows-only (D7). Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 12 intervals read, about 0.6 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — idle phase: `Chrome_ChildIOT` run mean 0.931 (0.910–0.952), `Chrome_IOThread` run mean 0.843 (0.809–0.877), `ThreadPoolForeg` run mean 0.909 (0.861–0.958), `ThreadPoolServi` run mean 0.880 (0.807–0.952). The second idle run wakes `Chrome_IOThread` and `Chrome_ChildIOT` about 3–4 % more than the first, traced or not; the control ran Element 1.12.29, the carried pool 1.12.28.

