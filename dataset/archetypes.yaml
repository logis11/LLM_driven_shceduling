    pattern:
      program:
        - loop:                    # merged event stream, explicit at compile time (D9): replayed stimulus in focus windows (D18) + timer components (D16)
            - WAIT: input
            - RUN: event
    params:
      input_run:
        {dist: quantiles, p: [1393, 1735, 2258, 2900, 4561, 7420, 10944, 12340, 21092, 109265], sampling: per-iteration, source: "meas-ci:interactive:6"}
      stimulus:
        {stream: swell-word-c1, sampling: per-task, source: "swell-icmi14:word-c1"}
      components:
        - comm: "soffice.bin"
          threads: 1
          wakes_per_s: 3.448
          gap: {dist: quantiles, p: [222, 318, 346, 401, 98195, 600663, 600684, 600696, 600712, 600757], sampling: per-iteration, source: "meas-ci:interactive:6"}
          run: {dist: quantiles, p: [12, 13, 15, 23, 76, 325, 353, 368, 394, 697], sampling: per-iteration, source: "meas-ci:interactive:6"}
        # 1 comms cover 100.0 % of 3.4 wakes/s (D16, target 95 %); the rest pooled as `residual`
    lifetime: segment-bound
    binding_params: []
    scalable: []
    validation_stats:
      referee: meas-ci
      run: "interactive:6, repeats [1, 2, 3, 4, 5]"
      stats: ["idle wakes/s 3.4\u20133.5", "idle cpu-share 0.0005\u20130.0006", "driven wakes/s 31.6\u201343.0", "driven cpu-share 0.0122\u20130.0166", "driven-alt wakes/s 43.7\u201352.6", "driven-alt cpu-share 0.0155\u20130.0320", "input_run p50 ms per repeat [5.082, 4.084, 4.299, 4.89, 4.654]"]
      scope: >-
        One observation (phase decision 2; D3, D10): LibreOffice 24.2.7.2 420(Build:2) (Ubuntu 24.04 apt), a generated document of about 76 pages (100 sections of five 100-word paragraphs, ten 1024×768 pictures; design — no source states a length, S7) with the stream typing at its end, on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure) under Xvfb 1280×800 — no display refresh, no GPU, no sound device; perf sched record on CLOCK_MONOTONIC over whole phases. Stimulus: SWELL-KW stream swell-word-c1 replayed per event by xdotool at recorded gaps (error p99 1.24 ms), keys and pointer events together, pointer positions scaled into the content area (D5, D12); the recordings' timestamps are quantised at 15.6 ms. Per-input run is the window rule (D13): all run time of the process tree until the next input minus the idle rate. Stimulus sensitivity (pre-registered, method §3): under a 136M Keystrokes transcription stream (dhakal-chi18) the per-input run p50 is 5.09 ms against 4.56 ms under SWELL-KW (+12 %); the archetype carries SWELL-KW. Values are this software on this machine, not desktop truth (D10).
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Input wakes: a contiguous slice of swell-word-c1 equal to each focus window, at a seed-drawn offset (D18); the slice preserves the recording's burst-and-pause structure.

