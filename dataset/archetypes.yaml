  # meas-ci:playback:2026-09-18 for the six; meas-ci:interactive:2026-09-19 for mail-client's send re-observation, its
  # idle phase since D79; meas-ci:interactive:2026-09-20 and meas-ci:playback:2026-09-20 for chrome and webrtc;
  # meas-ci:interactive:2026-09-25 for code, keys only, D72; meas-ci:interactive:2026-09-27 for mail-client's phases
  # with or after the input, keys only, D79) ----

