            - WAIT: input
            - RUN: event
    params:
      launch:
        {stream: launch-office-writer, sampling: per-task, source: "meas-ci:desktop:2026-10-04b"}
      input_run:
        {dist: quantiles, p: [2049, 2364, 2532, 2850, 3230, 6328, 9551, 10167, 11367, 62153], min: 0, max: 194092, means: [1870.685, 2236.17, 2449.671, 2703.725, 3043.957, 3988.081, 8731.309, 9832.528, 10615.573, 13356.447, 166364.952], sampling: per-iteration, source: "meas-ci:interactive:2026-09-18"}
