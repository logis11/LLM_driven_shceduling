    category_source: meas
    pattern:
      constructor: batch-loop      # D21: a run between voluntary blocks, then the block that followed it
      program:
        - loop:                    # until total_work of CPU is spent; tables chosen by the `program` binding
            - RUN: <program>_run
            - SLEEP: <program>_block
        - EXIT: {}
    params:                        # D21, D22, D25: per bound program, pooled over its threads
      clamscan_run:
        {dist: quantiles, p: [81, 979, 7598, 7848, 8148, 8682, 9666, 10541, 14246, 31278], sampling: per-iteration, source: "meas-ci:build:2026-09-18"}
