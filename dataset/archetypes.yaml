      stats: ["play wakes/s 1986.8\u20132114.5", "play cpu-share 0.2164\u20130.2686", "cycle length ms per repeat 10.000\u201310.004", "cycle run ms per repeat 2.1646\u20132.6867"]
      scope: >-
        One observation (phase decision 2; D3, D10, D26): Google Chrome 152.0.7977.82 (42 repeats), Google Chrome 153.0.8010.52 (3: 37, 40, 45), a loopback WebRTC call in one page with a synthetic 1280×720 30 fps camera and microphone (--use-fake-device-for-media-stream); encode and decode at ~20 fps, on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763 64-Core Processor, kernel 6.17.0-1022-azure), the application's process tree pinned to one of its CPUs, which the runner's own agent processes share (D21; method §4), under Xvfb 1280×800 — no display refresh, no GPU, no sound device; perf sched record on CLOCK_MONOTONIC over whole phases. No stimulus. One periodic job per audio-frame cycle (D74, D75): a cycle starts at each wake of the audio worker thread `utility/AudioWorkerThre`, once per 10 ms audio frame; the period is the mean interval between starts, 10.001 ms over 2,159,645 cycles; each job's run is the process tree's whole CPU from one start to the next, drawn per cycle from its measured table, and its deadline is the next cycle's start (period-implicit, liu-jacm73 (A2)). The deadline is the cycle's, not the output device's: an audio server buffers ahead of the device (PulseAudio up to 2 s by default, 9.5 search record S2), so a late cycle is not by itself an audible gap or a dropped frame. In about 5.0 % of cycles the tree's own work exceeds the period — the call's saturation episodes, one CPU busy for about 30 s every 240 s (D54) — so those jobs miss even with the task alone on the CPU. The call's video path — compositing at about 16.7 ms and the 30 fps frames — has no job of its own; its CPU runs inside the audio frames' cycles. Stability rule (D26, D30, D78): every value on the list — a table read by the mean it carries, over every repeat's samples — holds within 5 % or 1 µs over the 45 repeats obtained. Values are this software on this machine, not desktop truth (D10). Venue bound (D24, S8): without display vsync Chromium drives its compositor from a default 60 Hz timer (Chromium docs, life of a frame; BeginFrameArgs::DefaultInterval), so the compositor cadence has a 60 Hz display's period but not its phase; rasterisation and compositing run on CPU threads under --disable-gpu, so those threads' run lengths overcount what a GPU desktop would show, by an amount no source states.
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. The threads' own wakes are not carried one by one: the tree's CPU is summed per medium cycle into one run per job (D75), so the compiled task wakes once per cycle; the per-thread tables stay in the pooled record. Bound by stated approximation, carrying these numbers unchanged (D11, D12): zoom voice and video: a proprietary client with capture, encode, network and playback threads (S2-17; S6: whole-client CPU only). No run observes these programs, so the direction of each binding's error is not measured; each binding is design. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 1 interval read, about 0.1 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — play phase: the tree's CPU share 0.952 (0.934–0.971).

