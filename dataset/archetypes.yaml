      referee: meas-ci
      run: "build:2026-09-18; repeats [4, 5, 7, 8, 9-18]; clamscan [9-18], python3 [11-18]; runs 35328071379, 35328873409, 35337322204, 35426065936, 35430430817, 35434872927, 35439345618, 35443899531, 35448942696, 35453727742, 35459121647, 35464371497, 35469642365"
      stats: ["saturation over the job: clamscan 0.971-0.979, ffmpeg 0.9996, HandBrakeCLI 0.990-0.993, python3 0.9997, tracker 0.941-0.962",
              "share of CPU past the 10 ms boot slice: clamscan 0.109, ffmpeg 0.698, HandBrakeCLI 0.626, python3 0.998, tracker 0.532",
              "share of runs followed by a block: 1.0, 0.0015, 0.0008, 1.0, 0.16",
              "block per run carried with its half-width (D29): clamscan 218.1 us +-9.5 % over 10 repeats (182-274 us), python3 220.0 us +-14.0 % over 8 (170-286 us), tracker 17.6 us +-15.1 % over 14 (13.3-30.4 us)",
              "python3 runs between blocks 1.616 s +-10.0 % over 8 repeats (1.31-1.77 s), 99.97-99.98 % of its job's time (D29)"]
      scope: >-
        One observation (phase decision 2; D3, D7, D30): five programs measured in the same campaign as the build
        archetypes, each pinned to one CPU of a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel
        6.17.0-1022-azure) — ClamAV 1.5.3 scanning the kernel's `Documentation` (9 462 files) with signature
        database daily 28128 held fixed from repeat 9 (D27); ffmpeg and HandBrakeCLI encoding a generated 60 s
        clip; a PyTorch 2.14 CPU training loop of 300 steps over synthetic images — a stand-in, since no source
        states what a desktop training job does (D7): it reads no data and writes no checkpoint, so it stands for
        a CPU-saturating batch task, not for ML training as observed — started warm so its runs and blocks are the
        loop's and not the interpreter's first page-ins (D28); Tracker 3.7.1 indexing a copy of the same corpus,
        read over its job window from the miner's first schedule-in to its own Idle status (D16). A run is the CPU
        from one voluntary block to the next, pooled over the program's threads; the block after a run is the
        program's off-CPU time that followed it, zero when another thread ran on (D22, D25). Four values' spread
        follows the runner's disk rather than the program and is carried with its half-width instead of the 5 %
        tolerance (D29); those blocks are 2.4 % (clamscan), 4 % (tracker) and 0.01 % (python3) of each job's time,
        and no reported result may rest on a difference in them smaller than the stated half-width. Values are this
        software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      The class is what the measurement shows: five programs runnable for the whole of their job on one dominant
      thread (D7, D16). The task is a loop — a run drawn from the bound program's measured runs between voluntary
      blocks, then the block that followed such a run — until `total_work` of CPU is spent; the table set is chosen
      by the `program` binding, never by the task's display name (D21). A zero block means the program ran on, so
      the runs it separates are emitted as one RUN, the same CPU between two blocks. A multi-threaded program is
      one task: runs pooled over its threads, blocks the program's own off-CPU time, so the task alternates the
      threads' long and short runs in one sequence and cannot show a main thread demoted while its workers keep
      their level (D22). `total_work` is scenario design and binds in the timeline (D7). The `chrome` spoof is one
      uninterrupted RUN by construction (D7). The `python3` binding's job is design, a CPU-saturating training
      loop; text naming it says so rather than calling it an observed ML training workload (D32; 9.10 for the
      timeline `c1-ml-train`, 9.12 and 9.15 for prose). The `tracker-miner-fs-3` binding's real processes declare themselves
      background work — every thread exits with policy SCHED_IDLE at nice 19, while clamscan, ffmpeg, HandBrakeCLI
      and python3 run at the default policy, nice 0 — and the task model carries no declared class, so a simulated
      baseline cannot honour it (D17; handed to 9.11). The rescan's tail after its job, 0.34-0.41 s of CPU over
      10-15 s, is the everyday daemon and outside this binding (D16). P1 binds `tracker-miner-fs-3` here
      deliberately, an indexer in full-rescan state, and `c2-p1b` inherits `python3`'s tables through its
      rename-only derivation so the pair stays identical apart from the label; whether it takes the rescan's own
      tables is 9.10's (D21).

