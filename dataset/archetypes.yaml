        {dist: quantiles, p: [816, 1476, 1694, 2083, 2840, 7129, 9946, 11051, 20193, 26031], sampling: per-iteration, source: "meas-ci:interactive:3"}
      stimulus:
        {stream: swell-word-c1, sampling: per-task, source: "swell-icmi14:word-c1"}
      components:
        - comm: "soffice.bin"
          threads: 1
          wakes_per_s: 3.456
          gap: {dist: quantiles, p: [207, 240, 314, 394, 101748, 600677, 600692, 600714, 600750, 600829], sampling: per-iteration, source: "meas-ci:interactive:3"}
          run: {dist: quantiles, p: [15, 17, 18, 25, 76, 314, 340, 353, 377, 407], sampling: per-iteration, source: "meas-ci:interactive:3"}
        # 1 comms cover 100.0 % of 3.5 wakes/s (D16, target 95 %); the rest pooled as `residual`
    lifetime: segment-bound
    binding_params: []
    scalable: []
    validation_stats:
      referee: meas-ci
      run: "interactive:3, repeats [1, 2, 3, 4, 5]"
      stats: ["idle wakes/s 3.4\u20133.5", "idle cpu-share 0.0004\u20130.0006", "driven wakes/s 32.9\u201349.3", "driven cpu-share 0.0064\u20130.0179", "input_run p50 ms per repeat [2.617, 4.459, 3.899, 2.073, 2.145]"]
      scope: >-
        One observation (phase decision 2; D3, D10): LibreOffice Writer 24.2.7.2 (Ubuntu 24.04 apt), a new document, on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure) under Xvfb 1280×800 — no display refresh, no GPU, no sound device; perf sched record on CLOCK_MONOTONIC over whole phases. Stimulus: SWELL-KW stream swell-word-c1 replayed per event by xdotool at recorded gaps (error p99 1.24 ms), keys and pointer events together, pointer positions scaled into the content area (D5, D12); the recordings' timestamps are quantised at 15.6 ms. Per-input run is the window rule (D13): all run time of the process tree until the next input minus the idle rate. Values are this software on this machine, not desktop truth (D10).
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Input wakes: a contiguous slice of swell-word-c1 equal to each focus window, at a seed-drawn offset (D18); the slice preserves the recording's burst-and-pause structure.

