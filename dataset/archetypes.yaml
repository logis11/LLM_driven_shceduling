    lifetime: finite
    binding_params: [total_work, program]
    scalable: []
    validation_stats:
      referee: meas-ci
      run: "background:2026-10-03 (python3, 9.10 D82-D88); repeats [1-6]; runs 37091275421, 37091313419, 37093607991. background:2026-10-03c (kdenlive_render, 9.10 D101-D109); repeats [1-30]; runs 37124818629, 37124854279, 37125022331, 37125789856, 37125847561, 37126020125, 37126535233, 37127200770, 37127738977, 37127913545"
      stats: ["saturation over the job: python3 0.99988-0.99991, kdenlive_render 0.9920-0.9946",
              "python3 CPU total 1,389.885 s +-4.04 % over 6 repeats (1,293.8-1,455.8 s), one process with one thread, shown as `python` (9.10 D85)",
              "python3 runs between blocks 69.49 s +-27.3 % (53.9-114.9 s a repeat) and block per run 311.5 us +-10.8 % (268-370 us), over 6 repeats, carried with their half-widths: 11-24 blocks a repeat, every one but the two sleeps at the start ended by khugepaged (9.10 D87)",
              "python3 under the desktop kernel's transparent-hugepage default, madvise, five jobs beside the campaign: CPU total 1,589.654 s +-2.01 %, x1.144 (95 % interval x1.102-x1.185), no block but the two at the start (9.10 D88)",
              "kdenlive_render CPU total 16.545 s +-0.8 % over 30 repeats (16.055-17.305 s), run between voluntary blocks 1.932 ms +-0.8 %, block per run 4.593 us +-13.1 %, within the 1 us floor (9.10 D105, D109)",
              "kdenlive_render's tree: `kdenlive_render` and the `melt-7` it starts, 4 processes of 14 threads; `melt-7` holds 0.9960-0.9963 of the CPU, its busiest thread 0.682-0.691, the next 0.183-0.192 (9.10 D105)",
              "kdenlive_render: 8,454-8,641 runs a repeat; 26 of 30 jobs end on one 40 ms block, melt's progress sleep (9.10 D109); 47 disk waits over 30 repeats; the same output, 600 H.264 frames at 1920 x 1080 in 966,107 B, in every repeat"]
      scope: >-
        One observation per program (phase decision 2; D3, D7, D30), each in 9.10's own campaign, pinned to one CPU
        of a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure) and instrumented by
        `perf sched record -a` from the harness CPUs and a taskstats listener on the measured CPU's cpumask. `python3`
        (9.10 D12, D82-D88): PyTorch's basic MNIST example at its defaults (`pytorch/examples` at `acc295d`, `python
        main.py --save-model`: 14 epochs of batch 64 over the real MNIST dataset, a test pass after each, the
        checkpoint written), `torch` 2.14.0's CPU build at one intra-op thread under the pin, in a chroot of Ubuntu
        24.04's English default layer built at 2026-09-22T17:00Z, started warm with the dataset local; the files show
        an actual training run and do not claim that desktop users train MNIST, and GPU training is unobservable on
        the runner (9.10 D12). The runner's kernel runs transparent huge pages in `always` mode; the desktop
        kernel's default is `madvise` (9.10 D87, D88). `kdenlive_render` (9.10 D10, D101-D109): Kdenlive 23.08.5 as Ubuntu 24.04 packages it (MLT
        7.22.0, FFmpeg 6.1.1, x264 0.164.3108) exporting the `video-editor` project through its render dialog
        with its shipped default profile, MP4-H264/AAC (x264 `veryfast`, CRF 23, a GOP of 15, AAC at 160 kb/s,
        one processing thread) — 9.5's 20 s 1920 x 1080 30 fps H.264 clip (synthetic content, design) with an
        unsharp effect at PCMark 10's Video Editing parameters, 600 frames, rendered whole. The job is the tree
        of the `kdenlive_render` the dialog starts and the `melt-7` it runs, from its first schedule-in to its
        exit; Kdenlive's window is open on the project, on the measured CPU and outside the job, in a chroot of
        the same default layer built at 2026-09-22T17:00Z with Kdenlive installed by apt, the clip warm, under
        Xvfb with no window manager, no display refresh, no GPU and no sound device. A run is the CPU
        from one voluntary block to the next, pooled over the program's threads; the block after a run is the
        program's off-CPU time that followed it, zero when another thread ran on (D22, D25). `python3`'s two block
        values follow the runner's `khugepaged` rather than the program and are carried with their half-widths
        instead of the 5 % tolerance (D29; 9.10 D87); its blocks are under 0.001 % of its job's time. No reported result may rest on a difference in such a value smaller than its stated half-width.
        Under the desktop kernel's `madvise` default the same run takes x1.144 the CPU (x1.102-x1.185) and blocks
        only at its start (9.10 D88). Values are this
        software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      The class is what the measurement shows: two programs runnable for the whole of their job on one dominant
      thread (D7, D16). The task is a loop — a run drawn from the bound program's measured runs between voluntary
      blocks, then the block that followed such a run — until `total_work` of CPU is spent; the table set is chosen
      by the `program` binding, never by the task's display name (D21). A zero block means the program ran on, so
      the runs it separates are emitted as one RUN, the same CPU between two blocks. A multi-threaded program is
      one task: runs pooled over its threads, blocks the program's own off-CPU time, so the task alternates the
      threads' long and short runs in one sequence and cannot show a main thread demoted while its workers keep
      their level (D22). `total_work` binds in the timeline; a file binding `python3` binds its measured CPU
      total, the whole job (9.10 D17). The `chrome` spoof is one uninterrupted RUN by construction (D7). The
      `python3` binding is PyTorch's basic MNIST example, an actual training run on the CPU (9.10 D12, D85); its
      process shows `python`, the name the venv executes (9.10 D84). Tracker's index, bound here as `tracker` until 9.10, is the entry `file-indexer`, measured as
      a first index of a home (9.10 D70); the rescan this entry carried, read from the miner's first schedule-in to
      its own Idle status (D16), left out the extraction that follows the crawl (9.10 D62). HandBrakeCLI, bound here
      until 9.10 as `handbrakecli` on a generated 720p clip, is the entry `video-transcoder`, measured as CpsMark+'s
      transcode, its threads without a dominant one (9.10 D97). The `kdenlive_render` binding is Kdenlive's export
      of the `video-editor` project, a tree of two programs pooled as one, `melt-7` doing its work, the task shown
      as `kdenlive_render`, the tree's root (9.10 D105, D106); a file binding it binds the measured CPU total, the
      whole export (9.10 D17). It replaces `ffmpeg`, 9.6's encode of a generated 60 s clip, which stood for the
      export until 9.10 and whose tables left with it (9.10 D10, D105). `clamscan`, 9.6's scan of the kernel's
      `Documentation` (`meas-ci:build:2026-09-18`), stood for an unasked scan until 9.10 put the stock unattended
      upgrade, `package-upgrade`, in its place; bound by no file, its tables left (9.10 D3, D45).

