st — a table read by the mean it carries, over every repeat's samples — hold within 5 % or 1 µs over the 24 repeats, the widest `gnome-shell/gnome-shell` run mean ±2.82 %. Wakes traced to a cause outside the observed desktop — a package Ubuntu 24.04's desktop manifest does not hold, a desktop package's unit that a stock install leaves disabled and the runner image enabled, or the harness — left the components and are stated (D27, D37): php8.3-fpm.service (php8.3-fpm) 0–1 a phase. A cron job's session is stated, not carried (D23, D26): the session of the sphinxsearch indexer's cron job at 00:00 UTC — a package of the runner image, not of the desktop install — met the phase in 4 of 24 repeats (47, 48, 49, 51), 318–365 s into it; the 12 rows it held inside two seconds of each cron wakeup (3, 3, 3, 3 per repeat) left the components, which are read without them. Foreign user-space work on the measured CPU 0.00097–0.0022 % of the phase per repeat, under the 2 × 10⁻⁴ bound (D20, D22); per-CPU kernel threads 11,608–15,472 schedule-ins on it per repeat, reported, not gated (D14). Read in 100 s windows over the 24 repeats (D42): the first 100 s past the steady edge is the phase's busiest — `JS Helper` wakes at 1.46 times its phase rate and `gnome-shell`'s run mean is 8.03 ms against 5.10–6.75 ms after — the phase's windows holding 5.7 % of its CPU above its median window. The carried values are the phase's means. Values are this software on this machine, not desktop truth (9.5 D10).
