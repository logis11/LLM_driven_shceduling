runner's clock (UTC); its run is out of the residual. The idle phase's repeat count is the rule's first pass (D88, D94): simulated at the spread of the widest value, `WebExtensions/StreamTrans`' run mean at ±4.75 % over 77 repeats, the rule's stated 95 % interval covers the true mean in about 93–94 % of campaigns and the stopped mean leans by at most 0.2 %. Read in 100 s windows over the 77 repeats (D85, D90, D94): `WebExtensions/WebExtensions`' run mean is 0.252 ms in the idle phase's first 100 s against 0.080–0.111 ms after, 0.2 % of the entry's CPU above its median window; `WebExtensions/StreamTrans` wakes at 0.56–0.58 of its mean rate in the first 200 s, its run mean 0.094 ms in the first 100 s against 1.86–3.91 ms after, 3.1 % of the entry's CPU above its median window; `StreamTrans`'s episodes recur through the phase. The carried values are the phase's means. The send read in 100 s windows over the 8 repeats (D87): from the first window to the last the main thread wakes 17 % less often with runs 27 % longer (1.29 against 1.63 ms), `Socket Thread` wakes 21 % more, `TaskCon~ller` 27 % less with runs 36 % longer and `StreamTrans` 30 % more, while each send's mean duration stays within 2.88–3.19 s and its CPU within 2.19–2.44 s across the 25. The carried values are the means over the 25. Values are this software on this machine, not desktop truth (D10). Build bound (D69): the idle phase pools two builds, Thunderbird 156.0 in 43 repeats and 156.0.1 in the 34 added under D94. Against the 156.0 repeats' own spread, 43 of the 45 idle values agree between them within 0.78 standard deviations; `WebExtensions/IPC I/O Child`'s wake rate and gap mean, 22 wakes a phase in every 156.0 repeat and in 33 of the 34 156.0.1 repeats, differ by 0.1 % (D94).
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Each timer wake is a WAIT on the task's timer channel, woken at its sampled absolute time, with no deadline (D74). Input wakes: a contiguous slice of swell-outlook-c23 equal to each focus window, at a seed-drawn offset (D18); the slice preserves the recording's burst-and-pause structure. Operation `send` (spec decisions 8–10): the timeline names it and a start time; the compiler draws its length from the measured duration table (trigger to completion) and swaps in the operation's components for that span, emitting no input wake; it runs to completion past the focus window. Outlook streams exist only in SWELL-KW's interruption conditions c2 and c3 (D12). Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 48 intervals read, about 2.4 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — idle phase: `IPDL Background` run mean 0.883 (0.824–0.941), `Timer` run mean 0.854 (0.769–0.939), `WebExtensions/IPC I/O Child` run mean 0.875 (0.819–0.930) and wake rate 1.003 (1.003–1.003), `WebExtensions/JS Watchdog` wake rate 1.003 (1.003–1.003), `WebExtensions/Timer` run mean 0.812 (0.656–0.969), `glean.dispatche` run mean 0.791 (0.721–0.861)