  # ---- compute/batch family — interbench loads + kernel-build literature --

  cpu-batch:
    category_source: interbench
    pattern:
      program:
        - RUN: total_work          # run-to-completion, sustained
        - EXIT: {}
    params: {}
    lifetime: finite
    binding_params: [total_work]
    scalable: []
    validation_stats:
      referee: self-consistency
      stats: [sustained full-lane cpu-share while runnable]
      note: interbench Burn is the community's saturation load model; no
        meas-ci referee needed for "burns CPU until done".
    modeling_notes: >-
      interbench Burn (cross-confirmed by ananicy-rules Heavy_CPU) defines
      the class: sustained core saturation. Burn's 4-thread structure is not
      carried — one task saturates the demand it is given; multiplicity is a
      binding-time count (archetype-plan §3). total_work (the job size, hence
      the finite lifetime) is scenario design, so it binds in the timeline,
      not here. Binding note (decided, archetype-plan §5): P1 binds
      tracker-miner-fs-3 to cpu-batch deliberately — it models an indexer in
      full-rescan CPU-saturating state so the P1 pair is behaviorally
      identical; the everyday low-intensity indexer remains
      background-crawler elsewhere (C4/S14). The two bindings of one name
      are intentional, not an inconsistency.

  compiler-child:
    category_source: ocallahan-atc17
    pattern:
      program:
        - RUN: cpu_burst
        - WAIT: disk
        - RUN: cpu_tail
        - EXIT: {}
    params:
      cpu_burst:
        {dist: lognormal, median_us: 12900, sigma_log: 1.91,
         sampling: per-instance, source: "meas-ci:cli:3"}
      cpu_tail:
        {dist: lognormal, median_us: 1440, sigma_log: 1.91,
         sampling: per-instance, source: "meas-ci:cli:3"}
      disk_wait:
        {dist: lognormal, median_us: 3600, sigma_log: 0.8,
         sampling: per-instance, source: "meas-ci:cli:3"}
    lifetime: spawned
    spawned_by: build-orchestrator
    binding_params: []
    scalable: []
    validation_stats:
      referee: meas-ci
      stats: [child lifetime CDF, concurrent-children time series]
      note: headless real-build workflow (make -jN with /proc sidecar);
        lifetime absolutes are machine-relative — recorded with the runner
        spec, convention-informed-by-measurement.
    modeling_notes: >-
      The kernel-build literature grounds the class's existence and
      short-lived character only (ocallahan-atc17 sec-4.3: "make forks and
      execs 2430 processes, mostly short-lived"; coetzee-arxiv12 sec-9
      corroborates, kernel-build-specific). meas-ci:cli:3 (linux-6.6
      defconfig, make -j8, 5 repeats): ~11.9k compiler-family children per
      build, lifetime median ~100 ms sigma_log ~2.37 (forkstat exit
      durations). cpu params are moment-matched: the 500 ms sampler measures
      mean cpu/child ~90 ms directly (still a lower bound — sub-500 ms
      children are partially censored; the 4-core utilization bound is
      ~165 ms); median cpu = (cpu_mean/life_mean) x life_median ~ 14.4 ms;
      sigma_log 1.91 from mean/median = 6.25 — matching the measured mean
      rather than carrying the lifetime log-std (which overshot the mean
      2.4x). The 90/10 burst/tail split is ours. disk_wait: the cold-cache
      rebuild (vm.drop_caches=3) is statistically identical to the warm
      build (cpu and lifetime means within repeat spread) — per-child disk
      waits are noise-bounded at ~4 ms on runner NVMe; median 3.6 ms is that
      measured bound (machine-relative, runner spec recorded). The
      RUN/WAIT/RUN/EXIT shape and the lognormal family (OQ-5 convention)
      are ours. Spawn-table entries sample per-instance
      (interpretation-contract §5).

  build-orchestrator:
    category_source: ocallahan-atc17
    pattern:
      program:
        - loop:                    # consumes the pre-sampled spawn table
            - RUN: dispatch_overhead
            - FORK: {}             # blocks on wait-for-slot at the parallelism cap
        - WAIT: children
        - EXIT: {}
    params:
      dispatch_overhead:
        {dist: lognormal, median_us: 234, sigma_log: 0.5,
         sampling: per-iteration, source: "meas-ci:cli:3"}
    lifetime: finite
    spawns: compiler-child
    binding_params: [spawn_count, parallelism_cap, child_name]
    scalable: []
    validation_stats:
      referee: meas-ci
      stats: [fork rate, concurrent-children time series vs make -jN run]
    modeling_notes: >-
      FORK consumes a pre-sampled ordered spawn table (one fully resolved
      compiler-child program per entry); spawn timing emerges from the
      fork/wait-for-slot loop at run time (interpretation-contract §5).
      spawn_count binds per timeline — the kernel-build default is 2,430
      (ocallahan-atc17 sec-4.3). parallelism_cap defaults to -j8 by stated
      convention (archetype-plan OQ-4: between interbench's documented -j4
      and desktop nproc conventions), overridable at binding time; on one
      lane it shapes fork-storm width and queue depth, not throughput. The
      loop shape and dispatch_overhead field are ours. dispatch_overhead is
      make's own cpu time per spawned child, meas-ci:cli:3 (5-repeat medians
      183-262 us; observed fork rate ~24 children/s at -j8); sigma_log is
      our convention.

  # ---- IO family — interbench loads + ananicy types -----------------------

  io-stream:
    category_source: interbench
    pattern:
      program:
        - loop:                    # per-block streaming until total_work consumed
            - RUN: block_cpu
            - WAIT: io
        - EXIT: {}
    params:
      block_cpu:
        {dist: lognormal, median_us: 3000, sigma_log: 0.6,
         sampling: per-iteration, source: "meas-ci:cli:3"}
      io_wait:
        {dist: lognormal, median_us: 10000, sigma_log: 0.6,
         sampling: per-iteration, source: "meas-ci:cli:3"}
    lifetime: finite
    binding_params: [total_work]
    scalable: []
    validation_stats:
      referee: meas-ci
      stats: [cpu/io duty pattern of tar/xz/rsync runs]
      note: throughput absolutes are machine-relative — runner spec recorded,
        convention-informed-by-measurement, never desktop truth.
    modeling_notes: >-
      interbench man-write/man-read establish the class (RAM-scale
      sequential, cache-defeating streaming) but publish no per-block timing;
      the RUN/WAIT block loop, the lognormal family (OQ-5), and total_work as
      a binding param are ours. The meas-ci:cli:3 tag covers the block pair
      jointly: the 3 ms block granularity and sigmas are our convention; the
      measured quantity is the per-process cpu:wall duty of a stream. The
      cold-cache rsync copy (vm.drop_caches=3 — matching interbench's
      cache-defeating intent) measures 0.231 (spread 0.155-0.267) -> io_wait
      = block_cpu x (1/0.231 - 1) ~ 10 ms; warm-cache rsync runs 0.276 and
      compressing streams ~0.73, noted as the class's upper range.

  background-crawler:
    category_source: ananicy-rules
    pattern:
      program:
        - loop:
            - RUN: scan_burst
            - WAIT: io
            - SLEEP: throttle
    params:
      scan_burst:
        {dist: lognormal, median_us: 1608, sigma_log: 0.639,
         sampling: per-iteration, source: "meas-ci:cli:3"}
      io_wait:
        {dist: lognormal, median_us: 5870, sigma_log: 0.6,
         sampling: per-iteration, source: "meas-ci:cli:3"}
      throttle:
        {dist: lognormal, median_us: 3800000, sigma_log: 0.428,
         sampling: per-iteration, source: "meas-ci:cli:3"}
    lifetime: segment-bound
    binding_params: []
    scalable: []
    validation_stats:
      referee: meas-ci
      stats: [burst/idle duty cycle of updatedb + clamscan runs]
    modeling_notes: >-
      ananicy-rules establishes the class (BG_CPUIO/indexer, ioclass idle —
      deployed practice) but carries no rates. Params from meas-ci:cli:3's
      daemon-mode referee: tracker-miner-fs-3 under dbus-run-session
      indexing a corpus copy for 300 s per repeat (5 repeats, one miner
      process each) — cpu-per-wake median ~1.6 ms sigma_log ~0.64
      (scan_burst), inter-wake gap median ~3.8 s sigma_log ~0.43 (throttle:
      the daemon's observed self-paced wake structure across index + idle).
      io_wait derives from the cold-cache updatedb duty 0.215 (spread
      0.147-0.244): scan_burst x (1/0.215 - 1) ~ 5.9 ms; its sigma is our
      convention. Foreground finding retained: foreground scans never
      throttle (clamscan per-proc duty ~1.0 warm AND ~0.98 cold) — the
      daemon-mode run is the only valid pacing referee. The
      burst/wait/throttle loop shape is ours; the ioclass-idle character is
      expressed through low scheduling priority at binding, not encoded here.
      The daemon-mode (low-intensity, segment-bound) crawler lives here; a
      full-rescan CPU-saturating indexer is deliberately bound to cpu-batch
      in P1 (see cpu-batch modeling_notes).

  # ---- structural-special family — harvested from LAVD --------------------

  game-task-chain:
    category_source: lavd-ossna24
    pattern:
      constructor: chain           # expanded at load time, interpretation-contract §6
      program:                     # per constructed chain member; the
        - loop:                    # wineserver member runs wineserver_run
            - WAIT: upstream
            - RUN: per_schedule_run
            - WAKE: downstream
    params:
      wineserver_run:
        {dist: constant, value_us: 260, sampling: per-instance,
         source: "lavd-ossna24:s13"}
      per_schedule_run:
        {dist: lognormal, anchor_min_us: 260, anchor_max_us: 1650,
         sampling: per-task, source: "lavd-ossna24:s13"}
      frame_period:
        {dist: constant, value_us: 16667, sampling: per-instance,
         source: "steamos-refresh"}
      chain_length:
        {dist: constant, value: 16, sampling: per-instance,
         source: "lavd-ossna24:s12"}
    lifetime: segment-bound
    binding_params: [lane_share]
    scalable:
      - fields: [chain aggregate demand]
        rule: scale the chain's aggregate demand per frame to lane_share of
          the lane (building-plan §5a).
    validation_stats:
      referee: none
      reason: validation against LAVD would be circular — LAVD is also the
        parameter source (stated as such, building-plan §7) — and a CI
        runner cannot observe a Proton game's Wine, DXVK or audio structure
        (no GPU; Proton runs only under the Steam client), so no own
        measurement referees it.
    modeling_notes: >-
      Source: lavd-ossna24 slides 12-17 taken as one observation of an
      unnamed game on an unnamed machine, collected with perf sched record;
      the deck's figures draw on at least three process trees and the text
      does not say which feeds slides 12-14 (recorded decision). frame_period
      is not in the deck: the game is modelled as display-paced at the Steam
      Deck LCD default refresh with the 1:1 frame limit (steamos-refresh:
      60 Hz; 16667 us is 1/60 s arithmetic) — design, ours.
      The only entry whose topology is a parameter: the compiler's chain
      constructor expands it into chain_length ordinary tasks with WAIT/WAKE
      channels wired from the head to the last member, standing in for the
      source's "from a user input to display update" (s17); no intermediate
      stage is named by the source. The linearization of the s16-s17
      waker-waiter graph into one chain, and every field name, are ours:
      the source's graphs are a fan-in (four task workers -> dxvk-cs), a
      two-step chain (dxvk-cs -> dxvk-submit), 2-cycles among the audio
      threads and a hub around wineserver (s11, s16), and s17 says the
      majority of game tasks are individually periodic, whereas here only
      the head is timer-driven. per_schedule_run: the anchors are the source's two named
      per-schedule runtimes, a coordination task (wineserver, 260 us) and a
      work task (a task worker, 1.65 ms), spanning its stated "a few 100s
      usec on average to a few msec maximum" (s13); the statistic behind the
      two examples is not labelled on the slide, and the slide's plot of
      per-task runtime averages (one game, ~128 tasks, median ~0.04 ms) is a
      different population from the chain's most-scheduled tasks and is not
      used. Reading the anchors as a p05/p95 span, the lognormal family
      (OQ-5 convention; the compiler derives median/sigma from the span) and
      the one draw per member are ours; the per-member draw rests on the
      source's "Task execution time is very stable and is predictable using
      its average" (s13). Sampled scheduler logs of four other games under
      scx_lavd show game threads at tens of us per schedule (different
      accounting; not a source here). chain_length 16 is a point chosen inside the
      source's "15-20 game-specific tasks" (s12) — design within a source
      range; the wineserver member is outside that count (the source files
      wine among the system tasks). The entry models the chain only: the source
      counts ~300 tasks scheduled system-wide while a game runs (s12,
      including system tasks) and says nothing about what the tasks outside
      its top 30-40 do, so no tail population is constructed here; how many
      further game threads a timeline carries, and bound to what, is the
      timeline's. Two source facts the encoding does not model: "Around 90%
      are long-living tasks; only 10% of tasks are terminated" (s12, window
      unstated) — every member here lives for the whole segment; "70-75% of
      scheduling is initiated by waiting system calls" against 25-30%
      preemption (s14) — the wake mix here is fixed by the wiring (one
      TIMER head, WAIT members), not sampled. Lane-scaling: the concentration statistics (top 30-40
      tasks = 95% of scheduling; 15-20 game-specific tasks take 60-70%, s12)
      are scheduling-frequency shares; scaling the chain's RUN values so its
      per-frame demand equals lane_share is our calibration, not the
      source's. Wineserver is a member of the constructed chain, named
      `wineserver`, placed right after the head with RUN = wineserver_run:
      the source names it as a coordination task at 260 us per schedule
      (s13), draws it as the hub of the game's dispatcher threads (s11), and
      gives its edges to and from the game process the largest counts in the
      s16 graph (epoll from wineserver to the game, pipe_read from the game
      to wineserver). Those edges are a request/reply round trip (each Wine
      call is a request write and a blocking reply read); a linear relay
      cannot return to a node, so the relay passes the wake on to the next
      member instead — the same linearization applied to the whole graph,
      ours. Its RUN scales with the chain in -single mode (design). The
      earlier wineserver -> system-daemon timeline binding is withdrawn.

  # ---- meas family — no literature taxonomy exists ------------------------

  network-bulk:
    category_source: meas
    pattern:
      program:
        - loop:                    # per-chunk download until total_work consumed
            - WAIT: net
            - RUN: chunk_cpu
        - EXIT: {}
    params:
      chunk_cpu:
        {dist: lognormal, median_us: 1000, sigma_log: 0.5,
         sampling: per-iteration, source: "meas-ci:cli:3"}
      net_wait:
        {dist: lognormal, median_us: 16700, sigma_log: 0.5,
         sampling: per-iteration, source: "meas-ci:cli:3"}
    lifetime: finite
    binding_params: [total_work]
    scalable: []
    validation_stats:
      referee: meas-ci
      stats: [cpu/net duty pattern of a saturating download]
      note: throughput absolutes are machine-relative — runner spec recorded.
    modeling_notes: >-
      No literature taxonomy names this class; category_source is honestly
      meas (behavior class observed in our measurements). Link-saturating,
      moderate-CPU shape per building-plan §2.1. The meas-ci:cli:3 tag
      covers the chunk pair jointly: the 1 ms chunk granularity and sigmas
      are our convention; the measured quantity is wget's cpu:wall duty
      saturating the runner link (kernel tarball, ~0.057, wide spread
      0.013-0.1 and only 2 of 5 repeats' downloads ran long enough to
      sample — stated) -> net_wait = chunk_cpu x (1/0.057 - 1) ~ 16.7 ms.
      Structural claim only — the runner link is datacenter-class; the duty
      ratio, not the throughput, is the grounded quantity. The chunk loop
      shape is ours.

  electron-comms:
    category_source: meas
    pattern:
      program:
        - loop:
            - TIMER: heartbeat
            - RUN: heartbeat_work
    params:
      heartbeat:
        {dist: lognormal, median_us: 1850000, sigma_log: 1.09,
         sampling: per-task, source: "meas-ci:gui:2"}
      heartbeat_work:
        {dist: lognormal, median_us: 289, sigma_log: 0.713,
         sampling: per-iteration, source: "meas-ci:gui:2"}
    lifetime: segment-bound
    binding_params: []
    scalable: []
    validation_stats:
      referee: meas-ci
      stats: [heartbeat period CDF, renderer-children count under Xvfb]
      note: the same Xvfb workflow referees OQ-3 — chromium-renderer vs
        Electron-app CDF comparison decides whether this entry splits.
    modeling_notes: >-
      Mostly idle plus periodic short wakes; the TIMER/RUN encoding and all
      field names are ours. Params from meas-ci:gui:2: Element Desktop
      idling unauthenticated under Xvfb (stated substitute for account-gated
      comms apps; idle lacks message-traffic wakes — stated limitation), 15
      processes across 5 repeats — voluntary-wakeup gap median ~1.85 s
      sigma_log ~1.09, cpu-per-wake median ~289 us. The TIMER encoding
      approximates the observed aperiodic-ish wake stream as periodic —
      stated simplification. OQ-3 referee result (same run): idle chromium
      renderers wake at median ~1.61 s sigma_log ~1.72 — close in median,
      heavier-tailed; no archetype split warranted, chromium renderers keep
      binding to this entry. Chromium at 10 file tabs peaked at 21-22
      processes (binding guidance for renderer counts). Renderer-children
      multiplicity is a static binding-time count (archetype-plan §3),
      expressed through the timeline task entry's count field: values bind
      against the Chromium process model from the tab-count literature
      (dubroy-chi10, mozilla-testpilot10, chang-chi21) plus meas-ci Xvfb
      counts — order-of-magnitude fidelity suffices for recognition;
      precision matters only for executor load.

  system-daemon:
    category_source: meas
    pattern:
      program:
        - loop:
            - SLEEP: idle_gap
            - RUN: wake_burst
    params:
      idle_gap:
        {dist: lognormal, median_us: 11240000, sigma_log: 1.9,
         sampling: per-iteration, source: "meas-ci:gui:2"}
