d together with their half-widths under 9.5 D57 as 9.8 D21 extended it (its timer part, the timer wakes by origin's decision 16, the class taken after its values were seen failing, 9.8 D28): wake rate 0.0060 wakes/s ±8.1 % (0.0044–0.0089 wakes/s); gap mean 165.5 s ±8.1 % (112.5–225.0 s); run mean 0.034 ms ±3.2 % (0.029–0.040 ms). Within one run (the long-phase probes 36, 41 and 44, a window of the phase every 60 s) they move by ±15.4–15.9 %, ±18.2–26.9 % and ±5.2–8.2 % of their mean, against ±36.8 %, ±32.9 % and ±16.2 % across the repeats (half the range over the mean): the spread lies in part within a run. It wakes 8–16 times a phase and holds 64.9 % of the entry's wakes once the wakes owed to outside causes are out (D27). In the 4 repeats that crossed midnight UTC and met the cron session (47, 48, 49 and 51) `wireplumber/gmain` woke 0.0082 times a second against 0.0056 in the other 20: the extra wakes are pairs of the worker's own timer 100 ms apart, 496–1205 s into the phase, 14 of the 15 pairs starting within 0.2 s of one of the runner's `dockerd` bursts, three every 10 s; the trace names no waker for them (a timer or interrupt on an idle CPU), so D27's rules keep them (D38). Wakes traced to a cause outside the observed desktop — a package Ubuntu 24.04's desktop manifest does not hold, a desktop package's unit that a stock install leaves disabled and the runner image enabled, or the harness — left the components and are stated (D27, D37): hosted-compute-agent.service (the harness) 355–362 a phase; job phpsessionclean (php-common) 2–4 a phase; job podman (podman) 0–2 a phase. Desktop jobs bound to a clock time are events of the phase, stated and not carried (D27, D47, in D23's form): job anacron (anacron) 32 over the 24 repeats; job sysstat-daily-sample (sysstat) 8 over the 24 repeats; job sysstat-summary (sysstat) 6 over the 24 repeats; job motd-news (base-files) 4 over the 24 repeats; job fstrim (util-linux) 1 over the 24 repeats. Kept, their cause not resolved by the trace: job launched by pid 1: (install) 9 install systemd 2 over the 24 repeats. A cron job's session is stated, not carried (D23, D26): the session of the sphinxsearch indexer's cron job at 00:00 UTC — a package of the runner image, not of the desktop install — met the phase in 4 of 24 repeats (47, 48, 49, 51), 318–364 s into it; the 37 rows it held inside two seconds of each cron wakeup (8, 10, 9, 10 per repeat) left the components, which are read without them. Foreign user-space work on the measured CPU 0.00097–0.0022 % of the phase per repeat, under the 2 × 10⁻⁴ bound (D20, D22); per-CPU kernel threads 11,608–15,472 schedule-ins on it per repeat, reported, not gated (D14). Read in 100 s windows over the 24 repeats (D42, D47): `wireplumber/gmain` wakes at 3.13 times its phase rate in the first 100 s past the steady edge — 56 of its 402 kept wakes fall in the phase's first 22 s, a pair 0.1 s apart within the first 4 s, one wake 12–22 s in, or both — beside sysstat's collector every 10 minutes (D47) and the midnight repeats' pairs (D38). The carried values are the phase's means. Values are this software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      Per-program archetype (D2, D5), bound by identity to the timelines' `pipewire` task, which stands for the three services (D4): one task carries the program's processes, each instance's threads its own components (D4, D6, D7; 9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9). No focus_components and no stimulus: nobody is present (D9). Present in every repeat and never woken in the phase: `pipewire`, `pipewire-pulse`; the entry carries no wake of them. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 2 intervals read, about 0.1 differences by chance alone, none found.

