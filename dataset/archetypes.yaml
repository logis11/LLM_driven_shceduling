      scope: >-
        One observation (phase decision 2; D8): GNOME Shell 46.0-0ubuntu6~24.04.14 with Mutter 46.2-1ubuntu0.24.04.16 (libmutter-14-0, D45) — Mutter and the shell in one process (D3), in an Ubuntu 24.04 desktop session — ubuntu-desktop-minimal from the runner's own archive, a dedicated user logged in by GDM's automatic login after a 300 s priming login and a logout (D16) — in its terminal idle state: nobody present past idle-delay, the shield up and locked, the monitor blanked by the power daemon, each checked at the steady edge 420 s after the measured login (D9, D13, D18); a 1800 s steady phase (D22); on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763, kernel 6.17.0-1022-azure), the four entries' processes confined to one CPU and every other process of the session, the system and the harness kept on the others, the placement read from the processes after the pin and at the steady edge (D10, D21), perf sched record on every CPU; 24 same-machine repeats, every landing pooled. Not covered: drawing. The monitor is off, and Mutter's frame clock is inhibited while the output is off (S2-12); no source states a compositor's per-frame CPU cost on a GPU desktop (9.5 D24). Nor a session in use — an application open, the screen on, a notification — nor the session's start-up (D9). Limits of the observation (method §7): GNOME Shell started with --headless --virtual-monitor 1920x1080@60 by a unit drop-in, on a seat with no display device and no vblank; no sound device, WirePlumber's null sink; the cpuset controller delegated to the user manager by a drop-in on user@.service (D14); the four entries' units in a slice of their own and the other slices defaulted to the other CPUs (D17), the system bus restarted into that slice before any login (D21); the pinned units' other processes moved into a scope of their own (D15); per-CPU kernel threads sharing the measured CPU; a server VM with its own agents, off the measured CPU. Stability rule (9.5 D78): all 9 values on the list — a table read by the mean it carries, over every repeat's samples — hold within 5 % or 1 µs over the 24 repeats, the widest `gnome-shell/gnome-shell` run mean ±2.82 %. Wakes traced to a cause outside the observed desktop — a package Ubuntu 24.04's desktop manifest does not hold, a desktop package's unit that a stock install leaves disabled and the runner image enabled, or the harness — left the components and are stated (D27, D37): php8.3-fpm.service (php8.3-fpm) 0–1 a phase. A cron job's session is stated, not carried (D23, D26): the session of the sphinxsearch indexer's cron job at 00:00 UTC — a package of the runner image, not of the desktop install — met the phase in 4 of 24 repeats (47, 48, 49, 51), 318–365 s into it; the 12 rows it held inside two seconds of each cron wakeup (3, 3, 3, 3 per repeat) left the components, which are read without them. Foreign user-space work on the measured CPU 0.00097–0.0022 % of the phase per repeat, under the 2 × 10⁻⁴ bound (D20, D22); per-CPU kernel threads 11,608–15,472 schedule-ins on it per repeat, reported, not gated (D14). Read in 100 s windows over the 24 repeats (D42): the first 100 s past the steady edge is the phase's busiest — `JS Helper` wakes at 1.46 times its phase rate and `gnome-shell`'s run mean is 8.03 ms against 5.10–6.75 ms after — the phase's windows holding 5.7 % of its CPU above its median window. The carried values are the phase's means. Values are this software on this machine, not desktop truth (9.5 D10).
    modeling_notes: >-
      Per-program archetype (D2, D5), bound by identity to the timelines' `gnome-shell` task: one task carries the program's processes, each instance's threads its own components (D4, D6, D7; 9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9). No focus_components and no stimulus: nobody is present (D9). Sporadic wakes, not carried as components (9.5 D43): `gnome-shell/gnome-s:disk$0` in 4 of 24 repeats (47, 48, 49, 51, the repeats that met the cron session), 0.0002 wakes/s over the pool. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 6 intervals read, about 0.3 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — steady phase: `gnome-shell/JS Helper` run mean 0.864 (0.841–0.886).

