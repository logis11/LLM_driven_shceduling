      Per-program archetype (D2, D5), bound by identity to the timelines' `dbus-daemon` task, which stands for both buses (D6): one task carries the program's processes, each instance's threads its own components (D4, D6, D7; 9.5 D16), each sampled from its measured gap and run quantiles (9.5 D17) over the task's lifetime and merged into one explicit event stream at compile time (9.5 D9). No focus_components and no stimulus: nobody is present (D9). `session-bus` woke only in repeats 47, 48, 49, 51 (111 wakes), every one of them taken out of the component by the cron session's window (D23) or by its cause (D27); the entry carries none.

