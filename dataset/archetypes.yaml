      scope: >-
        One observation (phase decision 2; D3, D10, D26): Visual Studio Code 1.138.0 (44 repeats) (vendor .deb), the TypeScript project sindresorhus/got at commit 64f21e2a (tag v16.0.0, dependencies installed; design) open on source/index.ts with the built-in TypeScript language server running, on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763 64-Core Processor, kernel 6.17.0-1022-azure), the application's process tree pinned to one of its CPUs, which the runner's own agent processes share (D21; method §4), under Xvfb 1280×800 — no display refresh, no GPU, no sound device; perf sched record on CLOCK_MONOTONIC over whole phases. Stimulus: SWELL-KW stream swell-word-c1, its keystrokes replayed by xdotool at their recorded times (error p99 1.24 ms) and its clicks, scrolls and drags left out, so the typing stays at the file's end, the file otherwise as committed (D72; the archetype carries typing, not the editor's navigation); the keys are a fixed letter cycle (D4: timing only), so the per-key cost is the language server re-checking a file being filled with letter runs; the recordings' timestamps are quantised at 15.6 ms. Per-input run is the window rule (D13): all run time of the process tree until the next input minus the idle rate, so work that is not the idle rate inside a long gap (an autosave after typing) is charged to the input before it. The idle phase is read from 200 s past its start, past the launch work in it (D83); the idle rate is read over the same span. Stimulus sensitivity (pre-registered, method §3): under a 136M Keystrokes transcription stream (dhakal-chi18) the per-input run p50 is 82.29 ms against 79.71 ms under SWELL-KW (+3 %); read per repeat (D81), the per-input run mean under 136M is 1.029 of SWELL-KW's (95 % interval 0.968–1.090 over 43 repeats), not resolved; the archetype carries SWELL-KW. Stability rule (D26, D30, D78): every value on the list — a table read by the mean it carries, over every repeat's samples — holds within 5 % or 1 µs over the 44 repeats obtained, except these, stated with their half-widths. A component whose rate varies between sessions, its three values carried together (D57): `utility/libuv-worker` wake rate 5.382 wakes/s ±5.63 % (3.133–7.327 wakes/s), gap mean 185.8 ms ±5.63 % (136.5–319.2 ms), run mean 0.0102 ms ±2.36 % (0.009–0.0122 ms); within one run its wake rate ±10.6 % (5.41–6.71 a second over 700 s windows slid along the D52 probe from 200 s), across the repeats its wake rate ±39.0 %; it holds 4.8 % of the idle phase's wakes. The repeat count is not the rule's (D99): the campaign stopped at window 44, then read as the Word recording's last; the recording holds 57 windows, 56 with input. At 44 every value the rule is read on holds, the widest the per-input run mean under SWELL-KW at ±4.84 % (±5.17 % as the rule was read when the campaign stopped, D73). Values are this software on this machine, not desktop truth (D10). Build bound (D69): the campaign is pinned to the build named above, which ships no assistant runtime. VS Code 1.139.0, released during the campaign, runs a copilot-runtime process that woke 49.7 times a second in the idle phase against the 115 a second of this build's whole tree — a different workload, and whether a code editor should describe an assistant-bearing one is the archetype's own question, not this campaign's. Venue bound (D24, S8): without display vsync Chromium drives its compositor from a default 60 Hz timer (Chromium docs, life of a frame; BeginFrameArgs::DefaultInterval), so the compositor cadence has a 60 Hz display's period but not its phase; rasterisation and compositing run on CPU threads under --disable-gpu, so those threads' run lengths overcount what a GPU desktop would show, by an amount no source states.
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Each timer wake is a WAIT on the task's timer channel, woken at its sampled absolute time, with no deadline (D74). Input wakes: a contiguous slice of swell-word-c1 equal to each focus window, at a seed-drawn offset (D18); the slice preserves the recording's burst-and-pause structure. Word streams drive this editor as the nearest recording: no code-editing keystroke dataset with timestamps exists (D4). Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 19 intervals read, about 1.0 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — idle phase: `gpu/Chrome_ChildIOT` run mean 0.884 (0.836–0.932), `renderer/Compositor` run mean 0.948 (0.925–0.970), `utility/libuv-worker` run mean 0.716 (0.639–0.792). The second idle run, 915–1815 s after the first began, differs from the first whichever is traced — the main thread wakes about 7 % less and its runs are about 40 % shorter, the residual's about 70 % shorter — which keeps those ratios from resolving; the first run holds VS Code's launch work, which the carried idle values leave out (D83). Read from 200 s into each run as the carried values are, the first run agrees with the carried pool, every value within 2.1 standard deviations of its spread, and the second differs in the residual's run mean alone, about 35 % longer (0.060–0.066 against 0.046 ms).

