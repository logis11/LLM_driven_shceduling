      scope: >-
        One observation (phase decision 2; D3, D10, D26): Google Chrome 152.0.7977.82 (29 repeats), Google Chrome 153.0.8010.52 (9: 18, 20, 22, 27, 31, 33, 34, 37, 38) (preinstalled), a local page with a text area and 400 paragraphs; the whole process tree, its renderers included — the typed-into page's, the spare renderer the page load takes over and Chrome's own WebUI renderer (D84); other tabs' renderers are renderer-hidden's; operation page-load: the scripted feed page feed.html (300 posts, thirty 1600×1200 pictures, a 200 000-record sort; design after PCMark 10 pp. 52–53 and CpsMark+ §4.3.3) from a local server, completion by the page's title after first paint, on a GitHub-hosted ubuntu-24.04 runner (4 vCPU AMD EPYC 7763 64-Core Processor, kernel 6.17.0-1022-azure), the application's process tree pinned to one of its CPUs, which the runner's own agent processes share (D21; method §4), under Xvfb 1280×800 — no display refresh, no GPU, no sound device; perf sched record on CLOCK_MONOTONIC over whole phases. Stimulus: SWELL-KW stream swell-ie-c1, its keystrokes replayed by xdotool at their recorded times (error p99 1.24 ms) and its clicks, scrolls and drags left out, so every key lands in the page's text box (D65; the archetype carries typing into a page field, not browsing's scrolling and clicking — the page-load operation carries browsing's heavy work); the recordings' timestamps are quantised at 15.6 ms. Per-input run is the window rule (D13): all run time of the process tree until the next input minus the idle rate, so work that is not the idle rate inside a long gap (an autosave after typing) is charged to the input before it. Stimulus sensitivity (pre-registered, method §3): under a 136M Keystrokes transcription stream (dhakal-chi18) the per-input run p50 is 5.13 ms against 4.07 ms under SWELL-KW (+26 %); read per repeat (D81), the per-input run mean under 136M is 1.338 of SWELL-KW's (95 % interval 1.284–1.392 over 38 repeats), a difference; the archetype carries SWELL-KW. Stability rule (D26, D30, D78): every value on the list — a table read by the mean it carries, over every repeat's samples — holds within 5 % or 1 µs over the 38 repeats obtained, except these, stated with their half-widths. Window limit (D32, D68): the per-input means and the page-load operation's values come from the repeats that replay a window of the recording, 38 repeats, every window of it that holds input; outside the rule: the per-input run mean under SWELL-KW 4.274 ms ±5.90 % (the rule needs 52 repeats); the other 38 hold within it, the widest ±3.37 %. The `MemoryInfra` heavy event (D64) is carried beside the rule, not on it: 8 runs over 22800 s of idle phase, 30 of the 38 repeats holding none, so no half-width is read for its rate. The page load read one by one over the 38 repeats (D87): the first page load of each repeat takes 739 ms and 545 ms of CPU against a mean of 485 ms and 341 ms over the other 55 (446–570 ms and 292–413 ms by position in the pass), the network service's foreground pool (`utility/ThreadPoolForeg`, in the residual) waking 606 times in it against 41 and the renderer's main thread 101 times, its runs 2.45 ms, against 38 times at 5.03 ms — one page load in 56, 2.8 % of the operation's CPU and 4.3 % of its wakes; past the first six, each block of six page loads holds the operation's wake rate within 2 % and its CPU at 334–356 ms a page load. The carried values are the means over the 56. Values are this software on this machine, not desktop truth (D10). Build bound (D69): the 38 repeats pool two builds, Google's repository serving only its current version. Against the 152 repeats' own spread, 59 of the 60 carried values agree between the builds within 1.80 standard deviations; the page load's `gpu/VizCompositorTh` run mean does not: 0.382 ms under 153 against 0.455 ms under 152 (−16.0 %, −2.31 standard deviations, 8 of the 9 repeats below every 152 repeat). The carried 0.438 ms pools both, the 152 repeats' mean 4.0 % above it (D93). Venue bound (D24, S8): without display vsync Chromium drives its compositor from a default 60 Hz timer (Chromium docs, life of a frame; BeginFrameArgs::DefaultInterval), so the compositor cadence has a 60 Hz display's period but not its phase; rasterisation and compositing run on CPU threads under --disable-gpu, so those threads' run lengths overcount what a GPU desktop would show, by an amount no source states.
    modeling_notes: >-
      Per-application archetype (D2): one task carries the whole process tree merged (D14), its renderers included — other tabs' renderers are renderer-hidden's, bound separately (D84). A component is its process's role and the thread comm together (D67), so one comm naming a thread of several processes — chrome's Chrome_ChildIOT runs in the GPU process and in each utility process — is several components; a single-process tree's components carry the comm alone. Timer components are per thread comm (D16), each sampled from its measured gap and run quantiles (D17) over the task's lifetime and merged, with the input wakes, into one explicit event stream at compile time (D9); the pooled residual stands for the comms below the coverage cut. Each timer wake is a WAIT on the task's timer channel, woken at its sampled absolute time, with no deadline (D74). Input wakes: a contiguous slice of swell-ie-c1 equal to each focus window, at a seed-drawn offset (D18); the slice preserves the recording's burst-and-pause structure. Operation `page-load` (spec decisions 8–10): the timeline names it and a start time; the compiler draws its length from the measured duration table (trigger to completion) and swaps in the operation's components for that span, emitting no input wake; it runs to completion past the focus window. Untraced control (the 9.5 untraced-control spec): six jobs each ran every carried phase twice, traced under `perf sched record` and untraced, read by the 95 % interval of the per-job ratios, untraced over traced; 40 intervals read, about 2.0 differences by chance alone. Perf's effect on the carried values, which stay the traced ones — idle phase: `gpu/Chrome_ChildIOT` run mean 0.863 (0.850–0.877), `gpu/VizCompositorTh` run mean 0.954 (0.929–0.978) and wake rate 0.977 (0.960–0.993), `renderer/Compositor` run mean 0.928 (0.917–0.938); operation phase, over the whole phase: `Chrome_IOThread` run mean 0.861 (0.818–0.903) and wake rate 1.037 (1.014–1.060), `chrome` run mean 0.963 (0.933–0.993), `gpu/Chrome_ChildIOT` run mean 0.889 (0.859–0.920), `renderer/Chrome_ChildIOT` run mean 0.856 (0.843–0.870), `renderer/Compositor` run mean 0.942 (0.902–0.982). The operation phase's second page-load pass wakes the network service's foreground pool (`utility/ThreadPoolForeg`, in the residual since D84) about 40 % less than the first, which keeps the residual's ratios from resolving. The difference sits in each pass's opening burst: the pool wakes 417–556 times in the first pass's first page load and 149–162 times in the second pass's second, and from the fourth page load on at 18.6 and 17.7 a second (D87).

