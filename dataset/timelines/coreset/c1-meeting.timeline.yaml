# C1 — single-situation calibration: pure meeting (building-plan §3 C1; Phase 7
# spec decision 8). The one novel C1 design: no other coreset segment carries a
# call's own task set (c6-fold's meeting segment is the browser unchanged).
# One call, one task: video-call is the whole measured call, its audio and
# video threads together, its periodic job the 10 ms audio frame.
meta:
  id: c1-meeting
  seed: 111
  demand: calibration

segments:
  - {from: 0s, to: 60s, mode: meeting, attributes: {background_wanted: true},
     scenario: [S3]}

tasks:
  - {id: voice, name: chrome, archetype: video-call,
     arrive: 0s, depart: 60s}

focus: []
