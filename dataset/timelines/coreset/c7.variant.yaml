# C7 — attribute counterparts (building-plan §3 C7; Phase 7 spec decisions 4–7,
# 10). One counterpart per mode, derived from its C1 base, so every driver-table
# cell has a one-diff pair: the base is the `true` cell, the counterpart the
# `false` cell of the same mode (indexing the other way round — c1-indexing is
# the user-initiated `true` cell).
#
# Interactive modes (9.10 D3, D36–D44): one injected unwanted job — the stock
# Ubuntu 24.04 unattended upgrade's install stage, `package-upgrade`
# (meas-ci:background:2026-10-01), shown as `unattended-upgr` — the same name in
# every file so the ten `false` cells differ only in mode; tier 1, so no pair
# changes familiarity tier (D43). It arrives at 0 s bound whole, total_work its
# measured CPU total C = 26.385 s (D17), and each counterpart is its base's
# first C seconds (D41): one segment, every base task departing at C, so on one
# lane the job is alive at every instant of the segment under every policy.
# Focus windows keep the base's 2 s margins, 2 s to C − 2 s, and an operation
# sits at its fraction of the window as in the base (D44): page load, unsharp
# mask and preview render at the middle (the base's 30 s in 2–58 s), the mail
# send at 38/56 of it (the base's 40 s).
#
# Batch modes: the batch job is itself the background work the attribute judges
# (recognition-vocabulary §1), so the counterpart is the same job unwanted — the
# P1b move, rename and label flip, mode unchanged. compile: make -> dkms, the
# kernel-module rebuild the distro runs on a kernel change (dkms-man,
# dkms-debian; names workflow meas-ci:names:2 observed comm `dkms` at runtime
# level on all three distros, Fedora shipping a kernel-install hook and a
# dkms.service unit — dataset/meas/names/run-2/). ml-train, render, transcode, backup: no same-mode orchestrator a
# distro or vendor runs unasked under a distinct name exists (transcode: Jellyfin
# installs its transcoder as plain `ffmpeg`), so the label flips alone and the
# file ships as a pre-committed miss.
#
# Every counterpart declares demand: calibration in its own recipe (Phase 7 spec
# decision 7); the regime is read from the manifest.
variants:
  - id: c7-browsing
    from: c1-browsing.timeline.yaml
    ops:
      - add-task: {id: upgrade, name: unattended-upgr, archetype: package-upgrade,
                   arrive: 0s, bind: {total_work: 26.385s}}
      - set-segments: [{from: 0s, to: 26.385s, mode: browsing,
                         attributes: {background_wanted: false, background: package-upgrade},
                         scenario: [S2, S17]}]
      - patch-task: {id: browser, depart: 26.385s}
      - patch-task: {id: renderers, depart: 26.385s}
      - set-focus: [{from: 2s, to: 24.385s, task: browser}]
      - set-operations: [{at: 13.1925s, task: browser, name: page-load}]
      - patch-meta: {demand: calibration}

