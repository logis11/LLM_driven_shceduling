# C7 — attribute counterparts (building-plan §3 C7; Phase 7 spec decisions 4–7,
# 10). One counterpart per mode, derived from its C1 base, so every driver-table
# cell has a one-diff pair: the base is the `true` cell, the counterpart the
# `false` cell of the same mode (indexing the other way round — c1-indexing is
# the user-initiated `true` cell).
#
# Interactive modes (9.10 D3, D36–D44): one injected unwanted job — the stock
# Ubuntu 24.04 unattended upgrade's install stage, `package-upgrade`
# (meas-ci:background:2026-10-01), shown as `unattended-upgr` — the same name in
# every file so the ten `false` cells differ only in mode; tier 1, so no pair
# changes familiarity tier (D43). It arrives at 0 s bound whole, total_work its
# measured CPU total C = 26.385 s (D17), and each counterpart is its base's
# first C seconds (D41): one segment, every base task departing at C, so on one
# lane the job is alive at every instant of the segment under every policy.
# Focus windows keep the base's 2 s margins, 2 s to C − 2 s, and an operation
# sits at its fraction of the window as in the base (D44): page load, unsharp
# mask and preview render at the middle (the base's 30 s in 2–58 s), the mail
# send at 38/56 of it (the base's 40 s).
#
# Compile (9.10 D4, D46–D57): the user's build is replaced by an observed DKMS
# autoinstall — NVIDIA's 595 open module rebuilt for 2026-09-23's security
# kernel by the stock unattended upgrade (meas-ci:background:2026-10-02), task
# `dkms` on module-build-orchestrator, the segment at tier 3 as its base's (D55).
# Indexing (9.10 D5, D60–D79): the same job as the base, Tracker's first index of a
# home from an empty database, `file-indexer` (meas-ci:background:2026-10-02b) shown
# as `tracker-miner-f`, now at a first login (`initiated: session`, D79). As
# c7-compile, c7-indexing is its base's first C seconds (D78): the index from 0 s
# bound whole, the editor departing at C, focus 2 s to C − 2 s; C = 39.435 s, the
# index's CPU total, so it is alive at every instant of the segment.
#
# As the indexing counterpart, c7-ml-train is its base's first C seconds (D78's
# form): the training run from 0 s bound whole, the editor departing at C, focus
# 2 s to C − 2 s; C = 1,389.885 s, the run's CPU total (meas-ci:background:2026-10-03),
# so it is alive at every instant of the segment. The label still flips alone on the
# same job and name, a pre-committed miss.
#
# c7-transcode likewise (D78's form): the encode, `video-transcoder` shown as
# `HandBrakeCLI`, from 0 s bound whole, the editor departing at C, focus 2 s to
# C − 2 s, the preview render at the window's middle (D44, D96); C = 2,970.871 s,
# the encode's CPU total (meas-ci:background:2026-10-03b). A pre-committed miss.
#
# c7-render likewise (D78's form): Kdenlive's export, `cpu-batch`'s
# `kdenlive_render`, from 0 s bound whole, the editor departing at C, focus 2 s
# to C − 2 s, the preview render at the window's middle (D44, D96), cut at the
# editor's departure; C = 16.545 s, the export's CPU total
# (meas-ci:background:2026-10-03c). A pre-committed miss.
#
# c7-backup likewise (D78's form): Déjà Dup's scheduled weekly incremental,
# `incremental-backup` shown as `deja-dup`, from 0 s bound whole, the editor
# departing at C, focus 2 s to C − 2 s, the preview render at the window's middle
# (D44, D96); C = 165.668 s, the backup's CPU total
# (meas-ci:background:2026-10-04), so it is alive at every instant of the segment.
# A pre-committed miss, its premise D9's: the one unasked backup under its own
# name, dpkg's daily `dpkg-db-backup`, finished in the second it started on the
# one desktop observed and cannot hold a backup segment.
#
# As the interactive counterparts, c7-compile is its base's first C seconds (D56): the
# build from 0 s bound whole, the editor departing at C, focus 2 s to C − 2 s;
# C = 225.458 s, the build's CPU as compiled under the file's seed, so it is alive
# at every instant of the segment.
#
# Batch modes: the batch job is itself the background work the attribute judges
# (recognition-vocabulary §1), so the counterpart is the same job unwanted, the
# label flipped on the same job and name, mode unchanged. No distro or vendor
# was found starting an ml-train, render or transcode job unasked (the
# 2026-09-13 verification: Jellyfin runs its transcoder as plain `ffmpeg` and
# Plex as `Plex Transcoder`, neither found converting media on a schedule);
# backup's one unasked job under its own name is sub-second (9.10 D9). Each
# file ships as a pre-committed miss.
#
# Every counterpart declares demand: calibration in its own recipe (Phase 7 spec
# decision 7); the regime is read from the manifest.
variants:
  - id: c7-browsing
    from: c1-browsing.timeline.yaml
    ops:
      - add-task: {id: upgrade, name: unattended-upgr, archetype: package-upgrade,
                   arrive: 0s, bind: {total_work: 26.385s}}
      - set-segments: [{from: 0s, to: 26.385s, mode: browsing,
                         attributes: {background_wanted: false, background: package-upgrade},
                         scenario: [S2, S17]}]
      - patch-task: {id: browser, depart: 26.385s}
      - patch-task: {id: renderers, depart: 26.385s}
      - set-focus: [{from: 2s, to: 24.385s, task: browser}]
      - set-operations: [{at: 13.1925s, task: browser, name: page-load}]
      - patch-meta: {demand: calibration}

