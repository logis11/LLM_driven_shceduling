# C1 — single-situation calibration: pure indexing, the `true` cell (building-
# plan §3 C1; Phase 7 spec decisions 3 and 8). Task set lifted from c2-p1b
# segment 1 (editor + tracker-miner-fs-3 in full-rescan state, cpu-batch per
# the archetypes.yaml binding note); total_work resized from 130 s to 30 s so
# the job finishes inside the 60 s segment (turnaround term). A user-initiated
# reindex of the same indexer: the label differs from the unwanted case by
# intent alone, which names and behaviour cannot show — a pre-committed miss.
meta:
  id: c1-indexing
  seed: 115
  demand: calibration

segments:
  - {from: 0s, to: 60s, mode: indexing,
     attributes: {background_wanted: true, initiated: user, pre_committed_miss: true},
     scenario: [S11, S14]}

tasks:
  - {id: editor, name: code, archetype: desktop-interactive,
     arrive: 0s, depart: 60s}
  - {id: hog, name: tracker-miner-fs-3, archetype: cpu-batch, arrive: 2s,
     bind: {total_work: 30s}}

focus:
  - {from: 2s, to: 58s, task: editor}
