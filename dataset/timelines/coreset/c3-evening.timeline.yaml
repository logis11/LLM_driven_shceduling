# C3 — evening arc (building-plan §3 C3): browsing -> gaming (+chat client)
# -> media playback.
# The four renderer-hidden tasks are the other tabs' page renderers of one
# five-tab window: five tabs from Firefox's Linux telemetry (glam; 9.10 D15,
# D16), one renderer per tab observed in Chrome (meas-ci:desktop:2026-10-04;
# 9.10 D126-D129, D131). The chat client, the Steam client and the two
# players, started mid-file, run their observed launch phases first, replayed
# (meas-ci:desktop:2026-10-04b; 9.10 D21, D132-D138); the game chain arrives
# steady, its source holding no launch data (D19, D21).
meta:
  id: c3-evening
  seed: 302

segments:
  - {from: 0s, to: 60s, mode: browsing, attributes: {background_wanted: true},
     scenario: [S2]}
  - {from: 60s, to: 300s, mode: gaming, attributes: {background_wanted: true},
     scenario: [S9, S5]}
  - {from: 300s, to: 420s, mode: media, attributes: {background_wanted: true},
     scenario: [S13]}

tasks:
  - {id: browser, name: chrome, archetype: web-browser,
     arrive: 0s, depart: 60s}
  - {id: renderers, name: chrome, archetype: renderer-hidden,
     arrive: 0s, depart: 60s, count: 4}
  - {id: game, name: Troy.exe, archetype: game-task-chain,
     arrive: 60s, depart: 300s, bind: {lane_share: 1.45,
           member_names: ["Task worker thr", "Task worker thr", "Task worker thr", "Task worker thr", dxvk-cs, dxvk-submit, winepulse_mainl, winepulse_timer, FAudio_AudioCli, Troy.exe, Troy.exe, Troy.exe, Troy.exe, Troy.exe, Troy.exe]}}
  - {id: chat, name: element-desktop, archetype: chat-client,
     arrive: 60s, depart: 300s}
  - {id: steam, name: steam, archetype: game-client,
     arrive: 60s, depart: 300s}
  - {id: video, name: mpv, archetype: video-player,
     arrive: 300s, depart: 420s}
  - {id: music, name: mpv, archetype: audio-player,
     arrive: 300s, depart: 420s}

focus:
  - {from: 2s, to: 58s, task: browser}

operations:
  - {at: 30s, task: browser, name: page-load}
