# C2 pair variants (building-plan §3 C2): each derived file differs from
# its base by exactly the ops below — the one-segment-diff discipline is
# structural. Seeds inherit from the bases (byte-discipline).
variants:
  # P1b — the load-bearing flip: the training run's place taken by Tracker's
  # first index of a home, `file-indexer` (meas-ci:background:2026-10-02b)
  # shown as `tracker-miner-f`, bound whole at its measured CPU total — the
  # measured indexer's own tables, not python3's under a rename (9.10 D6, D17,
  # D70, D74); segment 1 is that long in both files, so the job is alive at
  # every instant of it under every policy (D80). The index is a first login's,
  # as c7-indexing's: `initiated: session`, scenario S14 (D5, D79, D164).
  - id: c2-p1b
    from: c2-p1a.timeline.yaml
    ops:
      - patch-task: {id: hog, name: tracker-miner-f, archetype: file-indexer,
                     arrive: 60s, bind: {total_work: 39.435s}}
      - patch-segment: {index: 1, mode: indexing,
                        attributes: {background_wanted: false, initiated: session},
                        scenario: [S11, S14]}

  # P2b — same game-plus-background shape; wanted flips (S17 vs S10). The
  # unwanted job is the stock unattended upgrade's install stage,
  # `package-upgrade` shown as `unattended-upgr`, bound whole at its measured CPU
  # total (9.10 D3, D17, D40); segment 1 is that long in both files, so the job
  # is alive at every instant of it under every policy (D42).
  - id: c2-p2b
    from: c2-p2a.timeline.yaml
    ops:
      - patch-task: {id: download, name: unattended-upgr, archetype: package-upgrade,
                     arrive: 60s, bind: {total_work: 26.385s}}
      - patch-segment: {index: 1,
                        attributes: {background_wanted: false, background: package-upgrade},
                        scenario: [S9, S17]}

  # P2a-idle — the idle half of the c2-p2a bounding check (9.11 D21; 9.13): c2-p2a with
  # the download bound to `game-download-idle`, the entry that shares `game-download`'s
  # tables and declares `idle`; nothing else changes, the seed inherited, so the two
  # compiled files differ in that task's class alone. Outside the judging set; read by
  # 9.14's bounding check alone.
  - id: c2-p2a-idle
    from: c2-p2a.timeline.yaml
    ops:
      - patch-task: {id: download, archetype: game-download-idle}

  # P3b — user-initiated bulk -> scheduled bulk (S15): Déjà Dup's scheduled
  # weekly incremental, `incremental-backup` shown as `deja-dup`, bound whole at
  # its measured CPU total (meas-ci:background:2026-10-04; 9.10 D17, D119, D120);
  # segment 1 is as long in both files as the backup needs to end inside it (D123).
  - id: c2-p3b
    from: c2-p3a.timeline.yaml
    ops:
      - patch-task: {id: bulk, name: deja-dup, archetype: incremental-backup,
                     arrive: 60s, bind: {total_work: 165.668s}}
      - patch-segment: {index: 1, mode: backup,
                        attributes: {background_wanted: true, initiated: scheduled},
                        scenario: [S7, S15]}
