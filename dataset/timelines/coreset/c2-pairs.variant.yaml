# C2 pair variants (building-plan §3 C2): each derived file differs from
# its base by exactly the ops below — the one-segment-diff discipline is
# structural. Seeds inherit from the bases (byte-discipline).
variants:
  # P1b — the load-bearing flip: rename ONLY (plus the segment label).
  # tracker-miner-f stays bound to cpu-batch deliberately (full-rescan
  # state; archetypes.yaml binding note).
  - id: c2-p1b
    from: c2-p1a.timeline.yaml
    ops:
      - rename: {from: python3, to: tracker-miner-f}
      - patch-segment: {index: 1, mode: indexing,
                        attributes: {background_wanted: false}}

  # P2b — same game-plus-background shape; wanted flips (S17 vs S10). The
  # unwanted job is the stock unattended upgrade's install stage,
  # `package-upgrade` shown as `unattended-upgr`, bound whole at its measured CPU
  # total (9.10 D3, D17, D40); segment 1 is that long in both files, so the job
  # is alive at every instant of it under every policy (D42).
  - id: c2-p2b
    from: c2-p2a.timeline.yaml
    ops:
      - patch-task: {id: download, name: unattended-upgr, archetype: package-upgrade,
                     arrive: 60s, bind: {total_work: 26.385s}}
      - patch-segment: {index: 1,
                        attributes: {background_wanted: false, background: package-upgrade},
                        scenario: [S9, S17]}

  # P3b — user-initiated bulk -> scheduled bulk (S15).
  - id: c2-p3b
    from: c2-p3a.timeline.yaml
    ops:
      - patch-task: {id: bulk, name: borg, archetype: file-backup,
                     arrive: 60s, bind: {total_work: 75s}}
      - patch-segment: {index: 1, mode: backup,
                        attributes: {background_wanted: true, initiated: scheduled},
                        scenario: [S7, S15]}
