# C4 — distractor injection (building-plan §3 C4): clones of C1 files with
# a label-invariant process injected mid-segment; paired with their clean
# originals for the within-segment distractor-robustness measurement.
# Calibration class declared per variant (Phase 7 spec decision 7).
variants:
  - id: c4-gaming
    from: c1-gaming.timeline.yaml
    # the injected chat client is Element shown idle, no messages arriving
    # (9.10 D23); it runs its observed launch phase first, replayed
    # (meas-ci:desktop:2026-10-04b; 9.10 D21, D132-D138)
    ops:
      - add-task: {id: injected-chat, name: element-desktop,
                   archetype: chat-client, arrive: 30s, depart: 60s}
      - patch-meta: {demand: calibration}

  - id: c4-office
    from: c1-office.timeline.yaml
    # the 7z burst's 6 s is design, the injection's size (phase decision 3):
    # part of 9.7's measured archive of the Mahoney set, the set cached,
    # 4,882-5,283 s of CPU
    # (meas-ci:background:2026-09-19), an exception to 9.10 D17 (9.10 D161)
    ops:
      - add-task: {id: injected-burst, name: 7z, archetype: file-archiver,
                   arrive: 30s, bind: {total_work: 6s}}
      - patch-meta: {demand: calibration}

  - id: c4-compile
    from: c1-compile.timeline.yaml
    # the injected browser and its four hidden tabs' renderers run their
    # observed launch phases first, replayed — the browser's from
    # meas-ci:desktop:2026-10-04b, the renderers' traced to their 1,030 s
    # grace-settle from meas-ci:desktop:2026-10-05b (9.10 D21, D132-D138,
    # D152, D155, D156)
    ops:
      - add-task: {id: injected-browser, name: chrome,
                   archetype: web-browser, arrive: 30s, depart: 60s}
      # the four other tabs' page renderers of one five-tab window (glam;
      # meas-ci:desktop:2026-10-04; 9.10 D15, D126-D129, D131)
      - add-task: {id: injected-renderers, name: chrome,
                   archetype: renderer-hidden, arrive: 30s, depart: 60s,
                   count: 4}
      - patch-meta: {demand: calibration}
