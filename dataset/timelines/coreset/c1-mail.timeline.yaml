# C1 — single-situation calibration: pure mail (building-plan §3 C1; Phase 7
# spec decision 8). Task set lifted from c3-workday segment 3: the mode-defining
# task only (thunderbird-bin), not the arc's still-open browser and writer. One
# send, an operation of the mail-client task inside its focus window (design).
meta:
  id: c1-mail
  seed: 110
  demand: calibration

segments:
  - {from: 0s, to: 60s, mode: mail, attributes: {background_wanted: true},
     scenario: [S4]}

tasks:
  - {id: mailer, name: thunderbird-bin, archetype: mail-client,
     arrive: 0s, depart: 60s}

focus:
  - {from: 2s, to: 58s, task: mailer}

operations:
  - {at: 40s, task: mailer, name: send}
