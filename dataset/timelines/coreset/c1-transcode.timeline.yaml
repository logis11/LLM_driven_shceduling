# job finishes inside the 60 s segment (turnaround term).
meta:
  id: c1-transcode
  seed: 114
  demand: calibration

segments:
  - {from: 0s, to: 60s, mode: transcode,
     attributes: {background_wanted: true, initiated: user}, scenario: [S8]}

tasks:
