# scheduled and wanted, as P3b labels it); total_work resized from 75 s to
# 30 s so the job finishes inside the 60 s segment (turnaround term).
meta:
  id: c1-backup
  seed: 116
  demand: calibration

segments:
  - {from: 0s, to: 60s, mode: backup,
     attributes: {background_wanted: true, initiated: scheduled}, scenario: [S7, S15]}

tasks:
