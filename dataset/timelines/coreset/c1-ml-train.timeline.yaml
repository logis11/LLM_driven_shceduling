# C1 — single-situation calibration: pure ml-train (building-plan §3 C1;
# Phase 7 spec decision 8). An editor beside a training run: PyTorch's basic
# MNIST example, `cpu-batch`'s `python3` program (meas-ci:background:2026-10-03),
# shown as `python`, bound whole at its measured CPU total (9.10 D12, D17, D85).
# The segment is the smallest whole second by which the run ends under every
# policy — 2 s + the job's CPU and blocks + the editor's CPU as compiled under
# the file's seed, 1,611.161 s — so the turnaround term reads a finished job
# (D78's arithmetic); focus keeps the 2 s margins.
meta:
  id: c1-ml-train
  seed: 112
  demand: calibration

segments:
  - {from: 0s, to: 1612s, mode: ml-train, attributes: {background_wanted: true},
     scenario: [S11, S12]}

tasks:
  - {id: editor, name: code, archetype: code-editor,
     arrive: 0s, depart: 1612s}
  - {id: hog, name: python, archetype: cpu-batch, arrive: 2s,
     bind: {total_work: 1389.885s, program: python3}}

focus:
  - {from: 2s, to: 1610s, task: editor}
