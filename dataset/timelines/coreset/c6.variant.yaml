# C6 — resolution-limit files (building-plan §3 C6), the two derived ones
# (c6-dual is a novel base). Pre-committed misses, shipped so the limits
# are concrete.
variants:
  # Name-collision spoof: a process NAMED chrome bound to cpu-batch — the
  # stated limit of name-based recognition (F5). Authored by name collision
  # only; path-mismatch spoofing is out of schema.
  - id: c6-spoof
    from: c1-browsing.timeline.yaml
    ops:
      - add-task: {id: spoof, name: chrome, archetype: cpu-batch,
                   arrive: 20s, bind: {total_work: 30s}}
      - patch-segment: {index: 0, attributes: {wanted: true, spoof: true}}

  # Fold-internal change: browsing becomes a video call with the task set
  # unchanged — the canonical set does not change, no query fires; a
  # guaranteed miss, pre-registered as a scope boundary.
  - id: c6-fold
    from: c1-browsing.timeline.yaml
    ops:
      - set-segments:
          - {from: 0s, to: 30s, mode: browsing, attributes: {wanted: true},
             scenario: [S2]}
          - {from: 30s, to: 60s, mode: meeting, attributes: {wanted: true},
             scenario: [S3]}
