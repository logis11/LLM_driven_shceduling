# C6 — resolution-limit files (building-plan §3 C6), the two derived ones
# (c6-dual is a novel base). Pre-committed misses, shipped so the limits
# are concrete.
variants:
  # Name-collision spoof: a process NAMED chrome bound to cpu-batch — the
  # stated limit of name-based recognition (F5). Authored by name collision
  # only; path-mismatch spoofing is out of schema.
  - id: c6-spoof
    from: c1-browsing.timeline.yaml
    ops:
      - add-task: {id: spoof, name: chrome, archetype: cpu-batch,
                   arrive: 20s, bind: {total_work: 30s, program: spoof}, source: {total_work: design, program: design}}
      - patch-segment: {index: 0, attributes: {background_wanted: true, spoof: true}}

      - patch-meta: {demand: calibration}

  # Name-collision alias (9.20 decision 8; until 2026-10-12 the C5 tier-3 file
  # `c5-t3`): c1-media's two players wearing two real indexers' names, `baloo_file`
  # (KDE Baloo) and `tracker-miner-f` (GNOME Tracker). Another program's real name
  # on the whole foreground — the limit `c6-spoof` does not show. No recognizer
  # reaches `media` from these names, so the segment is a pre-committed miss.
  - id: c6-alias
    from: c1-media.timeline.yaml
    ops:
      - patch-task: {id: video, name: baloo_file}
      - patch-task: {id: music, name: tracker-miner-f}
      - patch-segment: {index: 0, attributes: {background_wanted: true, spoof: true, pre_committed_miss: true}}
      - patch-meta: {demand: calibration}

  # Fold-internal change: browsing becomes a call in the browser — the call
  # runs under the browser's own name, so the canonical set does not change and
  # no query fires; a guaranteed miss, pre-registered as a scope boundary.

  - id: c6-fold
    from: c1-browsing.timeline.yaml
    # the call runs its observed launch phase first: the call opened in the
    # running browser, binned onto its cycle grid (meas-ci:desktop:2026-10-04b;
    # 9.10 D30, D134, D136, D138)
    ops:
      - set-segments:
          - {from: 0s, to: 30s, mode: browsing, attributes: {background_wanted: true},
             scenario: [S2]}
          - {from: 30s, to: 60s, mode: meeting, attributes: {background_wanted: true},
             scenario: [S3, S2]}
      - add-task: {id: call, name: chrome, archetype: video-call,
                   arrive: 30s, depart: 60s}
      - patch-meta: {demand: calibration}
