# C2 P3 (base) — {kdenlive + its export}: user-initiated bulk; the variant
# swaps in Déjà Dup's scheduled weekly incremental (scheduled bulk). The export
# is `cpu-batch`'s `kdenlive_render` bound whole from 60 s (9.10 D105, D106).
# Segment 1 runs 60–326 s in both files; the length is 9.10 D123's, set on a
# shared lane; under the idle class (9.13) the variant's backup, 165.7 s of
# CPU in the about 166 s of lane the editor leaves, finishes about 0.3 s before
# the segment's end and is scored by its turnaround (9.14 decision 6's header
# rule; 9.16 decision D4); the export ends by about 99.5 s.
# The desktop's session processes are omitted, their active state unobservable on the runner (9.10 D28).
meta:
  id: c2-p3a
  seed: 203

segments:
  - {from: 0s, to: 60s, mode: video-edit, attributes: {background_wanted: true},
     scenario: [S7]}
  - {from: 60s, to: 326s, mode: render,
     attributes: {background_wanted: true, initiated: user}, scenario: [S7]}

tasks:
  - {id: editor, name: kdenlive, archetype: video-editor,
     arrive: 0s, depart: 326s}
  - {id: bulk, name: kdenlive_render, archetype: cpu-batch, arrive: 60s,
     bind: {total_work: 16.545s, program: kdenlive_render},
     source: {total_work: "meas-ci:background:2026-10-03c", program: [kdenlive, "meas-ci:background:2026-10-03c"]}}

input:
  - {from: 2s, to: 324s, task: editor}

focus:
  - {from: 0s, to: 326s, task: editor}

operations:
  - {at: 30s, task: editor, name: preview-render}
