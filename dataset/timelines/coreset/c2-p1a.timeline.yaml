# C2 P1 (load-bearing pair, base) — {code, python3-train}: a training run
# beside an editor; the variant (c2-pairs.variant.yaml) puts Tracker's first
# index of a home in its place, `file-indexer` shown as `tracker-miner-f`
# (9.10 D6, D80). Segment 1 is as long as the index's measured CPU total,
# 39.435 s, in both files (D80); python3 keeps its binding until its own item
# (D12).
meta:
  id: c2-p1a
  seed: 201

segments:
  - {from: 0s, to: 60s, mode: dev, attributes: {background_wanted: true},
     scenario: [S11]}
  - {from: 60s, to: 99.435s, mode: ml-train, attributes: {background_wanted: true},
     scenario: [S11, S12]}

tasks:
  - {id: editor, name: code, archetype: code-editor,
     arrive: 0s, depart: 99.435s}
  - {id: hog, name: python3, archetype: cpu-batch, arrive: 60s,
     bind: {total_work: 130s, program: python3}}

focus:
  - {from: 2s, to: 97.435s, task: editor}
