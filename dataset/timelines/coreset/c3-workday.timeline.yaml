# C3 — workday arc (building-plan §3 C3): chrome research -> +soffice
# writing -> +make compile -> mail send. The order is design; CpsMark+'s CA
# workflow defines the browsing -> office -> mail transitions (existence).
# The four renderer-hidden tasks are the other tabs' page renderers of one
# five-tab window: five tabs from Firefox's Linux telemetry (glam; 9.10 D15,
# D16), one renderer per tab observed in Chrome (meas-ci:desktop:2026-10-04;
# 9.10 D126-D129, D131). The writer and Thunderbird, started mid-file, run
# their observed launch phases first, replayed (meas-ci:desktop:2026-10-04b;
# 9.10 D21, D132-D138); the file ends inside Thunderbird's. The build is the
# user's build whole: the Linux kernel's defconfig built warm, `-j8` — 2,908
# object jobs at cap 8
# (meas-ci:build:2026-09-18; 9.10 D17, D18); the compile segment ends at the
# smallest whole second by which it ends under every policy (9.10 D78's
# arithmetic, D100's form), the mail segment after it.
meta:
  id: c3-workday
  seed: 301

segments:
  - {from: 0s, to: 60s, mode: browsing, attributes: {background_wanted: true},
     scenario: [S2]}
  - {from: 60s, to: 120s, mode: office, attributes: {background_wanted: true},
     scenario: [S1, S2]}
  - {from: 120s, to: 1485s, mode: compile, attributes: {background_wanted: true},
     scenario: [S11, S1, S2]}
  - {from: 1485s, to: 1545s, mode: mail, attributes: {background_wanted: true},
     scenario: [S4, S1, S2]}

tasks:
  - {id: browser, name: chrome, archetype: web-browser,
     arrive: 0s, depart: 1545s}
  - {id: renderers, name: chrome, archetype: renderer-hidden,
     arrive: 0s, depart: 1545s, count: 4}
  - {id: writer, name: soffice.bin, archetype: office-writer,
     arrive: 60s, depart: 1545s}
  - {id: build, name: make, archetype: build-orchestrator, arrive: 120s,
     bind: {spawn_count: 2908, parallelism_cap: 8, child_name: cc1}}
  - {id: mailer, name: thunderbird-bin, archetype: mail-client,
     arrive: 1485s, depart: 1545s}

focus:
  - {from: 2s, to: 58s, task: browser}
  - {from: 62s, to: 118s, task: writer}
  - {from: 1487s, to: 1543s, task: mailer}

operations:
  - {at: 30s, task: browser, name: page-load}
  - {at: 1525s, task: mailer, name: send}
