# C2 P2 (base) — gaming with a download the user started: an install of
# another game begun during play, which Steam starts at once although it
# pauses queued downloads when a game launches (steam-downloads; Valve's
# steam-for-linux #8821). The variant swaps in an unwanted job and flips
# the label (c2-pairs.variant.yaml).
meta:
  id: c2-p2a
  seed: 202

segments:
  - {from: 0s, to: 60s, mode: gaming, attributes: {background_wanted: true},
     scenario: [S9]}
  - {from: 60s, to: 120s, mode: gaming,
     attributes: {background_wanted: true, background: download, initiated: user},
     scenario: [S9, S10]}

tasks:
  - {id: game, name: game.exe, archetype: game-task-chain,
     arrive: 0s, depart: 120s, bind: {lane_share: 0.95}}
  - {id: steam, name: steam, archetype: game-client,
     arrive: 0s, depart: 120s}
  - {id: download, name: steam, archetype: game-download, arrive: 60s,
     bind: {total_work: 25s}}

focus: []
