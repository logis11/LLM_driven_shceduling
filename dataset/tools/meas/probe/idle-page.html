<!DOCTYPE html>
<!--
  Task 9.8, the stated page of the two renderer subjects (campaign/method.md §2 subject 3). Design, not an
  observation: no source states what a background tab contains, so this page is written down rather than chosen
  to look representative, and it is released with the raw records.

  It serves identical content at every origin. The only activity is one setInterval whose callback increments a
  counter and returns:

    - setInterval, not a single setTimeout, because intensive throttling applies to timers with a high nesting
      level and a one-shot timer never reaches it. The nesting level climbs as the interval repeats.
    - faster than the throttling cap, so a hidden page's wake RATE is Chromium's documented budget (one wake per
      second backgrounded, one per minute past the grace) rather than our choice of period.
    - trivial work per wake, so the measured CPU per wake is a floor: what a renderer costs when its page does
      nothing but stay alive. A callback sized to spend the 3 ms allowance would report a ceiling instead, and
      that ceiling would be multiplied by every renderer task in every timeline on the strength of no
      observation. Both renderer entries state the floor in their scope.

  Query parameters, all supplied by desktop/run.sh:

    ms=<int>            one period for the page's whole life; 0 means no timer at all (the hidden subject's
                        control tab, whose renderer must fall below the components' coverage cut).
    plan=<p:s,p:s,...>  a schedule the page walks from its own load: period p milliseconds for s seconds, 0
                        meaning no timer. The visible subject uses two steps — the timer, then none — so that
                        its second steady phase observes the same process tree as its first.

  THE PAGE DRIVES ITSELF. An earlier version had run.sh retype a URL into each window through the omnibox; the
  dry run of 2026-09-20 showed all three windows receiving the same keystrokes, because without a window
  manager xdotool windowactivate does not move X input focus, and two renderers kept their timers through the
  phase that was supposed to have none. Nothing here depends on input, focus or a window manager.

  The title is the instrument run.sh reads back, through xdotool getwindowname, which works per window without
  focus. It states the origin and the current step, so the run can VERIFY which step every window is on before
  it starts a phase, rather than assume. It is written once per step, never per tick: a per-tick title update
  would be work per wake and would drive the browser process as well as the renderer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>idle-page</title>
</head>
<body>
<p id="s">idle-page</p>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var n = 0, id = null;

  function say(label) {
    document.title = "idle-page " + location.origin + " " + label;
    document.getElementById("s").textContent = document.title;
  }

  function run(ms) {
    if (id !== null) { clearInterval(id); id = null; }
    if (ms > 0) { id = setInterval(function () { n++; }, ms); }
    say(ms > 0 ? ("timer " + ms + " ms") : "no timer");
  }

  var plan = (q.get("plan") || "").split(",").filter(Boolean).map(function (step) {
    var kv = step.split(":");
    return {ms: parseInt(kv[0], 10) || 0, s: parseFloat(kv[1]) || 0};
  });

  if (plan.length) {
    // one one-shot timer per step boundary, and nothing else: the steps are long, so this is a handful of wakes
    // over the page's life and none of them falls inside a measured phase
    var i = 0;
    (function step() {
      run(plan[i].ms);
      var secs = plan[i].s;
      if (++i < plan.length) { setTimeout(step, secs * 1000); }
    })();
  } else {
    run(parseInt(q.get("ms") || "100", 10));
  }
})();
</script>
</body>
</html>
