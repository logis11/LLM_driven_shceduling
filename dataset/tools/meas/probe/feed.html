<!doctype html>
<!-- The scripted page for the Chrome `page-load` operation (9.5 follow-ups spec, decisions 7–10).
     Design, after PCMark 10's Web Browsing archetypes (a social-media page whose feed is built and
     updated by script; a shop page with high-resolution images; Technical Guide pp. 52–53) and
     CpsMark+'s pages "containing text, pictures, JS scripts" served from a local server (§4.3.3).
     On load the script builds a 300-item feed with text and 30 distinct 1600×1200 images, runs a
     sort-and-aggregate pass over 200 000 generated records, and after the next paint sets the
     window title to "loaded <i> <ms>", which the driver polls as the completion signal. -->
<html><head><meta charset="utf-8"><title>feed</title>
<style>
body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:16px}
.post{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.post img{width:100%;height:auto;border-radius:6px}
.meta{color:#666;font-size:12px}
.stats{position:sticky;top:0;background:#fff;padding:8px;border-bottom:1px solid #ccc}
</style></head>
<body>
<div class="stats" id="stats">building…</div>
<div id="feed"></div>
<script>
(function () {
  const t0 = performance.now();
  const i = new URLSearchParams(location.search).get('i') || '0';
  const N_POSTS = 300, N_IMAGES = 30, N_RECORDS = 200000;
  const words = 'the quick brown fox jumps over the lazy dog while the office desktop schedules its interactive work'.split(' ');
  function para(seed, n) {
    let s = [];
    for (let k = 0; k < n; k++) s.push(words[(seed * 7 + k * 13) % words.length]);
    return s.join(' ') + '.';
  }
  // 1. the feed: text and pictures
  const feed = document.getElementById('feed');
  const frag = document.createDocumentFragment();
  for (let p = 0; p < N_POSTS; p++) {
    const d = document.createElement('div'); d.className = 'post';
    const h = document.createElement('h3'); h.textContent = 'Post ' + p + ': ' + para(p, 6); d.appendChild(h);
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = 'user' + (p % 17) + ' · ' + (p * 37 % 59) + ' min ago'; d.appendChild(m);
    for (let q = 0; q < 3; q++) { const e = document.createElement('p'); e.textContent = para(p * 3 + q, 40); d.appendChild(e); }
    if (p % 10 === 0) { const img = document.createElement('img'); img.src = 'img-' + ((p / 10) % N_IMAGES) + '.jpg'; img.width = 1600; img.height = 1200; d.appendChild(img); }
    frag.appendChild(d);
  }
  feed.appendChild(frag);
  // 2. the script work: generate, sort and aggregate records
  let x = 12345 + parseInt(i, 10);
  const rnd = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const recs = new Array(N_RECORDS);
  for (let k = 0; k < N_RECORDS; k++) recs[k] = { id: k, score: rnd(), cat: (k * 31) % 23 };
  recs.sort((a, b) => a.score - b.score);
  const agg = {};
  for (const r of recs) agg[r.cat] = (agg[r.cat] || 0) + r.score;
  const top = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0] + ':' + e[1].toFixed(1)).join(' ');
  // 3. completion after the first paint of the built page
  function done() {
    const images = Array.from(document.images);
    Promise.all(images.map(im => im.complete ? Promise.resolve() : new Promise(res => { im.onload = im.onerror = res; }))).then(() => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const ms = Math.round(performance.now() - t0);
        document.getElementById('stats').textContent = 'built ' + N_POSTS + ' posts, ' + N_RECORDS + ' records in ' + ms + ' ms; top ' + top;
        document.title = 'loaded ' + i + ' ' + ms;
      }));
    });
  }
  if (document.readyState === 'complete') done(); else window.addEventListener('load', done);
})();
</script>
</body></html>
