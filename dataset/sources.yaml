# dataset/sources.yaml — machine registry of everything the workload
# dataset derives values or structure from.
#
# Companion to docs/references.md, which owns every citation string and all
# citation-constituent fields (cite, url, accessed, pinned_version). This file
# carries machine/derivation fields only.
#
# Rules (enforced by the dataset linter):
#   - every id here MUST have an entry in docs/references.md (subset lint);
#     ids here without a docs/references.md entry fail CI
#   - source tags in dataset files are `<id>` or `<id>:<locator>`; when an entry
#     declares `locator_pattern`, the linter validates the locator against it;
#     no `locator_pattern` = bare-id tags only
#   - `type`: scholarly | deployed-system | measurement (citation tier follows
#     via docs/references.md: scholarly -> numbered bib; deployed-system -> footnote,
#     existence claims only)
#   - `notes`: what the source establishes and its scope limits — never our
#     modeling on top of it (that lives in archetypes.yaml `modeling_notes`).
#     A source tag justifies values and described structure, never field names.
#   - adding a source: mint the id per the docs/references.md id rule, add the entry
#     there, then add it here only if the dataset derives from it
#   - `meas-pending` is the placeholder sentinel for parameters awaiting the CI
#     measurement campaign; the linter rejects it after the schema freeze

sources:

  # ---- stimulus recordings (replayed input; any platform, D6) -------------

  swell-icmi14:
    type: scholarly
    locator_pattern: "^(word|outlook|ie)-c[0-9]+$"
    notes: >-
      SWELL-KW uLog recordings (DANS doi:10.17026/dans-x55-69zp v4,
      CC-BY-NC-SA-4.0): per-keystroke and per-click/drag/wheel timestamps with
      the focused application, 25 knowledge workers, ~3 h each, free
      composition on Windows (2012). Establishes the replayed input streams
      of the measured interactive archetypes — timing only (keys and
      positions unused): word-c1 (Word, neutral condition), outlook-c23
      (Outlook, interruption conditions; no c1 keystrokes), ie-c1 (Internet
      Explorer, neutral). Timestamps quantised at the 15.6 ms Windows tick;
      motion between pointer events not recorded. Streams built by
      dataset/tools/stimulus/build_streams.py from the files listed in
      dataset/tools/meas/probe/swell-ulog-files.json.

  # ---- behavior parameters (Role B) --------------------------------------

  rt-app:
    type: deployed-system
    notes: >-
      Establishes the JSON task-model precedent: run/period/deadline in
      microseconds; timer{ref,period} gives drift-free absolute periodic wakes
      (the precedent for our TIMER primitive). Schema-shape precedent only;
      no numeric values are derived from it.

  lavd-ossna24:
    type: deployed-system
    locator_pattern: "^s\\d+$"
    notes: >-
      Talk slides; observations established: ~300 tasks scheduled system-wide
      while running a game (including system tasks), ~90% long-lived,
      wine/graphics/audio servers take 30-40% of scheduling (s12);
      per-schedule runtimes few-hundred-us average to few-ms max (wineserver
      ~260 us, worker ~1.65 ms), stable and predictable per task (s13); 70-75%
      of scheduling initiated by waiting syscalls (s14); tasks tightly linked
      in waiter-waker graphs, a task sequence serving one job from input to
      display (s16-s17); top 30-40 tasks = 95% of scheduling, 15-20 game
      tasks take 60-70%. States no frame period or frame budget. LAVD
      defines no spec format: any schema encoding of these observations
      (topology/chain fields, linearizing the s16 graph) is our modeling and
      lives in archetypes.yaml modeling_notes. Slides are footnote-tier
      despite carrying numbers.

  ocallahan-atc17:
    type: scholarly
    locator_pattern: "^sec-[0-9.]+$"
    notes: >-
      "make forks and execs 2430 processes, mostly short-lived" (sec-4.3,
      Linux kernel-build workload; written "2430" in the paper). Grounds the
      fork-burst count and short-lived character of compiler children only;
      the paper gives no lifetime distribution.

  coetzee-arxiv12:
    type: scholarly
    locator_pattern: "^sec-[0-9.]+$"
    notes: >-
      "the Linux kernel build's enormous number of short-lived processes"
      (sec-9). The characterization is specific to the Linux kernel build,
      not builds generally — cite it that way. Preprint (UCB TR); secondary
      corroboration behind ocallahan-atc17.

  # ---- scenario taxonomy (Role A) ----------------------------------------

  cpsmark-tbench23:
    type: scholarly
    locator_pattern: "^(table-\\d+|sec-[0-9.]+)$"
    notes: >-
      Establishes the existence of the office, browsing, mail, photo,
      transcode and archive scenarios (S1, S2, S4, S6, S8, S16) and the
      transcode's definition, its HandBrake workload (9.10 D11, D95): four
      office usage scenarios merged into two modules (CA light/middleweight,
      CC heavyweight); user-profile tiers (table-1); named applications with
      versions (table-2); the CA cooperative workflow's order (Internet ->
      creation -> document processing -> email delivery), cited for its
      transitions' existence (9.10 D29); hardware sensitivity per workload
      and module (table-4), the CC module's best graphics-card configuration
      performing 1.77 times its base configuration and the CA module showing
      no significant difference (sec-4.7.2). Scope limits: Windows 10 applications — the
      Linux name mapping is ours; no gaming scenario; no process-level burst
      timing.

  pcmark10:
    type: deployed-system
    notes: >-
      Existence only (9.10 D33): the scenario groups and their application
      lists — Essentials (web browsing, video conferencing, app start-up),
      Productivity (spreadsheets, writing), Digital Content Creation (photo/
      video editing, rendering), Gaming. The guide times each workload's
      scripted tasks; it documents no per-process timing.

  sysmark30:
    type: deployed-system
    notes: >-
      Existence only (9.10 D33): four scenarios and their application
      lists — Office Applications, General Productivity (incl. archiving and
      unpacking a mixed file set, OCR, browsing), Photo Editing, Advanced
      Content Creation (incl. a multitasking workload switching photo<->video
      editing). A second industry taxonomy beside PCMark.

  sysmark25:
    type: deployed-system
    notes: >-
      Existence only (9.10 D33): the Productivity scenario's description
      names software development (code compilation), no compiler or IDE in
      any application list; Productivity, Creativity and Responsiveness are
      SYSmark 2018's scenarios as well.

  procyon:
    type: deployed-system
    notes: >-
      Establishes existence of a local-AI-inference desktop scenario (S12
      precedent). Public docs are light on internals; scenario-existence
      citation only.

  gamemode-docs:
    type: deployed-system
    notes: >-
      Establishes that a foreground-game resource-priority category ships in
      a major OS: exclusive/priority CPU access for the focused foreground
      game, granted as exclusive CPU sets to an app that is in the foreground
      and has focus, with a user opt-out in Settings; documented APIs
      (expandedresources.h). Existence of the category and of the whitelist
      design point only. NOT established here, per the verification note in
      docs/references.md (2026-09-12): how a game is detected, and whether
      background activity is suppressed, updates deferred or notifications
      held. The conceptual portal page carrying those claims has not been
      read; do not derive them from this source.

  steam-downloads:
    type: deployed-system
    notes: >-
      Establishes the "Allow Downloads During Gameplay" check box (Steam ->
      Settings -> Downloads), that downloads pause during gameplay by
      default, and a per-game setting the article leaves unnamed (S10;
      9.10 D7). Existence only.

  steamos-refresh:
    type: deployed-system
    notes: >-
      Establishes the Steam Deck LCD's 60 Hz default refresh and the in-game
      refresh / frame-limit setting (default 60 Hz limited to 60, 30 or 15
      fps; slider down to 40 Hz; "60hz = 16.66ms/frame"). Existence only;
      the value 16667 us is 1/60 s arithmetic and the display-paced modeling
      is ours (archetypes.yaml modeling_notes).

  dkms-man:
    type: deployed-system
    notes: >-
      Establishes the DKMS framework and its autoinstall action / autoinstaller
      service: kernel modules rebuilt and installed for a newly booted kernel
      without user action, under the process name `dkms` (S11 unwanted
      counterpart, C7). Existence only.

  dkms-debian:
    type: deployed-system
    notes: >-
      Establishes that dkms is a packaged distribution component whose stated
      purpose includes rebuilding modules as kernels are upgraded (S11 unwanted
      counterpart, C7). Existence only.

  # ---- segment structure & user behavior (Role C) ------------------------

  gonzalez-chi04:
    type: scholarly
    notes: >-
      Establishes the working-sphere averages: ~12 min per working sphere
      (11 min 28 s raw; 12 min 18 s excluding brief disruptions), ~10 spheres
      per person-day; ~3 min per task and ~2 min 11 s per tool/document
      before switching. Averages only, knowledge workers. (The figures our
      earlier docs attributed to CHI 2005/2008 live here.)

  mark-chi05:
    type: scholarly
    notes: >-
      Companion figure ~11 min per working sphere before switching; internal
      vs external interruptions roughly equal (managers 59.2%/40.8%).
      Averages only.



  dubroy-chi10:
    type: scholarly
    notes: >-
      Logged concurrent-tab distributions: modal count 1, per-user medians
      mostly 1-6, long right tail (max 42). Scope limits: N=21 recruited tab
      users, 2009 single-process Firefox. No public dataset.

  chang-chi21:
    type: scholarly
    notes: >-
      Modern tab-behavior corrector: median tab-overwhelm threshold 8 tabs
      (IQR 5-12); ~8% of participants had >10 tabs open at a capped snapshot.
      Self-report, not logging — justifies a fatter modern tail over the
      2010 logged data, not a distribution.

  mozilla-testpilot10:
    type: deployed-system
    notes: >-
      Only large-N logged concurrent-tab data: mean ~3.2 tabs (N~27k, one
      week, 2010); median per-user weekly max <8; 25% of users reached >=11.
      Only aggregate tables survive (mirror). Carries the honest-limitation
      line: no post-2010 large-scale logged tab distribution exists publicly.

  focal-arxiv26:
    type: scholarly
    notes: >-
      Establishes the A->B->A interruption session structure (100 sessions:
      long creative task interrupted by short browsing) and 320 interleaved
      multitask sessions with app names + window titles. Structure precedent
      only: preprint, and the sessions are scripted reconstructions from
      VideoGUI, not natural usage. Data terms restrict redistribution;
      methodological reuse is unrestricted.

  # ---- grounds of the timelines' bound values (9.10 D32; 9.18) -------------

  pytorch-examples:
    type: deployed-system
    notes: >-
      PyTorch's "Basic MNIST Example" at commit acc295d: the job
      `cpu-batch`'s `python3` program was measured on (9.10 D12, D82-D85), run
      as the README's `python main.py` with `--save-model` at the defaults.
      Grounds the bound program of the training-run tasks (`c1-ml-train`,
      `c7-ml-train`, `c2-p1a`), with the campaign that measured it. Identifies
      the job; no claim about what or how often desktop users train.

  kdenlive:
    type: deployed-system
    notes: >-
      Kdenlive 23.08.5 as Ubuntu 24.04 packages it: the render dialog starts
      `kdenlive_render`, which runs `melt-7` on the project's playlist with the
      shipped default MP4-H264/AAC profile (9.10 D101-D106). Grounds the bound
      program of the export tasks (`c1-render`, `c7-render`, `c2-p3a`), with
      the campaign that measured it. Identifies the program and its profile;
      no claim about what users export.

  glam:
    type: deployed-system
    notes: >-
      Mozilla's GLAM public API, Firefox Desktop release, probe
      browser_engagement_max_concurrent_tab_count (versions 137-156, Linux,
      Windows and Darwin): the per-subsession maximum of open tabs across all
      windows. Grounds the hidden tabs' `count: 4` of every file that shows
      Chrome (9.10 D15, D130, D131), read with the desktop campaign that
      measured a hidden renderer. Firefox's distribution read for Chrome's
      tab count is our modeling (archetypes.yaml `renderer-hidden`).

  # ---- our measurements --------------------------------------------------

  meas-ci:
    type: measurement
    locator_pattern: "^[a-z0-9_-]+:(\\d+|\\d{4}-\\d{2}-\\d{2}[a-z]?)$"
    notes: >-
      Our CI measurement campaigns (workflow:campaign locator — the launch
      date of the campaign's first batch; a run number names a one-run
      campaign from before that form). A measured value is this software on
      this machine: a GitHub-hosted ubuntu-24.04 runner, pinned to one CPU of
      the AMD EPYC 7763 only (machine gate), its runner spec written into the
      archetype's scope — never desktop truth. The campaigns observe per-wake
      runs and waits from the scheduler trace, per-process CPU and block-I/O
      delay at exit, and network waits and bytes per wake from socket rows.
      Repeats are added until the stability rule holds for every carried
      value: the 95 % confidence half-width of the across-repeat mean within
      5 % of it or 1 us, over at least five same-machine repeats
      (dataset/tools/meas/stability.py); a value whose spread follows the
      machine is carried with its half-width. One-run campaigns predate the
      rule and the machine gate.

  meas-pending:
    type: measurement
    notes: >-
      Placeholder sentinel for parameters awaiting the CI campaign. Valid
      only until the schema freeze; the linter rejects any meas-pending tag
      after freeze.

  # ---- ground of the generated layer's name limit (9.20 decision 7) --------------------
  linux-sched-h:
    type: deployed-system
    notes: "Linux kernel source, include/linux/sched.h at v6.17: `TASK_COMM_LEN = 16`, the comm field NUL-terminated and zero-padded, so a process name is at most 15 characters. Grounds `comm_limit` in dataset/grids.yaml: every name the generated layer sets is checked against it."

  # ---- grounds of the flap-stress set's intervals (9.19 decision 7; the hold-time plan's step 3) ----

  feral-gamemode:
    type: deployed-system
    notes: >-
      Feral Interactive's GameMode daemon, release 1.8.2: the shipped example
      configuration's `reaper_freq=5`, "the reaper thread will check every 5
      seconds for exited clients, for config file changes, and for the CPU/iGPU
      power balance". Grounds the flap-stress set's 5 s interval (`grids.yaml`)
      as the check interval of a shipped desktop game-mode daemon. Existence
      of the value; no claim that 5 s is right for any other switch.

  tuned:
    type: deployed-system
    notes: >-
      Red Hat's tuned daemon, release v2.28.0: `tuned-main.conf`'s dynamic
      tuning `update_interval = 10` ("Update interval for dynamic tunings (in
      seconds)") over a `sleep_interval = 1`; dynamic tuning itself ships off
      (`dynamic_tuning = 0`). Grounds the flap-stress set's 10 s interval
      (`grids.yaml`) as the update interval of a shipped daemon that re-tunes
      the system on what it observes. Existence of the value only.

  systemd-oomd:
    type: deployed-system
    notes: >-
      systemd's `oomd.conf(5)`: `DefaultMemoryPressureDurationSec=` "sets the
      amount of time a unit's control group needs to have exceeded memory
      pressure limits" before systemd-oomd acts, "defaults to 30 seconds";
      the limit a 60 % fraction of a 10 s window. Grounds the flap-stress set's
      30 s interval (`grids.yaml`) as the sustain-before-acting duration of a
      shipped system daemon. Existence of the value only.
